"58","工程化活菌与微生态药物","新分子模态","3.40","保持观察"],["59","靶向递送的体内 CAR-T","自免与免疫重置","3.30","保持观察"],["60","磁遗传与磁热纳米","物理介入（磁与场）","3.25","保持观察"],["61","呼气组学与无创代谢检测","诊断与监测","3.10","暂不投入"],["62","纯算法与虚拟细胞模型","AI 药物发现","3.05","暂不投入"],["63","多癌种早筛","诊断与监测","3.00","暂不投入"],["64","部分重编程与抗衰老","器官与再生","2.85","暂不投入"]]},{"p":"全部为推断，依据各路线的公开进展与本报告前十九章的赛道结论。"}],"children":[]},{"h":"20.4 权重情景检验","lvl":2,"blocks":[{"p":"表 20-4 得分前二十的路线在四套情景下的表现"},{"t":[["技术路线","基准","等权","前瞻性加重","证据优先"],["小激活 RNA（RNAa）","4.20","4.00","4.33","3.93"],["表观遗传编辑","4.20","4.00","4.32","4.05"],["侵入式脑机接口（读取方向）","4.20","3.86","4.28","4.09"],["脑机接口上游部件与植入装备","4.20","4.29","4.18","4.18"],["RNA 编辑（ADAR 招募）","4.15","3.86","4.27","4.00"],["α 核素与锕 225 供应","4.10","4.00","4.25","3.85"],["异种器官移植","4.10","3.86","4.25","3.83"],["高通量扰动筛选","4.10","4.14","4.09","4.20"],["皮下蛋白型 TCE","4.05","4.00","4.03","4.06"],["肝外递送","4.05","3.86","4.20","3.80"],["肝与肾毒性评价类器官","4.05","4.14","4.05","4.05"],["自适应与闭环神经调控","4.05","4.00","4.03","4.06"],["器官常温灌注与体外修复","4.05","4.29","3.90","4.28"],["连续多指标生理监测","4.05","4.00","4.03","4.06"],["肝靶向 siRNA","4.00","4.00","3.80","4.39"],["体内碱基编辑与先导编辑","4.00","3.71","4.15","3.75"],["神经免疫调控（电刺激治自免）","4.00","3.86","4.17","3.74"],["超声开放血脑屏障与辅助递送","4.00","3.71","4.15","3.75"],["硼中子俘获治疗（BNCT）","3.95","4.00","3.98","3.83"],["自产数据的湿实验闭环平台","3.95","4.00","3.97","3.95"]]},{"p":"全部为推断。"},{"p":"在四套情景下稳定进入前列的路线包括小激活 RNA、表观遗传编辑、RNA 编辑、脑机接口上游部件、α 核素供应和器官常温灌注，排序对权重设置不敏感。对权重最敏感的是两类极端路线。一类是前瞻性高而证据薄的方向，例如活细胞测量、量子传感和大片段基因写入，在证据优先情景下大幅下滑，这类路线只适合放进期权池；另一类是证据扎实而前瞻性一般的方向，例如肝靶向 siRNA、经颅磁刺激加速方案和器官常温灌注，在前瞻性加重情景下排名下降，但在证据优先情景下进入前列，适合作为组合中的压舱位置（推断）。"}],"children":[]},{"h":"20.5 前沿路线的期权池标准","lvl":2,"blocks":[{"p":"前沿路线不能直接套用赛道模型得出投或不投的结论，因为证据成熟度一项天然接近底分，总分会被系统性压低。期权池对这些路线只回答一个问题，即什么情况下把它移入正式打分。"},{"p":"表 20-5 期权池评估标准"},{"t":[["判断项","具体要求"],["科学是否成立","核心机制有本团队之外的独立复现，而非单一论文或企业自述"],["工程瓶颈","限制因素已被明确识别并可量化，而非笼统表述为技术挑战"],["首个场景","有明确的首个落地场景与付费方，而非罗列全部潜在适应症"],["监管路径","按药品、医疗器械还是组合产品申报已经清楚，或已有同类先例"],["团队能力","除科学家之外具备工程化与注册能力，或已绑定具备该能力的合作方"],["触发条件","每条路线单独列出进入正式打分的触发事件与放弃条件"]]},{"p":"全部为推断。"},{"p":"期权池中的路线不给出会投或不会投的结论，只跟踪触发条件。触发条件达成后按第三章的赛道模型重新打分，再决定是否立项。放弃条件达成后从跟踪清单中移除，并在后续报告中说明原因。"}],"children":[]}]},{"h":"第二十一章 重点赛道内部技术路线","blocks":[{"p":"本章按赛道顺序展开已入选赛道内部的技术路线。每一节先给出该赛道内各条路线的得分与定位，再逐条说明判断依据、代表企业、证据等级以及改变判断所需的触发条件与放弃条件。赛道本身的行业分析、头部企业与投资判断见第四章至第十九章，本章处理路线之间的差异与对应标的。"}],"children":[{"h":"21.1 自免与免疫重置","lvl":2,"blocks":[{"p":"表 21-1 自免与免疫重置内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["皮下蛋白型 TCE","4.05","9","重点跟踪","德琪医药、先声再明"],["mRNA 编码 TCE","3.90","22","主动看项目","艾博生物、剂泰科技"],["靶向递送的体内 CAR-T","3.30","59","保持观察","微滔生物（Vivacta）、虹信生物"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"皮下蛋白型 TCE","lvl":3,"blocks":[{"p":"蛋白型 TCE 是免疫重置当前最确定的形态，用皮下给药和可控剂量换取比自体细胞治疗更低的安全风险。扣分项是拥挤度，CD19×CD3 与 BCMA×CD3 组合国内在研数量多，差异化要落在靶点组合、组织穿透和给药间隔上（推断）。"},{"p":"建议跟踪标的为德琪医药（CD3 双抗平台已进入临床，自免适应症拓展路径清晰）、先声再明（SIM0660 已获全球权益授权，验证了国内资产的买方认可度）。"},{"p":"核心判断为人体 B 细胞清除逻辑已验证，皮下现货给药，国内供给充足。证据等级 B。触发条件为出现持续无药缓解超过 12 个月的自免人体数据。放弃条件为同靶点组合缺乏头对头差异化数据且授权价格下行。"}],"children":[]},{"h":"mRNA 编码 TCE","lvl":3,"blocks":[{"p":"体内表达把蛋白生产转移到患者体内，艾博生物 ABO2203 的 3 例难治性继发免疫性血小板减少症患者出现外周与骨髓 B 细胞清除，6 个月随访未发生细胞因子释放综合征，诺华随后以 5.75 亿美元首付款获得全球权益。证据仍是无对照的 3 例，毒性发生后难以像蛋白药物那样快速撤除暴露，科学成立度因此只给中位分。"},{"p":"建议跟踪标的为艾博生物（国内唯一有人体数据并完成大额全球授权的 mRNA 编码 TCE 标的）、剂泰科技（器官富集 LNP 递送与体内表达结合，递送端差异化明显）。"},{"p":"核心判断为首例人体数据与跨国药企交易同时出现，暴露控制仍待验证。证据等级 B。触发条件为扩大到 10 例以上自免患者并显示可重复给药。放弃条件为出现与表达失控相关的严重不良事件。"}],"children":[]},{"h":"靶向递送的体内 CAR-T","lvl":3,"blocks":[{"p":"体内 CAR-T 省去体外制备环节，是免疫重置中前瞻性最高的形态。2026 年 8 月诺华暂停自免 CAR-T 试验后，整个自体路线的安全性标准被抬高，体内路线尚无足够人体数据回答表达量控制问题，定位为期权跟踪。"},{"p":"建议跟踪标的为微滔生物（Vivacta）（体内 CAR-T 方向国内进度靠前，机构背书集中）、虹信生物（产业资本与国资同时进入，适合在安全性数据出现后跟进）。"},{"p":"核心判断为一次给药重编程 T 细胞，安全性证据最少。证据等级 B。触发条件为首个自免适应症人体数据显示可控的 B 细胞清除深度。放弃条件为出现靶向载体脱靶导致的器官毒性。"}],"children":[]}]},{"h":"21.2 诱导接近","lvl":2,"blocks":[{"p":"表 21-2 诱导接近内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["分子胶降解剂","3.90","23","主动看项目","格博生物（GluBio）、超阳药业"],["共价与变构结合位点","3.85","31","主动看项目","诺诚健华、思璞锐"],["非降解型诱导接近","3.70","43","主动看项目","思璞锐"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"分子胶降解剂","lvl":3,"blocks":[{"p":"分子胶以小分子形式实现蛋白降解，口服给药和成本结构都优于生物药，国内在化学合成与结构优化上有人力成本优势。扣分项在靶点同质化，CRBN 底物受体相关项目集中度高（推断）。"},{"p":"建议跟踪标的为格博生物（GluBio）（分子胶平台已有对外授权，靶点选择避开最拥挤区间）、超阳药业（口服降解剂管线推进较快，但核心数据为企业自述，等级 D）。"},{"p":"核心判断为口服小分子，可降解传统不可成药靶点，交易活跃。证据等级 B。触发条件为新型 E3 连接酶在人体内实现可测量的降解。放弃条件为主流靶点出现不可逆的脱靶毒性。"}],"children":[]},{"h":"共价与变构结合位点","lvl":3,"blocks":[{"p":"共价结合把不可成药靶点变成可成药靶点，KRAS 抑制剂的商业化验证了这条路线。竞争已经形成，国内进入者需要在选择性和耐药突变覆盖上找差异（推断）。"},{"p":"建议跟踪标的为诺诚健华（共价抑制剂有商业化产品验证，耐药突变覆盖能力待观察）、思璞锐（化学平台能力可支撑新结合位点开发）。"},{"p":"核心判断为 KRAS 等靶点已验证，化学壁垒高。证据等级 B。触发条件为针对已知耐药突变的后线分子显示临床获益。放弃条件为同靶点国内进入临床数量继续上升而差异化不足。"}],"children":[]},{"h":"非降解型诱导接近","lvl":3,"blocks":[{"p":"诱导接近的底层逻辑是把两个蛋白强行拉近，降解只是其中一种结果。把同一逻辑用于激酶招募或去泛素化可以打开新靶点空间，目前多停留在学术和临床前阶段，国内布局很少，窗口期相对宽松（推断）。"},{"p":"建议跟踪标的为思璞锐（诱导接近平台可向非降解功能延伸，是国内少数有底层平台的团队）。"},{"p":"核心判断为把诱导接近用于磷酸化、乙酰化等非降解功能，竞争尚未形成。证据等级 C。触发条件为首个非降解型诱导接近分子进入临床。放弃条件为机制在人体内无法达到有效接近效率。"}],"children":[]}]},{"h":"21.3 小核酸","lvl":2,"blocks":[{"p":"表 21-3 小核酸内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["小激活 RNA（RNAa）","4.20","1","重点跟踪","中美瑞康"],["肝外递送","4.05","10","重点跟踪","舶望制药、中美瑞康、靖因药业"],["肝靶向 siRNA","4.00","15","重点跟踪","瑞博生物、圣因生物"],["ASO 与剪接调控","3.70","44","主动看项目","瑞博生物"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"小激活 RNA（RNAa）","lvl":3,"blocks":[{"p":"RNAa 通过小激活 RNA 上调内源基因表达，与以沉默为主的 siRNA 形成互补，适合单倍剂量不足类疾病和抑癌基因恢复。机制由中国团队首创，国内竞争者少，但全球范围内进入临床的项目数量仍然有限，证据成熟度低于 siRNA。"},{"p":"建议跟踪标的为中美瑞康（全球范围内进入临床的 RNAa 项目几乎集中于该公司，机制为中国原创）。"},{"p":"核心判断为中国原创机制，从沉默基因转向激活基因。证据等级 B。触发条件为膀胱癌 II 期出现可重复的完全缓解率。放弃条件为靶基因激活在人体内无法达到治疗所需倍数。"}],"children":[]},{"h":"肝外递送","lvl":3,"blocks":[{"p":"肝外递送决定小核酸能否离开肝脏去做肌肉、中枢和肾脏适应症，是比机制本身更关键的壁垒。诺华在 2026 年 2 月完成对 Avidity 的收购，确认了抗体寡核苷酸偶联这条肌肉递送路线的产业价值，国内同类平台的议价能力随之上升（推断）。"},{"p":"建议跟踪标的为舶望制药（肝外递送与长效平台同时推进，跨国药企两次合作形成连续背书）、中美瑞康（肝外递送平台已有系统给药的人体项目，递送端壁垒最直接）、靖因药业（由专业医疗基金联合创立，递送方向定位清晰）。"},{"p":"核心判断为递送是全行业瓶颈，突破者可复制到多个适应症。证据等级 B。触发条件为同一递送平台在两个以上肝外组织取得人体生物标志物改善。放弃条件为递送效率在人体内与动物模型出现系统性落差。"}],"children":[]},{"h":"肝靶向 siRNA","lvl":3,"blocks":[{"p":"肝靶向 siRNA 是整个核酸领域唯一完成商业化闭环的路线，适应症集中在心血管代谢和罕见病。扣分项在估值与窗口，国内在研项目密集，新进入者很难在成熟靶点上取得定价权（推断）。"},{"p":"建议跟踪标的为瑞博生物（已上市并具备完整产业链，是存量赛道中确定性最高的标的）、圣因生物（减重与肾病靶点已完成大额对外授权）。"},{"p":"核心判断为 GalNAc 递送已商业化验证，但窗口正在关闭。证据等级 A。触发条件为出现尚未被占据的大适应症靶点。放弃条件为成熟靶点授权首付款继续下行。"}],"children":[]},{"h":"ASO 与剪接调控","lvl":3,"blocks":[{"p":"反义寡核苷酸在脊髓性肌萎缩等中枢适应症已有上市药物，鞘内给药路径成熟。国内公司多为跟随，创新空间集中在化学修饰与给药频次（推断）。"},{"p":"建议跟踪标的为瑞博生物（化学修饰与生产能力可覆盖 ASO，适合作为平台延伸而非单独押注）。"},{"p":"核心判断为机制成熟，中枢适应症有明确先例。证据等级 A。触发条件为国内团队在新适应症取得首创地位。放弃条件为仅做已上市靶点的仿创。"}],"children":[]}]},{"h":"21.4 类器官与 NAMs","lvl":2,"blocks":[{"p":"表 21-4 类器官与 NAMs 内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["肝与肾毒性评价类器官","4.05","11","重点跟踪","合珀生物、华津生物"],["类器官自动化与标准化装备","3.80","32","主动看项目","镁伽科技、黑玉科技、万何圆生物"],["肿瘤类器官药敏与伴随诊断","3.75","40","主动看项目","万何圆生物、艾名医学、希格生科"],["器官芯片与微生理系统","3.65","46","主动看项目","合珀生物、Xellar Biosystems"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"肝与肾毒性评价类器官","lvl":3,"blocks":[{"p":"肝毒性和肾毒性是临床前失败的主要原因，也是监管推动替代动物实验时最先接受人源模型的两个场景。合珀生物在 2026 年 8 月获得鼎泰药研集团 A 轮战略投资，双方围绕新型替代实验方法与非临床评价体系合作，说明安评 CRO 正在把类器官作为能力补充而非替代（推断）。"},{"p":"建议跟踪标的为合珀生物（覆盖肝、肾、肠等多组织，已与安评 CRO 形成战略绑定）、华津生物（肾脏方向的国内团队，公开信息有限，列为待核实）。"},{"p":"核心判断为对应药物毒性评价中需求最明确的两个器官。证据等级 B。触发条件为国内外监管在具体申报中接受人源模型数据替代一种动物。放弃条件为模型批间差异无法满足 GLP 要求。"}],"children":[]},{"h":"类器官自动化与标准化装备","lvl":3,"blocks":[{"p":"类器官要成为可训练 AI 的数据源，先要解决批间一致性和通量，自动化培养与成像装备因此是数据平台的前置环节。国内在设备工程和成本控制上有优势，且设备销售的收入确认比服务更清晰，与鲁信偏好的硬科技判断方式匹配（推断）。"},{"p":"建议跟踪标的为镁伽科技（实验自动化能力可直接复用于类器官规模化培养）、黑玉科技（微流控类器官芯片面向高通量与均一性，设备加耗材模式清晰）、万何圆生物（自动化与智能化平台已进入临床转化阶段）。"},{"p":"核心判断为决定数据能否标准化，是数据平台的前置条件。证据等级 B。触发条件为设备进入头部药企或 CRO 的标准流程。放弃条件为客户自建替代外购。"}],"children":[]},{"h":"肿瘤类器官药敏与伴随诊断","lvl":3,"blocks":[{"p":"肿瘤类器官培养与药物敏感性检测相关项目已被纳入检验类医疗服务价格项目立项指南，商业模式从给药企做服务转为临床收费。扣分项是临床证据，大规模前瞻性对照数据仍然不足，院内渗透取决于专家共识的推进速度（推断）。"},{"p":"建议跟踪标的为万何圆生物（自动化类器官系统同时面向院端与药企两个付费方）、艾名医学（承办行业标准化工作，在共识与规范制定中位置靠前）、希格生科（类器官与新药管线结合，数据自产闭环成立）。"},{"p":"核心判断为价格项目已立项，付费方从药企转向医院。证据等级 B。触发条件为随机对照研究显示类器官指导用药改善生存。放弃条件为检测价格下行且临床获益证据长期缺位。"}],"children":[]},{"h":"器官芯片与微生理系统","lvl":3,"blocks":[{"p":"器官芯片在 2026 年 8 月至 9 月进入美国药物研发工具资格认定的最后阶段，肝芯片用于药物性肝损伤评价的完整资格材料已经递交。截至 2026 年初该路径尚无任何工具完成认定，资格认定本身仍是开放问题，而一旦落地将重新定义非临床评价的采购标准（推断）。"},{"p":"建议跟踪标的为合珀生物（国内器官芯片与三维模型能力最接近工业级标准）、Xellar Biosystems（器官芯片加自动化加虚拟细胞的组合，是海外对标标的）。"},{"p":"核心判断为监管资格认定接近落地，国内起步较晚。证据等级 B。触发条件为肝芯片完成资格认定并被写入申报要求。放弃条件为资格认定长期悬置导致药企采购意愿不足。"}],"children":[]}]},{"h":"21.5 医用同位素与核药","lvl":2,"blocks":[{"p":"表 21-5 医用同位素与核药内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["α 核素与锕 225 供应","4.10","6","重点跟踪","耀加速、迈斯拓扑、法伯新天"],["硼中子俘获治疗（BNCT）","3.95","19","主动看项目","中核海得威、国科中子、普利制药"],["诊疗一体化 β 核素","3.90","24","主动看项目","先通医药、纽瑞特医疗"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"α 核素与锕 225 供应","lvl":3,"blocks":[{"p":"锕 225 在全球范围内供不应求，跨国药企正通过长期供货协议和并购锁定上游，阿斯利康已宣布在广州建设锕 225 放射性偶联药物生产基地。电子加速器制备路线在国内已有企业完成工艺模拟验证并取得环评批复，规模化制备尚未收敛，属于典型的卡脖子加工程化问题，与国资偏好的硬科技方向一致。"},{"p":"建议跟踪标的为耀加速（电子加速器路线切入锕 225，卡位全球最稀缺的上游环节）、迈斯拓扑（取得国内首个支持该路线的环评批复，并已对接下游核药企业）、法伯新天（制剂端布局可与上游形成协同，部分信息为企业自述）。"},{"p":"核心判断为全球供应短缺，上游比制剂更稀缺。证据等级 B。触发条件为国产路线实现 GMP 级别稳定批产并签下制剂方长单。放弃条件为加速器路线成本高于反应堆路线且无法缩小。"}],"children":[]},{"h":"硼中子俘获治疗（BNCT）","lvl":3,"blocks":[{"p":"BNCT 需要靶向硼药与中子束设备配合，国产设备在东莞的 I 期临床出现首例复发鼻咽癌患者影像学完全缓解，国产硼药临床试验也已获批。扣分项在支付，单次治疗费用高，商业保险刚刚起步，院端装机投入大（推断）。"},{"p":"建议跟踪标的为中核海得威（依托中国同辐体系，国产硼药已进入临床试验阶段）、国科中子（与中国散裂中子源技术同源，国产设备 I 期已出现完全缓解病例）、普利制药（参与国产硼药与国产设备的联合临床，药械协同位置明确）。"},{"p":"核心判断为药械联合，国产设备已出现完全缓解病例。证据等级 B。触发条件为 II 期注册临床启动并形成多中心装机。放弃条件为治疗费用无法进入主流支付体系。"}],"children":[]},{"h":"诊疗一体化 β 核素","lvl":3,"blocks":[{"p":"镥 177 标记的放射性配体疗法已完成商业化验证，国内企业的机会在适应症拓展和本地供应链。扣分项在拥挤度与核素供应依赖（推断）。"},{"p":"建议跟踪标的为先通医药（核药管线与产能布局完整，国资股东结构适配）、纽瑞特医疗（产业资本与地方国资同时进入，放射性微球方向差异化）。"},{"p":"核心判断为已有上市产品验证，国内处于跟随加本地化阶段。证据等级 A。触发条件为国产产品进入医保并实现规模化配送。放弃条件为核素供应长期依赖进口。"}],"children":[]}]},{"h":"21.6 ADC 与偶联药物","lvl":2,"blocks":[{"p":"表 21-6 ADC 与偶联药物内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["拓扑异构酶抑制剂类 ADC","3.60","47","主动看项目","科伦博泰、映恩生物"],["新型载荷与双载荷偶联","3.55","51","保持观察","百利天恒、宜联生物"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"拓扑异构酶抑制剂类 ADC","lvl":3,"blocks":[{"p":"这一类载荷已经完成多轮商业化验证，国内供给能力全球领先，是对外授权的主要品类。扣分项是前瞻性与估值窗口，靶点与载荷组合高度重合，后进入者的授权价格承压（推断）。"},{"p":"建议跟踪标的为科伦博泰（多笔对外授权验证了平台与产能，但估值已反映确定性）、映恩生物（授权节奏快，适合作为对标而非新增布局）。"},{"p":"核心判断为确定性最高但拥挤度也最高。证据等级 A。触发条件为新靶点在实体瘤取得优于现有标准治疗的数据。放弃条件为同靶点授权首付款持续下行。"}],"children":[]},{"h":"新型载荷与双载荷偶联","lvl":3,"blocks":[{"p":"免疫激动剂载荷、降解剂载荷和双载荷设计试图把 ADC 从细胞毒延伸到机制组合，解决耐药和治疗窗问题。证据仍以临床前和早期临床为主，可成药性与安全性都未定（推断）。"},{"p":"建议跟踪标的为百利天恒（双抗 ADC 结构创新已有大额授权背书）、宜联生物（新型连接子与载荷组合，需注意其与同业的诉讼已以收入分成方式和解）。"},{"p":"核心判断为绕开拥挤载荷，解决耐药与治疗窗问题。证据等级 B。触发条件为新型载荷在人体内显示与细胞毒不同的疗效特征。放弃条件为治疗窗无法优于现有载荷。"}],"children":[]}]},{"h":"21.7 基因编辑","lvl":2,"blocks":[{"p":"表 21-7 基因编辑内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["表观遗传编辑","4.20","2","重点跟踪","微光基因、Tune Therapeutics、Epicrispr Biotechnologies"],["体内碱基编辑与先导编辑","4.00","16","重点跟踪","尧唐生物、锐正基因"],["大片段写入与重组酶","3.40","57","保持观察","国内暂无检索到合适标的"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"表观遗传编辑","lvl":3,"blocks":[{"p":"表观遗传编辑通过改变甲基化等修饰来开关基因，不改变序列本身，因此在安全性上更容易被接受。2026 年已有三家企业进入临床，面肩肱型肌营养不良项目在 9 例患者中显示单次给药后瘦肌肉体积增加，乙肝项目显示单次静脉输注后生物标志物持续抑制。国内相关公司仍在早期，是小核酸与基因编辑之间的空档。"},{"p":"建议跟踪标的为微光基因（国内表观遗传药物方向已完成 Pre-A 轮，是少数专注该方向的团队）、Tune Therapeutics（乙肝项目单次静脉输注后生物标志物持续抑制，是机制验证的海外对标）、Epicrispr Biotechnologies（面肩肱型肌营养不良项目取得首个人体疗效证据）。"},{"p":"核心判断为不切断 DNA 的持久调控，安全性叙事优于核酸酶编辑。证据等级 B。触发条件为持久性在 12 个月以上随访中得到确认。放弃条件为沉默效果随时间衰减需频繁再给药。"}],"children":[]},{"h":"体内碱基编辑与先导编辑","lvl":3,"blocks":[{"p":"体内编辑把基因治疗从罕见病推向更大的人群，中国在递送与临床执行上有速度优势。扣分项是不可逆性带来的长期安全性要求，以及相关原创技术已被列入出口管制征求意见范围，跨境授权与退出路径存在不确定性。"},{"p":"建议跟踪标的为尧唐生物（体内编辑递送能力强，国资与产业资本同时进入）、锐正基因（体内编辑管线推进较快，需评估出口管制对跨境授权的影响）。"},{"p":"核心判断为一次治疗长期有效，但不可逆性带来监管与伦理门槛。证据等级 B。触发条件为常见病适应症出现可持续的体内编辑效率。放弃条件为出口管制最终文本限制对外授权。"}],"children":[]},{"h":"大片段写入与重组酶","lvl":3,"blocks":[{"p":"位点特异重组酶和桥接重组酶可以写入整段序列，理论上能覆盖同一基因的大量突变。目前处于临床前，递送载荷容量是主要工程瓶颈，且与出口管制条目高度相关，不建议现在介入（推断）。"},{"p":"国内暂无检索到合适标的，海外以大片段写入平台公司为主，建议只做技术跟踪。"},{"p":"核心判断为可一次性替换整段基因，距离临床最远。证据等级 C。触发条件为首个大片段写入项目进入临床并显示写入效率。放弃条件为载荷容量问题长期无解。"}],"children":[]}]},{"h":"21.8 双抗与多抗","lvl":2,"blocks":[{"p":"表 21-8 双抗与多抗内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["肿瘤双抗与三抗","3.90","25","主动看项目","康方生物、三生制药"],["免疫细胞衔接之外的多功能融合","3.55","52","保持观察","康方生物、三生制药"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"肿瘤双抗与三抗","lvl":3,"blocks":[{"p":"PD-1 与 VEGF 双抗等组合已经由国内企业完成商业化与对外授权验证。扣分项是拥挤度，相似结构的在研项目数量庞大，差异化需要落在联合治疗策略上（推断）。"},{"p":"建议跟踪标的为康方生物（双抗平台与商业化能力完整，是国内该方向的基准标的）、三生制药（大额对外授权验证了结构平台价值）。"},{"p":"核心判断为商业化验证充分，国内供给过剩。证据等级 A。触发条件为在一线治疗中取得优于单抗联合的数据。放弃条件为同类结构授权价格下行。"}],"children":[]},{"h":"免疫细胞衔接之外的多功能融合","lvl":3,"blocks":[{"p":"多功能融合蛋白把细胞因子或共刺激信号定向递送到肿瘤或组织微环境，以降低全身毒性。路线分散，成药性个案差异大，适合单项目判断而非赛道押注（推断）。"},{"p":"建议跟踪标的为康方生物（抗体骨架工程能力可支撑多功能融合设计）、三生制药（平台可向细胞因子与共刺激模块延伸）。"},{"p":"核心判断为把细胞因子、共刺激模块装进抗体骨架。证据等级 B。触发条件为定向递送在人体内显示局部暴露优势。放弃条件为全身毒性无法与系统给药拉开差距。"}],"children":[]}]},{"h":"21.9 AI 药物发现","lvl":2,"blocks":[{"p":"表 21-9 AI 药物发现内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["自产数据的湿实验闭环平台","3.95","20","主动看项目","晶泰科技、英矽智能、希格生科"],["纯算法与虚拟细胞模型","3.05","62","暂不投入","深势科技、Anew Labs"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"自产数据的湿实验闭环平台","lvl":3,"blocks":[{"p":"能否持续产出自有实验数据，决定一家 AI 制药公司在模型能力普及后还剩下什么。具备湿实验闭环的公司同时拥有数据资产和服务收入，离开 AI 叙事仍然成立，这与对 AI4S 泡沫保持谨慎的判断一致。"},{"p":"建议跟踪标的为晶泰科技（自动化实验站与 AI 结合，数据自产能力在国内最完整）、英矽智能（管线进度验证了模型输出，具备自有湿实验体系）、希格生科（以类器官自产数据驱动管线，闭环最短）。"},{"p":"核心判断为数据自产是判断 AI4S 公司是否成立的分水岭。证据等级 B。触发条件为自有数据训练的模型在外部盲测中胜出。放弃条件为数据仍主要依赖公开库与外采。"}],"children":[]},{"h":"纯算法与虚拟细胞模型","lvl":3,"blocks":[{"p":"虚拟细胞类模型的瓶颈不在算法而在扰动数据，海外公司正通过工业化的高通量扰动测序自建数据集。在没有自有数据的前提下，国内同类公司的壁垒难以成立，估值与可兑现价值之间差距明显（推断）。"},{"p":"建议跟踪标的为深势科技（算法能力强，但需确认数据来源是否自产）、Anew Labs（虚拟细胞方向的国内新设团队，建议只做观察）。"},{"p":"核心判断为想象空间最大，可验证性最弱。证据等级 C。触发条件为模型在未见过的细胞类型上实现零样本预测并被第三方复现。放弃条件为继续以公开数据训练且无实验闭环。"}],"children":[]}]},{"h":"21.10 代谢与减重","lvl":2,"blocks":[{"p":"表 21-10 代谢与减重内部技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["口服小分子与多靶点激动剂","3.45","55","保持观察","诚益生物、闻泰医药、Corxel"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"口服小分子与多靶点激动剂","lvl":3,"blocks":[{"p":"口服给药和多靶点组合是现阶段减重领域的主要差异化方向，国内已有对外授权案例。扣分项是竞争，跨国药企与国内企业同时推进，价格战风险高（推断）。"},{"p":"建议跟踪标的为诚益生物（口服 GLP-1 已完成大额对外授权，是国内该方向最明确的标的）、闻泰医药（多靶点管线推进中，估值窗口相对宽松）、Corxel（授权引进加本地开发模式，退出路径依赖买方）。"},{"p":"核心判断为适应症巨大但竞争最激烈。证据等级 A。触发条件为口服制剂在减重幅度与耐受性上同时占优。放弃条件为医保与集采压缩价格空间。"}],"children":[]}]}]},{"h":"第二十二章 前沿技术路线期权池","blocks":[{"p":"本章收录尚未形成独立赛道的前沿路线。这些路线不进入正式投资排序，按第二十章的期权池标准跟踪，触发条件达成后再按赛道模型重新打分。物理介入治疗中光、电、声、磁与场、放射各条路线合并为一节并按得分排序，其余按新分子模态、器官与再生、测量与数据生产、诊断与监测、人工智能与物理世界结合分列。"}],"children":[{"h":"22.1 物理介入治疗","lvl":2,"blocks":[{"p":"表 22-1 物理介入治疗方向技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["侵入式脑机接口（读取方向）","4.20","3","重点跟踪","博睿康、阶梯医疗、脑虎科技"],["脑机接口上游部件与植入装备","4.20","4","重点跟踪","山海医疗、术理创新"],["自适应与闭环神经调控","4.05","12","重点跟踪","景昱医疗、博睿康"],["神经免疫调控（电刺激治自免）","4.00","17","重点跟踪","景昱医疗、SetPoint Medical"],["超声开放血脑屏障与辅助递送","4.00","18","重点跟踪","思昇科技、华超神控"],["超声神经调控与声遗传","3.90","26","主动看项目","华超神控、格式塔科技、思昇科技"],["聚焦超声消融与组织击碎","3.90","27","主动看项目","HistoSonics、国内暂无检索到合适标的"],["经颅磁刺激加速方案","3.90","28","主动看项目","四川科瑞德、江西杰联医疗"],["眼科光遗传基因疗法","3.80","33","主动看项目","健达九州、中眸医疗、星明优健"],["FLASH 放疗与粒子治疗","3.80","34","主动看项目","迈胜医疗"],["肿瘤电场与脉冲电场治疗","3.75","41","主动看项目","维纳安可"],["中枢神经光遗传与光学工具","3.60","48","主动看项目","国内暂无检索到合适标的"],["磁遗传与磁热纳米","3.25","60","保持观察","暂不建议布局"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"侵入式脑机接口（读取方向）","lvl":3,"blocks":[{"p":"2026 年 3 月博睿康植入式脑机接口系统获国家药监局批准上市并在两天后取得医保编码，6 月 30 日药监局明确侵入式脑机接口按第三类医疗器械管理，监管与支付两个堵点同时打通。融资口径存在分歧，同一数据源对 2025 年全年融资额有 27.23 亿元与约 14.5 亿元两种表述，使用时需注明口径。头部公司估值已被互联网与产业资本抬高，再进入的性价比有限（推断）。"},{"p":"建议跟踪标的为博睿康（全球首个获批上市的侵入式脑机接口医疗器械，已取得医保编码并申报科创板）、阶梯医疗（完成国内首例 256 通道侵入式临床植入，计划年内完成约 40 例注册临床入组）、脑虎科技（全植入全无线系统已启动临床试验，跨城远程交互演示完成）。"},{"p":"核心判断为监管与支付已打通，但估值被抬高。证据等级 B。触发条件为多中心注册临床完成规模化入组。放弃条件为估值继续脱离装机量与收费项目。"}],"children":[]},{"h":"脑机接口上游部件与植入装备","lvl":3,"blocks":[{"p":"柔性电极、低功耗专用芯片、气密封装、无线供能与植入手术机器人构成上游，不管哪条整机路线最终胜出都能受益。2026 年 9 月已有国产刺激记录一体化电极获得第三类医疗器械注册证，耗材加设备的国产闭环开始成型，这类硬件项目与鲁信的器械判断能力匹配。"},{"p":"建议跟踪标的为山海医疗（全国首款刺激记录一体化电极取得三类证，设备加耗材闭环已成型）、术理创新（已启动科创板 IPO 辅导，是上游装备中资本化进度最快的标的）。"},{"p":"核心判断为不依赖整机路线胜负，国产替代逻辑清晰。证据等级 B。触发条件为进入两家以上整机厂商的供应链。放弃条件为整机厂商普遍自研核心部件。"}],"children":[]},{"h":"自适应与闭环神经调控","lvl":3,"blocks":[{"p":"自适应脑深部电刺激根据实时神经信号调整刺激参数，是存量装机市场的升级方向。国产脑起搏器已实现规模商用，升级为闭环产品的工程难度低于从零做脑机接口，收费项目与随访体系也已存在（推断）。"},{"p":"建议跟踪标的为景昱医疗（多张三类证在手，具备向闭环升级的产品基础）、博睿康（读取与刺激能力同时具备，是闭环产品的天然承载方）。"},{"p":"核心判断为从固定刺激转向按脑信号实时调参。证据等级 B。触发条件为闭环产品取得注册证并形成价格项目。放弃条件为闭环相比开环无显著临床获益。"}],"children":[]},{"h":"神经免疫调控（电刺激治自免）","lvl":3,"blocks":[{"p":"迷走神经刺激治疗类风湿关节炎已在美国获批，依据是 242 例随机、双盲、假刺激对照研究，植入装置每天刺激 60 秒。这意味着免疫重置既可以用药物做，也可以用电刺激做，而国内在神经免疫方向的布局远少于脑机接口，竞争窗口宽松。"},{"p":"建议跟踪标的为景昱医疗（取得全球首张成瘾适应症侵入式脑机接口注册证，神经调控适应症拓展能力已被验证）、SetPoint Medical（迷走神经刺激治疗类风湿关节炎获批，是神经免疫方向的海外对标）。"},{"p":"核心判断为与排名第一的自免赛道形成药械两条路线。证据等级 B。触发条件为国内出现自免适应症的注册临床。放弃条件为机制在更大样本中疗效不可重复。"}],"children":[]},{"h":"超声开放血脑屏障与辅助递送","lvl":3,"blocks":[{"p":"聚焦超声配合微泡可以短暂打开血脑屏障，使原本无法入脑的药物进入中枢，属于典型的使能技术。价值兑现依赖与具体药物绑定，单独做设备的议价能力有限（推断）。"},{"p":"建议跟踪标的为思昇科技（明确把超声用于辅助药物递送，与中枢药物企业天然互补）、华超神控（已与国际药企就中枢药械结合方向达成战略合作）。"},{"p":"核心判断为把中枢药物递送从分子问题变成器械问题。证据等级 B。触发条件为出现药械联合的注册路径与合作协议。放弃条件为开放窗口的可重复性与安全性无法满足反复给药。"}],"children":[]},{"h":"超声神经调控与声遗传","lvl":3,"blocks":[{"p":"低强度聚焦超声能够无创作用于深部脑区，不需要开颅或植入，是光遗传难以进入中枢时的替代路线。国内 2026 年已出现多笔大额早期融资，红杉中国与云启资本联合领投的 Pre-A 轮达 2 亿元，头部公司计划在 2027 年第一季度进入临床。路线尚无人体疗效终点数据，估值已先行，属于高前瞻低证据组合。"},{"p":"建议跟踪标的为华超神控（融资与里程碑均领先，闭环超声脑机系统计划 2027 年第一季度进入临床）、格式塔科技（慢性疼痛适应症的注册申报路径明确）、思昇科技（从脑胶质瘤切入，兼顾神经调控与药物递送）。"},{"p":"核心判断为无创写入深部脑区，可能替代光遗传进入中枢。证据等级 B。触发条件为首个适应症取得注册临床的疗效终点。放弃条件为聚焦精度与剂量在人体内无法稳定复现。"}],"children":[]},{"h":"聚焦超声消融与组织击碎","lvl":3,"blocks":[{"p":"组织击碎用聚焦超声脉冲机械性破坏肿瘤组织，避免了热消融的边界问题，美国已于 2023 年获批，中国内地首台设备已落地海南乐城，香港与台湾在开展肾癌与肝癌试验。国内尚无同类产品获批，国产替代与适应症拓展是机会所在（推断）。"},{"p":"建议跟踪标的为 HistoSonics（全球唯一已获批的组织击碎系统，是国产替代的对标对象）。国内暂无检索到合适标的，建议跟踪国产超声治疗设备企业在该适应症上的注册进度。"},{"p":"核心判断为无创、无热、无辐射的机械消融，已在海外获批。证据等级 B。触发条件为国产设备进入注册临床并取得收费项目。放弃条件为进口设备依托特许政策先行占据院端。"}],"children":[]},{"h":"经颅磁刺激加速方案","lvl":3,"blocks":[{"p":"加速间歇性 θ 波爆发刺激把抑郁症疗程从六周压缩到数天，机制研究在 2026 年已推进到细胞与回路层面。国产设备已取得海外市场准入，出海与院端渗透同步推进，属于确定性较高但前瞻性一般的方向。"},{"p":"建议跟踪标的为四川科瑞德（经颅磁刺激设备同期取得美国与印度准入，出海能力已验证）、江西杰联医疗（经颅电刺激设备已进入国家级脑科学项目的临床研究）。"},{"p":"核心判断为疗程压缩与影像导航定位，精神科付费成熟。证据等级 A。触发条件为压缩疗程方案进入国内指南与收费项目。放弃条件为设备同质化导致价格战。"}],"children":[]},{"h":"眼科光遗传基因疗法","lvl":3,"blocks":[{"p":"视网膜本身接收光且给药路径成熟，眼科因此成为光遗传唯一接近落地的方向。全球进度最快的产品已被美国受理上市申请，其不依赖外部激光眼镜、使用环境光工作的设计是拉开差距的关键；国内健达九州、中眸医疗与星明优健均在视网膜色素变性上推进，适应症高度重合。2026 年诺贝尔生理学或医学奖授予光门控离子通道与光遗传学，估值会先于数据上行，现在入场价格不低（推断）。"},{"p":"建议跟踪标的为健达九州（国产光遗传基因疗法中进度靠前，已获美国快速通道与孤儿药认定，A 轮有脑机基金跟投）、中眸医疗（中美双报并已完成 52 周长期随访，背后有上市公司股东）、星明优健（注册 I 期申请已获受理，并将海外权益授权给英国公司，全球化路径最清晰）。"},{"p":"核心判断为诺奖加持，但国内三家挤在同一适应症。证据等级 B。触发条件为国内产品在注册临床中取得可量化的视功能改善。放弃条件为同适应症国内三家以上同时进入注册临床且无差异。"}],"children":[]},{"h":"FLASH 放疗与粒子治疗","lvl":3,"blocks":[{"p":"超高剂量率照射有望在保持疗效的同时降低正常组织损伤，国产小型化集成型质子治疗系统已于 2026 年 5 月取得注册证，加速器能力同时支撑医用同位素制备，与核药赛道形成协同。扣分项是单台设备投入大、院端决策周期长（推断）。"},{"p":"建议跟踪标的为迈胜医疗（国内首台小型化集成型质子治疗系统取得注册证，加速器能力可与核药上游协同）。"},{"p":"核心判断为设备硬件是中国长项，可与核药共用加速器能力。证据等级 B。触发条件为 FLASH 模式取得注册适应症。放弃条件为装机成本无法下降到地市级医院可承受。"}],"children":[]},{"h":"肿瘤电场与脉冲电场治疗","lvl":3,"blocks":[{"p":"交变电场干扰肿瘤细胞有丝分裂，脉冲电场则以不可逆电穿孔实现非热消融。国产单针局麻陡脉冲设备已于 2026 年 5 月取得肝、胰双适应症第三类注册证，验证了国产化路径（推断）。"},{"p":"建议跟踪标的为维纳安可（全球首个实现单针消融加局麻操作并同时覆盖肝、胰双适应症的国产设备）。"},{"p":"核心判断为物理机制明确，国产替代空间大。证据等级 B。触发条件为进入主流指南并形成稳定耗材收入。放弃条件为适应症拓展受限于单一瘤种。"}],"children":[]},{"h":"中枢神经光遗传与光学工具","lvl":3,"blocks":[{"p":"中枢适应症需要基因治疗叠加植入式光源，监管上是组合产品，临床距离远。现阶段更现实的是把光遗传当作研究工具，全光学电生理筛选平台可以为神经药物研发提供扰动数据，与数据平台逻辑一致（推断）。"},{"p":"国内暂无检索到合适标的，建议先跟踪全光学筛选平台的工具化进展，再判断是否介入。"},{"p":"核心判断为需要把光送进脑内，属于药械组合产品。证据等级 C。触发条件为出现可长期植入的微型光源与配套基因载体。放弃条件为脑内光递送无法解决热损伤与覆盖范围。"}],"children":[]},{"h":"磁遗传与磁热纳米","lvl":3,"blocks":[{"p":"磁遗传学试图用磁场远程控制细胞活动，部分关键研究的可重复性在学术界存在争议，属于先验证科学是否成立再谈投资的方向。磁热纳米颗粒相对更接近工程问题，但适应症选择仍不清晰（推断）。"},{"p":"暂不建议布局，核心机制的可重复性在学术界仍有争议，先等待独立复现。"},{"p":"核心判断为基础研究可重复性存在争议。证据等级 D。触发条件为核心机制被独立实验室复现。放弃条件为关键论文结论持续无法复现。"}],"children":[]}]},{"h":"22.2 新分子模态","lvl":2,"blocks":[{"p":"表 22-2 新分子模态方向技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["RNA 编辑（ADAR 招募）","4.15","5","重点跟踪","辉大基因、昌平实验室与北京大学魏文胜团队相关企业、Wave Life Sciences"],["tRNA 疗法与无义突变通读","3.95","21","主动看项目","Alltrna、国内暂无检索到合适标的"],["环状 RNA","3.90","29","主动看项目","环码生物、圆因生物、元码智药"],["逻辑门控细胞治疗","3.80","35","主动看项目","A2 Biotherapeutics、国内暂无检索到合适标的"],["噬菌体与裂解酶","3.70","45","主动看项目","上海噬菌体与耐药研究所体系、国内暂无检索到合适的企业标的"],["工程化活菌与微生态药物","3.40","58","保持观察","暂不建议布局"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"RNA 编辑（ADAR 招募）","lvl":3,"blocks":[{"p":"RNA 编辑借助体内固有的 ADAR 酶改写转录本，不触碰基因组，因而在安全性和可停药性上优于 DNA 编辑。α1 抗胰蛋白酶缺乏症已成为多家企业同场竞争的首个适应症，首例人体编辑数据已经出现，持久性与再给药方案是下一个问题。国内布局仍少，是小核酸平台可以自然延伸的方向（推断）。"},{"p":"建议跟踪标的为辉大基因（全球首个完成 CRISPR 介导 RNA 编辑人体给药的团队，但其另一条基因编辑管线出现受试儿童死亡且披露滞后十五个月，尽调中须单独核查安全性与信息披露流程）、昌平实验室与北京大学魏文胜团队相关企业（原创 LEAPER 技术不依赖外源编辑酶，已进入临床研究，成果转化主体待核实）、Wave Life Sciences（首个报告人体 RNA 编辑数据的企业，是机制验证的海外对标）。"},{"p":"核心判断为可逆、不改变基因组的单碱基改写。证据等级 B。触发条件为编辑效率与持久性支持每季度以上的给药间隔。放弃条件为需频繁给药导致成本高于现有疗法。"}],"children":[]},{"h":"tRNA 疗法与无义突变通读","lvl":3,"blocks":[{"p":"工程化转运 RNA 让提前终止的蛋白质翻译继续完成，理论上可以用同一分子覆盖带有相同终止密码子的多种罕见病。首个候选药物已获批在澳大利亚开展首次人体试验，全球参与者屈指可数，竞争窗口宽松但证据链最短。"},{"p":"建议跟踪标的为 Alltrna（首个获批开展人体试验的 tRNA 疗法，是该路线的唯一对标）。国内暂无检索到合适标的，建议跟踪国内核酸平台是否延伸至该方向。"},{"p":"核心判断为一种药覆盖多种罕见病，竞争者极少。证据等级 C。触发条件为首次人体试验显示目标蛋白恢复表达。放弃条件为通读效率不足以产生临床获益。"}],"children":[]},{"h":"环状 RNA","lvl":3,"blocks":[{"p":"环状结构带来更高稳定性和更低免疫原性，国内已有产品取得缺血性心脏病的临床试验许可，并出现与 AI 设计、体内 CAR-T 结合的新公司。平台型公司数量偏多，差异化需要落在环化工艺与递送上（推断）。"},{"p":"建议跟踪标的为环码生物（取得国内首个环形 RNA 疗法临床试验许可，工艺平台自主可控）、圆因生物（学术源头清晰，管线覆盖疫苗与治疗两类）、元码智药（环状 mRNA 与体内 CAR-T 结合，并引入上市公司作为战略股东）。"},{"p":"核心判断为表达更持久的 mRNA，国内起步与全球同步。证据等级 B。触发条件为首个适应症取得明确的人体疗效信号。放弃条件为工艺纯度与成本无法优于线性 mRNA。"}],"children":[]},{"h":"逻辑门控细胞治疗","lvl":3,"blocks":[{"p":"逻辑门控让细胞只在同时识别多个信号时才启动杀伤，用以解决实体瘤缺乏绝对特异靶点的问题。已有平台在非小细胞肺癌中报告完全缓解个案，但患者筛选依赖基因分型，可及人群被压缩，制造成本也高（推断）。"},{"p":"建议跟踪标的为 A2 Biotherapeutics（逻辑门控平台已在非小细胞肺癌中报告完全缓解个案，是唯一有人体证据的对标）。国内暂无检索到合适标的，国内合成基因线路公司多在临床前，建议等待首例人体数据。"},{"p":"核心判断为用合成基因线路解决实体瘤的靶点安全问题。证据等级 B。触发条件为多例实体瘤完全缓解并可重复。放弃条件为筛选条件使可及人群过小。"}],"children":[]},{"h":"噬菌体与裂解酶","lvl":3,"blocks":[{"p":"噬菌体对耐药菌有高度特异性，国内已积累近百例个性化治疗经验并有单臂试验病例发表。制约在制度，国内尚未形成针对噬菌体治疗的专项监管法规，研究者发起的临床研究仍是主要形式；同时已有研究揭示噬菌体特异性抗体会导致治疗失败，反复给药的有效性存疑。"},{"p":"建议跟踪标的为上海噬菌体与耐药研究所体系（积累近百例个性化治疗经验，是国内最成体系的临床资源）。国内暂无检索到合适的企业标的，专项监管法规尚未出台，建议等待审评路径明确。"},{"p":"核心判断为耐药菌需求紧迫，但国内尚无专门监管路径。证据等级 B。触发条件为监管部门出台噬菌体治疗的审评路径。放弃条件为抗体介导的失效无法通过换用噬菌体解决。"}],"children":[]},{"h":"工程化活菌与微生态药物","lvl":3,"blocks":[{"p":"工程菌把治疗功能交给可定植的微生物，理论上能长期在体内发挥作用。海外同类企业已多次在临床终点上受挫，监管路径与活菌质控都不成熟，现阶段只做观察（推断）。"},{"p":"暂不建议布局，监管路径与活菌质控均不成熟，海外同类企业已多次在临床终点受挫。"},{"p":"核心判断为机制新颖，但监管与临床终点长期不明。证据等级 C。触发条件为出现明确的临床终点获益与可控定植数据。放弃条件为活菌质控与长期安全性无法标准化。"}],"children":[]}]},{"h":"22.3 器官与再生","lvl":2,"blocks":[{"p":"表 22-3 器官与再生方向技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["异种器官移植","4.10","7","重点跟踪","中科奥格、真健康医疗"],["器官常温灌注与体外修复","4.05","13","重点跟踪","真健康医疗"],["类器官移植与组织修复","3.60","49","主动看项目","合珀生物、暂不建议新增布局"],["部分重编程与抗衰老","2.85","64","暂不投入","暂不建议布局"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"异种器官移植","lvl":3,"blocks":[{"p":"基因编辑猪器官已从同情用药进入正式临床试验，美国已启动规模化猪肾移植临床试验。国内进展同步，六基因编辑猪肝体外灌注已用于肝衰竭患者治疗，全球首例猪肝与双肾同时移植由国内团队完成，中科奥格在 2026 年 8 月完成超 2 亿元 A3 轮融资。扣分项在注册与支付，监管路径和伦理审查周期都不确定。"},{"p":"建议跟踪标的为中科奥格（国内最大低免疫原性供体猪种群，牵头国家慢病专项相关课题，A3 轮超 2 亿元）、真健康医疗（多器官常温灌注系统已进入异种移植重点实验室，是产业化的前置环节）。"},{"p":"核心判断为中国在动物资源与临床资源上有结构性优势。证据等级 B。触发条件为国内启动正式注册临床并形成供体猪产能。放弃条件为长期存活时间无法突破现有纪录。"}],"children":[]},{"h":"器官常温灌注与体外修复","lvl":3,"blocks":[{"p":"常温机械灌注延长器官可用时间并允许在体外修复边缘器官，供体结构变化使这一需求上升。国产多器官常温灌注系统已进入异种移植重点实验室采购，既服务存量移植，又卡位异种移植产业化的前置环节，商业模式比治疗产品更清晰。"},{"p":"建议跟踪标的为真健康医疗（国产多器官常温灌注系统已中标科研采购，并卡位异种移植交叉灌注场景）。"},{"p":"核心判断为设备加耗材，付费明确，且是异种移植的刚需基建。证据等级 B。触发条件为产品进入移植中心常规采购并形成耗材复购。放弃条件为院端采购集中于少数进口厂商。"}],"children":[]},{"h":"类器官移植与组织修复","lvl":3,"blocks":[{"p":"把类器官从体外模型变成可移植的组织，是类器官赛道价值最高的延伸方向。瓶颈在成熟度、血管化与功能整合，肾脏等复杂器官短期内无法替代整器官移植，肠道等相对简单的组织更可能先行（推断）。"},{"p":"建议跟踪标的为合珀生物（多组织类器官平台是向移植方向延伸的基础，但距离治疗产品仍远）。暂不建议新增布局，血管化与功能整合尚未解决，建议先按研究进展跟踪。"},{"p":"核心判断为从做模型延伸到做治疗，技术跨度大。证据等级 C。触发条件为首个适应症完成研究者发起的移植临床。放弃条件为血管化与长期功能整合长期无解。"}],"children":[]},{"h":"部分重编程与抗衰老","lvl":3,"blocks":[{"p":"部分重编程在动物实验中展示了功能恢复，首个人体试验已在青光眼与非动脉炎性前部缺血性视神经病变中给药。海外估值已经极高，国内缺乏对应的监管路径与支付方，不建议介入（推断）。"},{"p":"暂不建议布局，海外估值已高，国内缺乏对应监管路径与支付方。"},{"p":"核心判断为海外资本高度拥挤，国内监管与支付均不支持。证据等级 C。触发条件为首个人体试验显示可测量的功能恢复且安全。放弃条件为出现与重编程相关的致瘤信号。"}],"children":[]}]},{"h":"22.4 测量与数据生产","lvl":2,"blocks":[{"p":"表 22-4 测量与数据生产方向技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["高通量扰动筛选","4.10","8","重点跟踪","墨卓生物、新格元生物"],["空间多组学","3.80","36","主动看项目","新格元生物、墨卓生物"],["自动化动物实验与表型采集","3.75","42","主动看项目","镁伽科技"],["活细胞与纵向单细胞测量","3.60","50","主动看项目","国内暂无检索到合适标的"],["单分子蛋白测序","3.55","53","保持观察","Quantum-Si、暂不建议新增布局"],["量子传感与纳米金刚石探针","3.55","54","保持观察","QT Sense、国内暂无检索到合适标的"],["全器官成像与连接组学","3.45","56","保持观察","国内暂无检索到合适标的"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"高通量扰动筛选","lvl":3,"blocks":[{"p":"扰动加单细胞读出的组合回答的是干预后会发生什么，而不是现在是什么，是训练因果模型的核心数据。海外已把这一能力工业化，公开数据集规模从百万细胞量级提升到千万细胞量级，并据此训练出专门的扰动预测模型。国内具备单细胞技术积累的团队可以切入服务与数据资产两端，与数据平台判断一致。"},{"p":"建议跟踪标的为墨卓生物（明确提出从单细胞平台走向规模化生命数据生产，并计划推出面向靶点与毒性的产品）、新格元生物（一站式高通量单细胞平台已服务大量药企与医院，具备规模化数据生产能力）。"},{"p":"核心判断为虚拟细胞模型最缺的就是这类因果数据。证据等级 B。触发条件为国内团队建成可对外服务的工业化扰动平台。放弃条件为数据生产成本无法下降到可规模销售。"}],"children":[]},{"h":"空间多组学","lvl":3,"blocks":[{"p":"空间组学已进入商业化阶段，国内设备在成本上具备竞争力，下游需求来自药企与医院病理科。扣分项是竞争，国内外厂商数量多，毛利承压（推断）。"},{"p":"建议跟踪标的为新格元生物（单细胞与空间产品线齐备，客户基础可直接复用）、墨卓生物（微流控平台可同时覆盖单细胞与空间，国产化程度高）。"},{"p":"核心判断为同一切片上同时读取多种分子，国产成本优势明显。证据等级 B。触发条件为进入临床病理常规流程并形成收费项目。放弃条件为设备价格战压缩试剂毛利。"}],"children":[]},{"h":"自动化动物实验与表型采集","lvl":3,"blocks":[{"p":"自动化采集把行为与表型数据从人工记录变成连续标准化数据，提高了单次实验的信息密度。需要明确的是监管正在推动替代动物实验，动物实验总量趋于下降，这一方向与类器官和器官芯片在一定程度上此消彼长，不能两边都按增长逻辑看待。"},{"p":"建议跟踪标的为镁伽科技（实验自动化平台可覆盖动物实验与表型采集两端）。"},{"p":"核心判断为逻辑只能是剩下的实验做得更好，不能是市场变大。证据等级 B。触发条件为数据服务收入占比超过设备收入。放弃条件为动物实验总量下降快于单次价值提升。"}],"children":[]},{"h":"活细胞与纵向单细胞测量","lvl":3,"blocks":[{"p":"不杀死细胞即可读取转录组，使同一个细胞的处理前后对照成为可能，正好补上现有单细胞数据缺少时间维度的结构性缺陷。目前仍在学术阶段，通量与成本距离产品化有明显距离，竞争者极少（推断）。"},{"p":"国内暂无检索到合适标的，仍在学术阶段，建议跟踪通量与成本的工程化进展。"},{"p":"核心判断为补上单细胞数据只有截面没有时间轴的缺陷。证据等级 C。触发条件为出现可商业化的仪器或服务形态。放弃条件为通量长期停留在个位数细胞量级。"}],"children":[]},{"h":"单分子蛋白测序","lvl":3,"blocks":[{"p":"单分子读取蛋白序列可以识别蛋白异构体与翻译后修饰，是基因组学之后的下一个测量层。产业化节奏不及预期，头部公司已把新一代平台的商业化推迟到 2027 年第二季度，氨基酸识别种类仍未覆盖全部二十种，短期内不构成可投资的成熟赛道。"},{"p":"建议跟踪标的为 Quantum-Si（目前唯一商业化的台式单分子蛋白测序平台，新一代产品已推迟至 2027 年第二季度）。暂不建议新增布局，商业化节奏不及预期，建议等待全部氨基酸识别能力落地。"},{"p":"核心判断为蛋白组学的二代测序时刻尚未到来。证据等级 B。触发条件为新平台如期上市并实现全部氨基酸识别。放弃条件为商业化再次延期或识别能力停滞。"}],"children":[]},{"h":"量子传感与纳米金刚石探针","lvl":3,"blocks":[{"p":"量子传感用纳米金刚石在单细胞层面实时读取氧化应激与代谢动力学，是测量工具而非治疗手段，属于量子生物学三层结构中最接近产品的一层。海外公司仍在种子轮量级，国内几乎空白；需要注意国内健康消费领域存在大量借量子概念包装的伪科学产品，尽调时默认先按伪科学审查。"},{"p":"建议跟踪标的为 QT Sense（纳米金刚石单细胞实时测量的唯一成型标的，仍处种子轮量级）。国内暂无检索到合适标的，需注意消费端大量借量子概念包装的伪科学项目。"},{"p":"核心判断为量子生物学中唯一能落到产品的一层。证据等级 C。触发条件为平台进入药企或科研机构的常规采购。放弃条件为信噪比在真实样本中无法满足需求。"}],"children":[]},{"h":"全器官成像与连接组学","lvl":3,"blocks":[{"p":"膨胀显微与光片成像把亚细胞分辨率扩展到全器官尺度，为神经科学与病理提供新的数据源。付费方以科研经费为主，产业化收入路径不清晰（推断）。"},{"p":"国内暂无检索到合适标的，付费方集中在科研经费，建议等待临床或药企端的刚性应用出现。"},{"p":"核心判断为数据体量巨大，付费方集中在科研经费。证据等级 C。触发条件为出现临床病理或药物研发中的刚性应用。放弃条件为长期停留在科研仪器销售。"}],"children":[]}]},{"h":"22.5 诊断与监测","lvl":2,"blocks":[{"p":"表 22-5 诊断与监测方向技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["连续多指标生理监测","4.05","14","重点跟踪","国内暂无检索到合适标的、雅培 Libre Duo"],["可降解与柔性植入电子","3.80","37","主动看项目","国内暂无检索到合适标的"],["呼气组学与无创代谢检测","3.10","61","暂不投入","暂不建议布局"],["多癌种早筛","3.00","63","暂不投入","暂不建议新增布局"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"连续多指标生理监测","lvl":3,"blocks":[{"p":"连续监测正从单一血糖扩展到多指标，全球首个双指标葡萄糖与酮体传感器已于 2026 年 8 月获得美国监管授权，并同时满足两项监测标准。国内在传感器供应链与成本上有优势，可与代谢减重赛道形成联动（推断）。"},{"p":"建议跟踪标的为雅培 Libre Duo（全球首个双指标葡萄糖与酮体传感器，是国产替代的对标产品）。国内暂无检索到合适标的，建议在国产连续监测企业中筛选具备多指标扩展能力的团队。"},{"p":"核心判断为从血糖扩展到酮体等指标，国内供应链强。证据等级 B。触发条件为国产多指标传感器取得注册证并进入闭环给药系统。放弃条件为指标扩展未带来临床决策改变。"}],"children":[]},{"h":"可降解与柔性植入电子","lvl":3,"blocks":[{"p":"术后监测用的植入式传感器在完成任务后可在体内降解，省去二次手术。材料与工艺是中国的长项，制约在临床场景选择与注册路径（推断）。"},{"p":"国内暂无检索到合适标的，材料能力具备，建议等待首个明确的临床场景与注册路径。"},{"p":"核心判断为材料能力是中国优势，临床场景仍需明确。证据等级 C。触发条件为首个适应症进入注册临床。放弃条件为降解产物安全性或监测精度不达标。"}],"children":[]},{"h":"呼气组学与无创代谢检测","lvl":3,"blocks":[{"p":"呼出气体中的挥发性有机物可以反映代谢与感染状态，采样方式极具吸引力。瓶颈在灵敏度与标准化，多年未出现被广泛接受的临床证据（推断）。"},{"p":"暂不建议布局，灵敏度与标准化长期未解决，缺乏被广泛接受的临床证据。"},{"p":"核心判断为采样无创但标准化与灵敏度长期未解决。证据等级 D。触发条件为出现多中心验证的诊断性能数据。放弃条件为检测结果受环境干扰无法标准化。"}],"children":[]},{"h":"多癌种早筛","lvl":3,"blocks":[{"p":"多癌种早筛的关键证据在 2026 年发生变化，一项覆盖 14 万人以上的随机对照试验未达到降低晚期癌症诊断比例的主要终点，尽管晚期诊断数量和检出率等次要指标有改善。该产品的上市前审批申请已在 2026 年 9 月进入专家咨询程序，但支付方对人群筛查的态度会因主要终点未达成而更谨慎（推断）。"},{"p":"暂不建议新增布局，大型随机对照试验未达主要终点，支付方态度将更谨慎。"},{"p":"核心判断为大型随机对照试验未达主要终点，支付逻辑受挫。证据等级 A。触发条件为监管批准并有支付方纳入人群筛查。放弃条件为主要终点在延长随访后仍未达成。"}],"children":[]}]},{"h":"22.6 AI 与物理世界","lvl":2,"blocks":[{"p":"表 22-6 AI 与物理世界方向技术路线与标的"},{"t":[["技术路线","得分","总排序","定位","建议跟踪标的"],["闭环给药与药械一体化","3.90","30","主动看项目","景昱医疗、国内暂无检索到合适标的"],["自主实验室与实验机器人","3.80","38","主动看项目","镁伽科技、晶泰科技"],["手术机器人自主化","3.80","39","主动看项目","山海医疗、阶梯医疗"]]},{"p":"得分、定位与标的选择为推断。"}],"children":[{"h":"闭环给药与药械一体化","lvl":3,"blocks":[{"p":"闭环系统把传感器、算法与给药装置结合，已在糖尿病管理中形成成熟产品形态，正在向神经调控与镇痛扩展。中国在硬件制造和算法上均有能力，商业模式是设备加耗材加服务（推断）。"},{"p":"建议跟踪标的为景昱医疗（神经调控闭环方向的产品基础完整）。国内暂无检索到合适标的，建议在连续监测与给药装置企业中筛选具备算法能力的团队。"},{"p":"核心判断为传感、决策与干预合为一体，收费路径清晰。证据等级 B。触发条件为新适应症的闭环系统取得注册证。放弃条件为算法同质化导致硬件价格战。"}],"children":[]},{"h":"自主实验室与实验机器人","lvl":3,"blocks":[{"p":"自主实验室让模型提出假设并自行执行验证，产出包括很少被发表的失败数据，是模型训练的独有语料。海外两家代表性公司分别以数亿美元规模融资，估值节奏明显快于实验本身的物理节奏，国内更现实的切入点是把自动化模块卖给药企与 CRO（推断）。"},{"p":"建议跟踪标的为镁伽科技（实验机器人与生命科学场景结合最紧密的国内标的）、晶泰科技（自动化实验站已与 AI 平台打通，可对外输出能力）。"},{"p":"核心判断为给 AI 补上实验闭环，但资本节奏快于实验节奏。证据等级 B。触发条件为自主平台产出的数据被第三方复现并采购。放弃条件为闭环长期停留在单一反应类型。"}],"children":[]},{"h":"手术机器人自主化","lvl":3,"blocks":[{"p":"手术机器人正从医生遥控操作走向部分自主，脑机接口电极植入本身就依赖高精度机器人，形成天然的需求绑定。扣分项是注册与伦理，自主程度越高审评越慢（推断）。"},{"p":"建议跟踪标的为山海医疗（功能神经外科的设备与耗材闭环，可延伸至植入手术精准定位）、阶梯医疗（自研手术机器人已用于侵入式脑机接口的临床植入）。"},{"p":"核心判断为脑机接口与穿刺类手术先需要自动化。证据等级 B。触发条件为部分自主功能取得注册适应症。放弃条件为自主功能长期停留在辅助定位。"}],"children":[]}]}]},{"h":"第二十三章 风险与可证伪条件","blocks":[{"p":"本报告的判断建立在四个前提之上，任何一个前提被证伪都会改变赛道排序。"},{"p":"表 23-1 可证伪条件"},{"t":[["前提","可证伪信号","影响"],["跨国药企对中国早期资产的需求持续","连续两个季度中国对外授权首付款同比下降超过 30%；COINS 规则最终版本覆盖授权交易","全部药物分子类赛道下调，研发工具与上游类赛道相对上调"],["出口管制以单品种授权例外为主","最终目录将小核酸或细胞和基因治疗的平台授权纳入许可管理","小核酸与体内 CAR-T 下调，NewCo 结构需重新评估"],["免疫重置在自免领域具有可接受的安全性","TCE 或体内 CAR-T 在自免队列中再次出现致死性免疫毒性","自免 TCE 由第一位降至第五位之后"],["监管接受 NAMs 数据用于申报","先锋计划试点两年内无申报案例，FDA 规则执行放缓","AI4S 与人源数据平台降为观察类"]]},{"p":"全部为推断。"}],"children":[]},{"h":"第二十四章 尽调 Checklist 与下一步行动","blocks":[],"children":[{"h":"24.1 尽调 Checklist","lvl":2,"blocks":[{"p":"表 24-1 尽调 Checklist"},{"t":[["优先级","赛道","问题","证伪信号"], // ---------- DNA helix
let helixStop=null;
function startHelix(cv){
  if(helixStop) helixStop();
  const ctx=cv.getContext('2d'); let W=0,H=0,dpr=1,raf=0,alive=true,visible=true;
  const parts=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,v:Math.random()*.012+.004,a:Math.random()*.5+.2}));
  const helices=[{cx:.68,cy:.5,rot:-.34,amp:.25,len:1.25,speed:.55,alpha:.95,step:15,turn:4.3},{cx:.3,cy:.86,rot:-.34,amp:.1,len:.9,speed:.38,alpha:.22,step:12,turn:3.6}];
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
  const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  function drawHelix(h,t){
    const A=Math.min(H*h.amp,170), L=Math.hypot(W,H)*h.len, k=2*Math.PI/(A*h.turn), n=Math.ceil(L/h.step);
    ctx.save(); ctx.translate(W*h.cx,H*h.cy); ctx.rotate(h.rot);
    const pts=[];
    for(let i=0;i<=n;i++){
      const x=-L/2+i*h.step, ph=x*k+t*h.speed*2*Math.PI/ (h.turn*0.9);
      const s=Math.sin(ph), c=Math.cos(ph), edge=smooth(Math.min(i,n-i)/(n*0.18));
      pts.push({x,ya:A*s,za:c,yb:-A*s,zb:-c,edge,rung:i%2===0});
    }
    // rungs (base pairs) behind strands
    for(const p of pts){ if(!p.rung) continue;
      const al=(0.10+0.22*(1-Math.abs(p.za)))*p.edge*h.alpha;
      const g=ctx.createLinearGradient(0,p.ya,0,p.yb); g.addColorStop(0,`rgba(184,130,72,${al})`); g.addColorStop(1,`rgba(3,52,145,${al*0.8})`);
      ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.ya); ctx.lineTo(p.x,p.yb); ctx.stroke(); }
    // backbones, segment by segment so depth shades the line
    const strand=(yk,zk,rgb,w)=>{for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const z=(a[zk]+b[zk])/2;
      const al=(0.25+0.6*(z+1)/2)*Math.min(a.edge,b.edge)*h.alpha; ctx.strokeStyle=`rgba(${rgb},${al})`; ctx.lineWidth=w*(0.55+0.45*(z+1)/2);
      ctx.beginPath(); ctx.moveTo(a.x,a[yk]); ctx.lineTo(b.x,b[yk]); ctx.stroke();}};
    ctx.lineCap='round'; strand('yb','zb','3,52,145',3); strand('ya','za','184,130,72',3.4);
    // nucleotide nodes, back to front
    const nodes=[]; for(const p of pts){ if(!p.rung) continue; nodes.push({x:p.x,y:p.ya,z:p.za,g:true,e:p.edge}); nodes.push({x:p.x,y:p.yb,z:p.zb,g:false,e:p.edge}); }
    nodes.sort((a,b)=>a.z-b.z);
    for(const q of nodes){ const d=(q.z+1)/2, rad=2.2+3.2*d, al=(0.35+0.65*d)*q.e*h.alpha;
      ctx.fillStyle=q.g?`rgba(196,140,78,${al})`:`rgba(18,72,170,${al})`;
      if(d>0.75){ctx.shadowColor=q.g?'rgba(184,130,72,.45)':'rgba(3,52,145,.35)';ctx.shadowBlur=8*h.alpha;} else ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(q.x,q.y,rad,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0; ctx.restore();
  }
  let last=performance.now(), t=0;
  function frame(now){
    if(!alive) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
    ctx.clearRect(0,0,W,H);
    for(const p of parts){ p.y-=p.v*dt*6; if(p.y<-0.02){p.y=1.02;p.x=Math.random();}
      ctx.fillStyle=`rgba(3,52,145,${p.a*0.22})`; ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2); ctx.fill(); }
    for(const h of helices) drawHelix(h,t);
    if(!reduceMotion && visible) raf=requestAnimationFrame(frame);
  }
  const resume=()=>{ if(alive && visible && !reduceMotion){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame);} };
  const io=new IntersectionObserver(es=>{visible=es[0].isIntersecting&&!document.hidden; if(visible) resume(); else cancelAnimationFrame(raf);});
  io.observe(cv);
  const onVis=()=>{visible=!document.hidden; if(visible) resume(); else cancelAnimationFrame(raf);};
  const onResize=()=>{size(); if(reduceMotion) frame(performance.now());};
  document.addEventListener('visibilitychange',onVis); addEventListener('resize',onResize,{passive:true});
  size(); frame(performance.now());
  helixStop=()=>{alive=false;cancelAnimationFrame(raf);io.disconnect();document.removeEventListener('visibilitychange',onVis);removeEventListener('resize',onResize);helixStop=null;};
}

function libSearch(q,limit=8){
  q=String(q||'').trim(); if(!q) return [];
  const terms=q.split(/[\s,，、;；]+/).filter(Boolean);
  const grams=new Set(); terms.forEach(tm=>{ if(tm.length<=2) grams.add(tm); else for(let i=0;i<tm.length-1;i++) grams.add(tm.slice(i,i+2)); });
  const docs=[...D.tracks.map(t=>({kind:'track',name:t.name,text:[t.name,t.logic,t.action,t.plus,t.minus,trackChapter(t,6000)].join(' ')})),
    ...D.routes.map(r=>({kind:'route',name:r.name,text:[r.name,r.dir,r.targets,txtOf(r.detail)].join(' ')})),
    ...D.companies.map(c=>({kind:'company',name:c.name,text:[c.name,c.track,c.tech,c.fund,c.bd,c.model,c.team,c.investors,c.teamEval,txtOf(c.analysis),JSON.stringify(c.pipeline||{})].join(' ')})),
    ...U.items.map(u=>({kind:'update',name:`${u.date} ${u.entity} ${u.title}`,text:[u.entity,u.title,u.summary,u.type].join(' ')}))];
  return docs.map(d=>{let s=0;terms.forEach(tm=>{if(d.name.includes(tm))s+=12;let i=d.text.indexOf(tm),n=0;while(i>=0&&n<5){s+=3;n++;i=d.text.indexOf(tm,i+1);}});grams.forEach(g=>{if(d.text.includes(g))s+=1;});
    const p=Math.max(0,...terms.map(tm=>d.text.indexOf(tm)));return {kind:d.kind,name:d.name,score:s,snippet:d.text.slice(Math.max(0,p-40),p+120)};})
    .filter(d=>d.score>2).sort((a,b)=>b.score-a.score).slice(0,limit);
}

function mdToHTML(md){
  const lines=String(md).replace(/\*\*(.+?)\*\*/g,'$1').split('\n'); let out='',list=null,tbl=[];
  const flushList=()=>{if(list){out+=`</${list}>`;list=null;}};
  const flushTbl=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,'').split('|').map(c=>c.trim()));
    out+=`<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${ent(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${ent(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;tbl=[];}};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){flushList();tbl.push(l);continue;} else flushTbl();
    let m;
    if(m=l.match(/^#{1,6}\s+(.*)/)){flushList();out+=`<h4>${ent(m[1])}</h4>`;}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){flushList();out+='<ul>';list='ul';}out+=`<li>${ent(m[1])}</li>`;}
    else if(m=l.match(/^\s*\d+[.、)]\s+(.*)/)){if(list!=='ol'){flushList();out+='<ol>';list='ol';}out+=`<li>${ent(m[1])}</li>`;}
    else if(!l.trim()){flushList();}
    else {flushList();out+=`<p>${ent(l)}</p>`;}
  }
  flushList();flushTbl();return out;
}
function ent(s){
  return inline(s).replace(/(https?:\/\/[^\s<）)」]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')

    const href=c&&key(c.name)===key(n)?`#company-${c.id}`:r?`#route-${r.id}`:t?`#track-${t.id}`:c?`#company-${c.id}`:null;
    return href?`<a class="ent" href="${href}">${n}</a>`:n;});
}

const ERRTXT={bad_access_code:'访问码不正确，请重新输入。',rate_limited:'请求过于频繁或额度不足，请稍后再试。',ai_not_configured:'AI 网关未配置模型。'};
async function aiAsk(q){
  q=String(q||'').trim(); if(!q||AI.busy) return;
  openDrawer(); if(!AI.ready||(AI.health.access_code_required&&!accessCode())) return;
  AI.busy=true; $('#aiSend').textContent='停止';
  // earlier questions go back as plain question/answer pairs: no tool steps, no provider-native blocks
  let conv=AI.turns.filter(t=>t.msg&&(t.msg.role==='user'||(t.msg.role==='assistant'&&!(t.msg.tool_calls&&t.msg.tool_calls.length)))).map(t=>t.msg.role==='assistant'?{role:'assistant',content:t.msg.content||''}:t.msg).slice(-12);
  while(conv.length&&conv[0].role!=='user') conv.shift();
  const user={role:'user',content:`${ctxBlock()}\n\n问题 ${q}`};
  AI.turns.push({role:'user',show:q,msg:user});
  const view={role:'ui',pending:true,status:'思考中',html:''}; AI.turns.push(view); AI.cur=view; aiRender();
  AI.ctl=new AbortController(); const signal=AI.ctl.signal;
  const msgs=[...conv,user]; const tools=activeTools();
  try{
    for(let round=0;round<7;round++){
      const d=await gw('/chat',{system:RULES,messages:msgs,tools:round<6?tools.map(({name,description,parameters})=>({name,description,parameters})):[]},signal);
      const m=d.message||{}; msgs.push(m);
      if(!m.tool_calls||!m.tool_calls.length){
        view.pending=false; view.html=mdToHTML(m.content||'（没有得到回答）');
        AI.turns.push({msg:m}); break;
      }
      if(m.content){view.html=mdToHTML(m.content);}
      AI.turns.push({msg:m});
      const results=await Promise.all(m.tool_calls.map(async c=>{
        const t=TOOLS.find(x=>x.name===c.name); let out;
        try{ if(!t) throw new Error('没有这个工具'); out=clip(await t.run(c.arguments||{},signal)); }
        catch(e){ if(e.name==='AbortError') throw e; out='Error: '+(e.message||e); }
        return {role:'tool',tool_call_id:c.id,name:c.name,content:out};
      }));
      results.forEach(r=>{msgs.push(r);AI.turns.push({msg:r});});
      renderSrc(); aiRender();
    }
    if(view.pending){view.pending=false;view.err='查询步骤过多，请把问题拆小一点。';}
  }catch(e){
    view.pending=false;
    if(e.name==='AbortError'){view.err='已停止。';}
    else{ view.err=ERRTXT[e.code]||e.message||'连接中断，可以再问一次。'; if(e.code==='bad_access_code'){try{localStorage.removeItem('lucion-ai-code');}catch(_){}} }
    // drop the unfinished exchange from the model-facing history so the next question starts clean
    const idx=AI.turns.indexOf(view); AI.turns=AI.turns.filter((t,i)=>i<=idx||!t.msg);
    AI.turns.forEach((t,i)=>{ if(i>AI.turns.indexOf(view)) delete t.msg; });
    const ui=AI.turns.findIndex(t=>t.msg===user); if(ui>=0) delete AI.turns[ui].msg;
  }finally{AI.busy=false;$('#aiSend').textContent='提问';aiRender();}
}

$('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#aiSend').click();}});
$('#aiBody').addEventListener('click',e=>{ if(e.target.closest('#aiCodeBtn')){ const v=$('#aiCode').value.trim(); if(v){try{localStorage.setItem('lucion-ai-code',v);}catch(_){} aiRender();} } });
$('#aiBody').addEventListener('keydown',e=>{ if(e.target.id==='aiCode'&&e.key==='Enter'){ $('#aiCodeBtn').click(); } });
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&$('#drawer').classList.contains('open'))closeDrawer();});
renderSrc(); checkGateway();

// ---------- events
document.addEventListener('click',e=>{
  const ask=e.target.closest('[data-ask]'); if(ask){aiAsk(ask.dataset.ask);return;}
  if(e.target.closest('#ctBtn')){ctLookup();return;}
  if(e.target.closest('#askInlineBtn')){const v=$('#askInline').value;$('#askInline').value='';aiAsk(v);return;}
  const sc=e.target.closest('[data-scen]'); if(sc){S.scen=sc.dataset.scen;if(S.scen!=='自定义')S.w=[...SCEN[S.scen]];save();route();return;}
  const pc=e.target.closest('[data-pos]'); if(pc){const p=pc.dataset.pos;S.rpos.has(p)?S.rpos.delete(p):S.rpos.add(p);pc.classList.toggle('on');fillRoutes();return;}
  const ut=e.target.closest('[data-ut]'); if(ut){S.ut=ut.dataset.ut;route();return;}
  const go=e.target.closest('[data-go]'); if(go&&!e.target.closest('a')){$('#tip').hidden=true;location.hash=go.dataset.go;}
  if(e.target.closest('.msg a.ent')) closeDrawer();
  if(!e.target.closest('.search'))$('#results').hidden=true;
});
document.addEventListener('keydown',e=>{if(e.target.id==='askInline'&&e.key==='Enter'&&!e.isComposing){const v=e.target.value;e.target.value='';aiAsk(v);}});
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const tip=$('#tip');
  if(t){tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(innerWidth-290,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}else tip.hidden=true;},{passive:true});
document.addEventListener('input',e=>{const id=e.target.id;
  if(e.target.dataset.w!=null){S.w[+e.target.dataset.w]=+e.target.value;save();const y=scrollY;route();scrollTo(0,y);document.getElementById(id)?.focus();}
  else if(id==='rq'){S.rq=e.target.value;fillRoutes();} else if(id==='cq'){S.cq=e.target.value;fillCompanies();}});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='rdir'){S.rdir=e.target.value;fillRoutes();} else if(id==='rsort'){S.rsort=e.target.value;fillRoutes();} else if(id==='ctrack'){S.ctrack=e.target.value;fillCompanies();}});

// ---------- global search
const IDX=[];
D.tracks.forEach(t=>IDX.push({k:'赛道',title:t.name,href:'#track-'+t.id,text:[t.name,t.logic,t.action,t.plus,t.minus].join(' ')}));
D.routes.forEach(r=>IDX.push({k:'路线',title:r.name,href:'#route-'+r.id,text:[r.name,r.dir,r.targets,txtOf(r.detail)].join(' ')}));
D.companies.forEach(c=>IDX.push({k:'企业',title:c.name,href:'#company-'+c.id,text:[c.name,c.track,c.tech,c.fund,c.bd,c.model,c.team,c.investors,c.teamEval,txtOf(c.analysis)].join(' ')}));
U.items.forEach(u=>IDX.push({k:'动态',title:u.entity+' '+u.title,href:'#updates',text:[u.entity,u.title,u.summary,u.type].join(' ')}));
D.tree.forEach((n,i)=>{IDX.push({k:'章节',title:n.h,href:'#ch-'+i,text:n.h+' '+txtOf(n.blocks)});(function rec(ns){ns.forEach(c=>{IDX.push({k:'正文',title:c.h,sub:n.h,href:'#ch-'+i,text:c.h+' '+txtOf(c.blocks)});rec(c.children);});})(n.children);});
const ORDER={'赛道':0,'路线':1,'企业':2,'动态':3,'章节':4,'正文':5}; let sel=-1;
function search(q){q=q.trim().toLowerCase();const box=$('#results');sel=-1;if(!q){box.hidden=true;return;}
  const hits=IDX.map(it=>{const ti=it.title.toLowerCase().includes(q),xi=it.text.toLowerCase().indexOf(q);if(!ti&&xi<0)return null;const p=xi<0?0:xi;return {...it,score:(ti?0:10)+ORDER[it.k],snip:it.text.slice(Math.max(0,p-16),p+44)};}).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,30);
  box.innerHTML=hits.length?hits.map(h=>`<a href="${h.href}"><span class="kind">${h.k}</span>${esc(h.title)}${h.sub?`<span class="note"> · ${esc(h.sub)}</span>`:''}<small>${esc(h.snip)}</small></a>`).join(''):'<div class="empty">无结果</div>';box.hidden=false;}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('focus',e=>{if(e.target.value)search(e.target.value)});
$('#q').addEventListener('keydown',e=>{const as=[...document.querySelectorAll('#results a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(as.length-1,sel+(e.key==='ArrowDown'?1:-1)));as.forEach((a,i)=>a.classList.toggle('sel',i===sel));as[sel]?.scrollIntoView({block:'nearest'});}
  if(e.key==='Enter'&&as.length){location.hash=as[Math.max(sel,0)].getAttribute('href');$('#results').hidden=true;e.target.blur();}
  if(e.key==='Escape')$('#results').hidden=true;});
$('#results').addEventListener('click',e=>{if(e.target.closest('a'))$('#results').hidden=true;});
$('#updCount').textContent=U.items.length||'';
route();
</script>
</body></html>
