<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><title>医药赛道研究库</title>
<style>
/* Layout: white masthead with the LUCION logo and gold-ruled tabs; overview opens on a white hero with a rotating blue and gold DNA double helix, then a grid of charts. White ground throughout; the report's 宝蓝 #033491 and 铜金 #B88248 are accents only. Single light theme by design. */
:root{
  --brand:#033491; --brand-deep:#021d57; --brand-soft:#e6ecf8; --brand-ink:#033491;
  --gold:#b88248; --gold-hi:#d9a96b; --gold-soft:#f6ecdf; --gold-ink:#8a5a26;
  --bg:#f3f6fc; --panel:#ffffff; --ink:#16213a; --muted:#595959; --line:#e3e7ef; --soft:#f3f5f9;
  --th:#033491; --th-ink:#ffffff;
  --focus:#0f7a6b; --focus-soft:#dcf1ec; --watch:#a8650b; --watch-soft:#f8ecd9; --skip:#7a8291; --skip-soft:#eceef2;
  --plate:#ffffff; --shadow:0 1px 2px rgba(3,52,145,.06),0 10px 30px rgba(3,52,145,.07);
  color-scheme:light;
  --f-body:"Microsoft YaHei","微软雅黑","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-num:"Bahnschrift","DIN Alternate","DIN Condensed","Arial Narrow","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#ffffff}
a{color:var(--brand-ink);text-decoration-color:color-mix(in srgb,var(--gold) 60%,transparent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:560px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* masthead */
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);color:var(--ink);border-top:4px solid var(--brand);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(3,52,145,.06)}
.mast-row{display:flex;align-items:center;gap:14px 24px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;margin-right:auto;min-width:0;text-decoration:none;color:var(--brand)}
.brand img{height:46px;width:auto;flex:none}
.brand .t{display:flex;flex-direction:column;line-height:1.25;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.brand b{font-size:19px;letter-spacing:.06em}
.brand span{font-size:12px;color:var(--muted)}
@media (max-width:620px){.brand .t span{display:none}.brand img{height:34px}}
.search{position:relative;flex:1 1 300px;max-width:460px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);transition:background .25s var(--ease),border-color .25s}
.search input::placeholder{color:#8a93a6}
.search input:focus{background:#fff;outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#8a93a6;fill:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(2,20,60,.28);max-height:62vh;overflow:auto;z-index:20}
.results a{display:block;padding:9px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--soft)}
.results a:hover,.results a.sel{background:var(--brand-soft)}
.results small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .kind{font-size:11px;color:var(--gold-ink);margin-right:8px;letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 16px 11px;text-decoration:none;color:var(--muted);white-space:nowrap;position:relative;transition:color .25s;font-size:16.5px}
nav.tabs a:hover{color:var(--brand)}
nav.tabs a.on{color:var(--brand);font-weight:500;background:var(--brand-soft);border-radius:10px 10px 0 0}
nav.tabs a::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold);transform:scaleX(0);transition:transform .4s var(--ease)}
nav.tabs a.on::after{transform:scaleX(1)}
nav.tabs .num{font-size:13px;color:var(--gold);margin-left:6px}

main{padding-block:0 72px}
.view{animation:rise .55s var(--ease)}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0;font-weight:700}
h1{font-size:36px;letter-spacing:.02em}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:12.5px;letter-spacing:.16em;color:var(--gold-ink);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:20px;height:2px;background:var(--gold)}
.lede{color:var(--muted);max-width:72ch;margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:22px}
.page-head{padding-block:32px 4px}
.page-head h1,.detail-head h1{color:var(--brand)}
.panel{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2,.panel-h h3{display:flex;align-items:center;gap:10px}
.panel-h h2::before,.panel-h h3::before{content:"";width:4px;height:1em;background:var(--gold);border-radius:2px}
.panel-h h2,.panel-h h3{color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.grid2 > *{min-width:0}
.g-wide{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
@media (max-width:980px){.g-wide{grid-template-columns:1fr}}

/* hero */
.hero{position:relative;background:radial-gradient(70% 95% at 78% 40%,#dfe8fa 0%,#eef3fc 40%,#ffffff 78%);color:var(--ink);overflow:hidden;border-bottom:4px solid var(--brand)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.6) 36%,rgba(255,255,255,0) 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;min-height:clamp(420px,58vh,600px);display:flex;flex-direction:column;justify-content:center;padding-block:48px 40px}
.hero .eyebrow{color:var(--gold-ink)}
.hero h1{font-size:clamp(30px,4.4vw,58px);line-height:1.2;max-width:15em;margin-top:14px;letter-spacing:.03em}
.hero h1{color:var(--brand)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--muted);max-width:46ch;margin:14px 0 0;font-size:16.5px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:34px;max-width:900px}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{padding:14px 16px;border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:12px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .3s var(--ease),border-color .3s}
.fact:hover{transform:translateY(-3px);border-color:var(--gold);border-top-color:var(--gold)}
.fact:nth-child(even){border-top-color:var(--gold)}
.fact b{display:block;font-family:var(--f-num);font-size:48px;line-height:1.05;color:var(--brand);font-weight:600}
.fact span{font-size:14px;color:var(--muted)}

/* prose & tables */
.prose p{margin:0 0 12px;max-width:76ch}
.prose p.cap{font-size:14px;color:var(--brand-ink);margin:20px 0 6px;font-weight:500}
.prose p.src{font-size:13px;color:var(--muted)}
.prose h3{margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.prose h3:first-child{margin-top:0}
.prose h4{font-size:16px;margin:20px 0 6px;color:var(--brand-ink)}
.tag-inf{font-size:12px;color:var(--gold-ink);background:var(--gold-soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag-ev{font-family:var(--f-num);font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
figure{margin:12px 0 16px;background:var(--plate);border-radius:8px;padding:10px;max-width:860px;border:1px solid var(--line)}
figure img{display:block;width:100%;height:auto}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--soft)}
th{background:var(--th);color:var(--th-ink);font-weight:400;font-size:13px;white-space:nowrap;text-align:center;border-bottom:2px solid var(--gold)}
td.c{text-align:center}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#fafbfd}
.prose table td{min-width:7em}
tr.click{cursor:pointer;transition:background .2s}
tr.click:hover td{background:var(--gold-soft)}

.pill{display:inline-block;font-size:12.5px;padding:1px 10px;border-radius:999px;white-space:nowrap}
.p-重点跟踪{background:var(--brand);color:#fff}
.p-主动看项目{background:var(--gold-soft);color:var(--gold-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 50%,transparent)}
.p-保持观察{background:var(--soft);color:var(--brand-ink)}
.p-暂不投入{background:var(--skip-soft);color:var(--skip)}
.bar{position:relative;height:9px;background:var(--soft);border-radius:5px;min-width:70px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--gold)));border-radius:5px;transition:width .6s var(--ease)}
.scorecell{display:flex;align-items:center;gap:10px}
.scorecell .num{width:2.6em;font-size:16px}
.heat{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:6px;font-family:var(--f-num);font-size:15px}
.h1{background:var(--soft);color:var(--muted)}
.h2{background:color-mix(in srgb,var(--brand) 16%,var(--panel));color:var(--ink)}
.h3{background:color-mix(in srgb,var(--brand) 36%,var(--panel));color:var(--ink)}
.h4{background:color-mix(in srgb,var(--brand) 66%,var(--panel));color:#fff}
.h5{background:var(--brand);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
.rankdelta{font-size:12.5px;font-family:var(--f-num)}
.up{color:var(--focus)} .dn{color:var(--watch)}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;color:var(--muted);transition:background .25s,color .25s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--brand);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13.5px;color:var(--muted);transition:all .25s var(--ease)}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
select,.field{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--panel)}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin:4px 0 16px}
.sliders label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13.5px;color:var(--muted)}
.sliders input{grid-column:1/-1;accent-color:var(--gold);width:100%}
.note{font-size:13px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);min-width:0;position:relative;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand)}
.card:hover::before{transform:scaleX(1)}
.card b{font-size:17px;color:var(--brand)}
.card .meta{font-size:12.5px;color:var(--gold-ink)}
.card p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .badge{position:absolute;right:12px;top:12px;font-size:11.5px;background:var(--gold);color:#fff;padding:0 8px;border-radius:999px}

.dl{display:grid;grid-template-columns:9em 1fr;gap:12px 18px;margin:0}
.dl dt{color:var(--gold-ink);font-size:13.5px}
.dl dd{margin:0;min-width:0}
@media (max-width:560px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:10px}}
.back{font-size:13.5px;text-decoration:none;color:var(--muted);display:inline-block;margin-top:22px}
.back:hover{color:var(--gold-ink)}
.detail-head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:8px 4px}
.bigscore{text-align:right}
.bigscore b{display:block;font-family:var(--f-num);font-size:60px;line-height:1;font-weight:600;color:var(--brand-ink)}
.bigscore b::after{content:"";display:block;height:3px;background:var(--gold);margin-top:6px;border-radius:2px}
.bigscore small{font-size:13px;color:var(--muted);display:block;margin-top:6px}
.metaline{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.linklist{display:flex;flex-wrap:wrap;gap:8px}
.linklist a,.linklist span{font-size:14px;padding:3px 12px;border:1px solid var(--line);border-radius:6px;text-decoration:none}
.linklist a{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));background:var(--gold-soft);color:var(--gold-ink)}
.linklist span{color:var(--muted)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pm div{padding:10px 12px;border-radius:8px;font-size:14px}
.pm .plus{background:var(--brand-soft)} .pm .minus{background:var(--gold-soft)}
.pm span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
@media (max-width:560px){.pm{grid-template-columns:1fr}}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:13.5px}
.chart .lbl{fill:var(--ink);font-size:15px}
.chart .val{fill:var(--brand-ink);font-family:var(--f-num);font-size:17px}
.chart svg.px{width:100%;height:auto}
.noanim *{animation:none!important}
.panel.fill{display:flex;flex-direction:column}
.panel.fill [data-chart]{flex:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hb{fill:var(--brand);opacity:.78;transition:opacity .25s;transform-box:fill-box;transform-origin:left center;animation:grow .9s var(--ease) both}
.chart .hb.top{opacity:1}
.chart .hb-cap{fill:var(--gold)}
@keyframes grow{from{transform:scaleX(.55)}to{transform:none}}
.chart g.row{cursor:pointer}
.chart g.row:hover .hb{opacity:1}
.chart g.row:hover .lbl{fill:var(--gold-ink)}
.chart .dot{stroke:var(--panel);stroke-width:1.5;cursor:pointer;transition:transform .2s var(--ease);transform-box:fill-box;transform-origin:center}
.chart .dot:hover{transform:scale(1.45)}
.d-重点跟踪{fill:var(--brand);background:var(--brand)} .d-主动看项目{fill:var(--gold);background:var(--gold)} .d-保持观察{fill:color-mix(in srgb,var(--brand) 55%,var(--panel));background:color-mix(in srgb,var(--brand) 55%,var(--panel))} .d-暂不投入{fill:var(--skip);background:var(--skip)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#fff;color:var(--ink);font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);border-left:3px solid var(--gold);box-shadow:0 8px 24px rgba(3,52,145,.14);z-index:40;max-width:280px;line-height:1.5}
.radar .poly{fill:color-mix(in srgb,var(--brand) 22%,transparent);stroke:var(--brand);stroke-width:2;stroke-dasharray:900;animation:draw 1.4s var(--ease) 1}
.radar .ring{fill:none;stroke:var(--line)}
.radar .pt{fill:var(--gold)}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.donut .arc{transition:opacity .25s;cursor:default}
.donut:hover .arc{opacity:.55}.donut .arc:hover{opacity:1}
.donut .big{font-family:var(--f-num);font-size:44px;fill:var(--ink);font-weight:600}
.donut-wrap{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:18px;align-items:center}
@media (max-width:520px){.donut-wrap{grid-template-columns:1fr}.donut-wrap .chart{max-width:220px;margin:0 auto}}
.dl-pos{display:flex;flex-direction:column;gap:10px}
.dl-pos div{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:15px}
.dl-pos i{width:12px;height:12px;border-radius:3px}
.dl-pos b{font-family:var(--f-num);font-size:26px;font-weight:600}
.hm{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(7,minmax(38px,1fr)) minmax(70px,1fr);gap:5px;min-width:760px;font-size:15px}
.hm .hd{color:var(--muted);font-size:12.5px;text-align:center;padding-bottom:4px}
.hm .nm{display:flex;align-items:center;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hm .cell{height:40px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-num);font-size:18px;cursor:pointer;transition:transform .2s var(--ease)}
.hm .cell:hover{transform:scale(1.08)}
.hm .cell.heat{width:auto}
.chart .sb{transform-box:fill-box;transform-origin:left center;animation:grow .9s var(--ease) both}
.hm .tot{display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:19px;color:var(--brand-ink);cursor:pointer}
.hm .row-hover{color:var(--gold-ink)}
.hm-wrap{overflow-x:auto}
.mini-feed{display:flex;flex-direction:column}
.mini-feed a{display:grid;grid-template-columns:62px 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--soft);text-decoration:none;color:var(--ink)}
.mini-feed a:last-child{border-bottom:0}
.mini-feed time{font-family:var(--f-num);color:var(--gold-ink);font-size:16px}
.mini-feed small{grid-column:2;color:var(--muted);font-size:12.5px}

/* pipeline */
.pipe{display:flex;flex-direction:column}
.pipe-h,.pipe-r{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(180px,1.5fr) minmax(300px,2.4fr) minmax(130px,1fr);gap:8px 18px;align-items:center}
.pipe-h{font-size:12.5px;color:var(--muted);padding:0 0 8px;border-bottom:2px solid var(--gold)}
.pipe-h .stg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.pipe-r{padding:14px 0;border-bottom:1px solid var(--soft)}
.pipe-r:last-child{border-bottom:0}
.pipe-r .as{font-weight:700;color:var(--brand);font-size:16px;line-height:1.35}
.pipe-r .as small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.pipe-r .ti{font-size:14px;line-height:1.5}.pipe-r .ti span{display:block;color:var(--muted);font-size:13px}
.pipe-r .pt{font-size:13.5px;color:var(--gold-ink)}
.track{position:relative;height:30px;display:grid;grid-template-columns:repeat(7,1fr);align-items:center}
.track i{height:8px;background:var(--soft);border-right:2px solid #fff}

第一个维度是证据等级，用于说明来源本身的可靠性；第二个维度是陈述性质，用于说明这句话究竟是事实、企业的单方面说法、本报告的推论，还是为测算而设定的参数。两者相互独立，需分开判断。"},{"t":[["证据等级","含义","可用于投资决策的程度"],["A","监管机构原始文件、上市公司法定披露、同行评审论文","可直接引用"],["B","公司正式公告、权威媒体报道、律所与券商公开解读","可引用，须注明主体与口径"],["C","行业媒体、商业数据库、第三方市场研究","仅作参考，不作决策依据"],["D","企业自述材料、创始人口述、未经验证的性能或成本数据","不可作为事实使用"]]},{"t":[["陈述性质","含义"],["事实","已被 A 级或 B 级来源确证的客观事件"],["公司宣称","由企业单方面披露、尚未独立验证的表述"],["推断","本报告基于已知事实作出的逻辑推论，正文以（推断）标注"],["情景假设","为测算而设定的参数，不代表对现实的判断"]]},{"p":"举一个说明这套标注如何使用的例子。2025 年中国创新药对外授权潜在交易总额约 1357 亿美元属于 B 级证据、事实；但交易总额只是合同名义总额，可兑现价值取决于里程碑达成率，若直接把总额等同于收入就是误读。企业披露的平台合作潜在总额、管线估值和成本优势通常属于 D 级、公司宣称，在获得第三方复现之前不作为事实使用。"},{"p":"凡进入摘要、第三章打分结果与各赛道投资判断的关键数字，其证据等级在对应表格的资料来源行或附录 D 中列出；口径不一致的数据在附录 C 中逐项说明。"}],"children":[]},{"h":"摘要","blocks":[{"p":"本报告自上而下覆盖医药全产业链，从上游耗材与科研仪器、AI 药物发现与类器官数据平台、CXO，到创新药各技术平台、商业化与支付服务以及仿制药集采品种，共筛选十六个细分赛道，并对四十八家头部企业逐家分析其融资、BD、业务模式、技术范式、团队与已进入的投资机构。"},{"p":"打分采用七个维度的加权模型。考虑到早期投资投的是五年后的产业格局，前瞻性权重设为 30%，其余为市场空间与支付 15%、中国优势与全球兑现 15%、竞争格局 10%、证据成熟度 10%、估值与退出 10%、鲁信适配度 10%，并用等权、前瞻性加重和地缘压力三套情景检验排序的稳健性。"},{"p":"基准情景下，自免 T 细胞衔接器与免疫重置（4.20）、诱导接近（4.10）、小核酸（3.95）、类器官与 NAMs 数据平台（3.70）和医用同位素与核药（3.60）位列前五，且在四套情景下均进入前六。体内 CAR-T 与 ADC 分列第六、第七，前者受 2026 年 8 月诺华自免 CAR-T 试验暂停影响定位为期权跟踪，后者确定性高但拥挤度明显。仿制药集采品种与商业化支付服务得分最低，不作为主动布局方向。"},{"p":"中国创新药已经从跟随式开发转向全球资产供给方，但交易总额与可兑现价值之间存在显著折价，首付款仅占总额的一成以内。2025 年末至 2026 年第四季度外部约束明显收紧，美国 BIOSECURE 条款已写入国防授权法，美国财政部对外投资规则拟议稿与国内针对细胞基因治疗、小核酸等原创技术的出口管制征求意见稿相继发布。项目筛选需同时评估资产的全球授权潜力与跨境交易的合规路径。"},{"p":"本报告同时在技术路线层面展开，对价值分化明显的赛道按技术路线细分，并纳入尚未形成独立赛道的前沿方向，共六十四条技术路线统一打分，每条路线给出一至三家建议跟踪的标的。基准权重下得分前列的路线包括小激活 RNA、表观遗传编辑、脑机接口上游部件与植入装备、侵入式脑机接口、RNA 编辑、α 核素与锕 225 供应、异种器官移植和高通量扰动筛选。其中前沿路线不给出投或不投的结论，按期权池标准跟踪触发条件。"},{"p":"建议在 2026 年至 2027 年以天使轮至 A 轮小额多点方式布局前五个赛道中具备自有数据和全球首创潜力的早期项目，同时对体内 CAR-T 与基因编辑保持跟踪。各赛道的会投、不会投、投资条件、必须验证的指标与放弃条件见第四章至第十九章投资判断一节；可证伪条件见第二十章，尽调清单见第二十一章。"}],"children":[]},{"h":"第一章 核心结论","blocks":[],"children":[{"h":"1.1 总体判断","lvl":2,"blocks":[{"p":"中国创新药已经从跟随式开发转向全球资产供给方。2025 年中国创新药对外授权潜在交易总额约 1357 亿美元，首付款约 70 亿美元，交易 157 笔，占全球授权交易总额约 49%；2026 年前三季度对外授权交易额约 1300 亿美元，已接近 2025 年全年水平。全球大型药企在 2025 年至 2030 年面临 1710 亿至 3000 亿美元不等的专利到期收入缺口，对中国早期资产的需求在中期内具有结构性支撑。"},{"p":"交易总额与可兑现价值之间存在显著折价。2026 年上半年对外授权首付款约占交易总额的 5%，行业统计显示过去九年生物医药授权交易中六成以上的里程碑未能达成。因此本报告在赛道评估中只把首付款和已验证的临床数据视为硬证据，把潜在总额视为期权价值（推断）。"},{"p":"外部约束在 2025 年末至 2026 年第四季度明显收紧。美国 BIOSECURE 条款已于 2025 年 12 月写入国防授权法，美国财政部于 2026 年 10 月 22 日发布拟议规则，拟将生物技术纳入对外投资限制范围，征求意见截至 2026 年 12 月 7 日；商务部与科技部于 2026 年 10 月 16 日就禁止和限制出口技术目录征求意见，生物医药部分新增细胞和基因治疗原创技术、小核酸药原创技术和病原微生物技术，并对相关技术出口实施临时登记。两项规则的最终文本将直接影响平台型授权、NewCo 和美元基金参与方式，是 2026 年底至 2027 年上半年最重要的政策变量（推断）。"},{"p":"在含前瞻性权重的十六个细分赛道打分中，自免 T 细胞衔接器与免疫重置、诱导接近（分子胶与降解剂）、小核酸、类器官与 NAMs 数据平台、医用同位素与核药五个赛道在四套权重情景下均排在前六位，作为本报告的优先布局方向。AI 药物发现平台单独打分居中，主要受证据成熟度和估值拥挤拖累，本报告将其与类器官和器官芯片合并为“AI4S 与人源数据平台”一个方向研究，优先看自产数据并具备实验闭环的公司。"}],"children":[]},{"h":"1.2 优先赛道与建议动作","lvl":2,"blocks":[{"p":"表 1 优先赛道排序与建议动作"},{"t":[["排序","赛道","基准得分","核心逻辑","建议动作"],["1","自免 T 细胞衔接器与免疫重置","4.20","B 细胞深度清除有望把自免治疗从长期抑制推向免疫重置，2026 年中国资产占公开交易多数","看临床前至 I 期的差异化分子与递送平台，回避同质化 CD19×CD3"],["2","诱导接近（分子胶与降解剂）","4.10","RAS 等难成药靶点被分子胶路线打开，临床前资产已获 4 亿美元首付款","跟踪新 E3、新底物和非降解型分子胶团队，偏早期介入"],["3","小核酸（siRNA）","3.95","长效给药切入慢病大适应症，肝外递送是下一代价值所在","聚焦肝外递送平台，交易前核实出口管制条目适用性"],["4","类器官与 NAMs 数据平台","3.70","监管接受 NAMs 后，人源模型数据成为新药申报证据与 AI 训练数据","优先数据自产型平台，AI 叙事公司按服务收入估基础价值"],["5","医用同位素与核药","3.60","同位素国产化打开供给约束，国资与产业资本密集入场","看上游同位素与 α 核素制备，核药管线看差异化靶点"]]},{"p":"资料来源为本报告打分模型，得分与排序为推断。"}],"children":[]},{"h":"1.3 现在投还是等","lvl":2,"blocks":[{"p":"自免免疫重置与诱导接近处于技术验证早期、跨国药企买方需求明确的阶段，早期资产议价正在上移，适合在 2026 年至 2027 年以天使轮至 A 轮小额多点介入，同时把首个人体数据作为加仓条件（推断）。小核酸头部公司估值已较高，新增资金更适合投向肝外递送和新靶点的早期团队，并等待出口管制目录最终文本后再确定交易结构（推断）。AI4S 方向一级市场估值显著高于二级市场，例如 Anew Labs 首轮投后估值约 15 亿美元，而已上市的剂泰科技与英矽智能市值分别约 26 亿美元和 44 亿美元，建议回避单纯算法平台，只在数据资产可核实时出手（推断）。核药方向产业化周期长，适合与同位素产能和地方核医学资源结合布局（推断）。"}],"children":[]}]},{"h":"第二章 行业环境与产业链全景","blocks":[],"children":[{"h":"2.1 资本与交易环境","lvl":2,"blocks":[{"p":"对外授权已经成为中国生物科技公司的主要现金来源。2025 年前三季度对外授权首付款合计 45.5 亿美元，超过同期创新药一级市场融资总额 31.9 亿美元；2024 年对外授权首付款 31.6 亿美元，同样高于当年创新药研发融资额。交易单价也在上升，Evaluate 数据显示中国与西方药企授权交易的平均首付款由 2022 年约 5200 万美元升至 2026 年约 1.72 亿美元。"},{"img":"image3.png"},{"p":"图 1 中国创新药对外授权潜在交易总额"},{"p":"资料来源为医药魔方 NextPharma、国家药监局与国家发改委公开披露，证据等级 B 至 C。2026 年数据口径与 2025 年不完全一致，详见附录 C。"},{"p":"一级市场在 2025 年下半年回暖，2026 年延续量价齐升。2026 年上半年中国医疗健康一级市场融资 814 起、725.6 亿元，同比分别增长 13.8% 和 41.7%，上市前融资金额前二十名只覆盖创新药和医疗器械两类，其中创新药占融资额 65%，且多数集中在 B 轮及以后。2025 年天使轮融资同比下滑接近 33%，B 轮增长 36%，说明资金偏向风险已部分出清的资产，早期项目的定价竞争相对温和（推断）。"},{"p":"退出渠道明显改善。2025 年共有 37 家医疗企业完成上市，较 2024 年的 17 家翻倍，截至 2025 年末港交所仍有超过 60 家医疗企业排队。港股 18A 上市的小核酸公司瑞博生物、AI 制药公司英矽智能、剂泰科技以及即将上市的核药公司先通医药，为本报告优先赛道提供了可比的二级市场定价锚。"}],"children":[]},{"h":"2.2 政策与支付","lvl":2,"blocks":[{"p":"供给端审评提速。国家药监局药品审评中心发布的年度审评报告显示，2025 年批准上市 1 类创新药 76 个，其中新机制新靶点药物 11 个，均创历史新高；同年 102 件预防用生物制品临床试验申请中近六成为创新型疫苗，1327 件治疗用生物制品临床试验申请中创新品种超过八成。"},{"p":"支付端形成双目录。2025 年国家医保目录新增 114 种药品，其中 1 类创新药 50 种，谈判成功率 88%；首版商业健康保险创新药品目录纳入 19 种药品，五款申报的 CAR-T 全部纳入，罕见病药品占比接近三分之一，自 2026 年 1 月 1 日起执行。商保目录对高值细胞治疗和罕见病药品的放量作用仍需观察实际赔付数据（推断）。"},{"p":"仿制药集采进入规则优化阶段。第十一批国家集采按照稳临床、保质量、反内卷、防围标原则设计，医疗机构可按厂牌报量，引入锚点价和复活机制，并要求企业承诺报价不低于成本；272 家企业的 55 种 453 个产品获得拟中选资格。仿制药价格下行压力有所缓和，但行业整体仍不具备风险投资所需的成长弹性（推断）。"},{"p":"研发工具监管出现范式变化。美国 FDA 于 2025 年 4 月宣布逐步减少单抗等药物的动物实验要求，2026 年 3 月发布 NAMs 验证指南草案，2026 年 9 月宣布将在法规中以非临床研究替代动物试验表述，该规则拟于 2027 年 2 月 4 日生效。国家药监局药审中心于 2026 年 7 月 7 日就推进新方法研究和应用试点计划（先锋计划）征求意见，首次以系统化试点方式将类器官、器官芯片等新方法纳入药品非临床评价的监管考量。"}],"children":[]},{"h":"2.3 外部约束","lvl":2,"blocks":[{"p":"表 2 2025 年至 2026 年主要外部规则"},{"t":[["规则","状态","主要内容","对投资的影响（推断）"],["美国 BIOSECURE 条款","2025 年 12 月 18 日签署生效","限制联邦采购与资助涉及被认定的生物技术关注企业，药明康德与药明生物目前不在受限名单，存量合同有五年安全期","对 CXO 订单的直接冲击小于市场早期预期，名单更新仍是持续风险"],["美国 COINS 法案拟议规则","2026 年 10 月 22 日发布，征求意见至 2026 年 12 月 7 日","拟将生物技术纳入对外投资禁止和申报范围，覆盖小分子、疫苗、细胞与基因治疗、单抗等，以及实验自动化与云实验室","美元基金投资中国早期生物科技公司的难度上升，人民币基金与国资的定价权提高"],["中国禁止出口限制出口技术目录修订","2026 年 10 月 16 日征求意见，至 11 月 15 日止，同步实施出口前临时登记","生物医药新增细胞和基因治疗原创技术、小核酸药原创技术、病原微生物技术；具体药物品种所需技术与不转让所有权的平台授权、外包服务不纳入技术出口管理","单品种授权基本不受影响，平台所有权转让、整体出售与部分 NewCo 结构需逐案评估"]]},{"p":"资料来源为 Arnold & Porter、Latham & Watkins、美国财政部拟议规则解读、商务部公告与君合、汉坤、中伦律师事务所解读，证据等级 A 至 B。"},{"p":"两项新规则方向相反但效果叠加。美方规则限制美国资本进入，中方规则限制核心平台技术外流，两者共同指向一个结果，即中国早期生物科技资产在未来两到三年更依赖人民币资本完成早期定价，再以单品种授权方式兑现海外价值（推断）。这对鲁信这类国资背景、以人民币基金为主的机构是相对有利的窗口。"}],"children":[]},{"h":"2.4 产业链价值分布与利润环节","lvl":2,"blocks":[{"p":"表 3 医药产业链价值分布"},{"t":[["环节","代表细分","价值来源","利润特征","中国位置"],["上游工具与原料","培养基、层析填料、科研仪器、医用同位素","替代进口与随管线放量","毛利高但单品规模有限，龙头已上市","国产替代推进中，同位素供给仍受限"],["研发平台与服务","CRO、CDMO、AI 药物发现、类器官与器官芯片","按项目收费与里程碑分成","CDMO 规模效应强，平台公司收入波动大","CDMO 全球领先，AI 与 NAMs 处于商业化验证期"],["治疗药物分子","ADC、双抗、小核酸、TCE、分子胶、核药","授权首付款、里程碑与销售分成","利润弹性最大，成功率最低","全球资产供给方，早期研发速度与成本优势显著"],["下游商业化与支付","医药流通、商保、DTP 药房、仿制药","渠道与规模","利润率受政策压制","政策主导，风险投资空间有限"]]},{"p":"资料来源为公开资料整理，利润特征与中国位置为推断。"},{"p":"利润最集中的环节有两类。一类是具备全球差异化的药物分子，通过授权首付款和后续分成兑现价值，弹性最大；另一类是已经进入商业化供应链的平台服务，例如多肽与寡核苷酸 CDMO，药明康德 2026 年前三季度 TIDES 业务收入 115.2 亿元，同比增长 46.9%，在手订单 767.4 亿元。后者确定性高但头部已上市，风险投资可参与的空间主要在前者和尚未规模化的新型研发工具（推断）。"},{"img":"image4.png"},{"p":"图 2 细分赛道二维竞争格局（产业链位置 × 主要价值兑现方式）"},{"p":"图中数字为基准权重下加权得分，蓝色为优先赛道，铜色为单独打分但并入 AI4S 方向研究的 AI 药物发现平台。分类与得分为推断。"},{"p":"从格局图看，治疗药物分子与授权兑现这一类别聚集了八个细分赛道，竞争最集中，赛道间的差异主要来自技术代际和拥挤度。研发平台类赛道分布在三种不同的兑现方式上，其中只有类器官与 NAMs 数据平台落在数据与平台订阅类别，这一类别目前在国内几乎空白，是前瞻性最强也最不确定的位置（推断）。"}],"children":[]},{"h":"2.5 头部机构布局观察","lvl":2,"blocks":[{"p":"对本报告 48 家头部企业的公开股东信息进行汇总，可以看到头部机构在各赛道的布局有明显的重合与分工。以下统计只包括公开报道中明确出现的机构，未披露名单的企业未计入，机构在同一企业多轮出现只计一次。"},{"p":"表 3A 头部机构在本报告企业中的布局"},{"t":[["机构","类型","已进入的本报告企业","布局特征（推断）"],["正心谷资本","市场化人民币基金","艾博生物、舶望制药、微滔生物、尧唐生物","集中布局核酸与体内基因或细胞技术平台，多次领投"],["启明创投","市场化美元与人民币基金","艾博生物、格博生物、圣因生物、微滔生物","覆盖分子胶、小核酸与体内 CAR-T，早期持续加注"],["礼来亚洲基金","产业背景美元基金","艾博生物、格博生物、圣因生物、映恩生物","偏好平台型早期公司，与跨国药企交易节奏相关"],["高瓴（含高瓴创投）","市场化基金","艾博生物、圣因生物、瑞博生物、剂泰科技（基石）、Anew Labs","跨越早期与上市前，覆盖核酸与 AI 制药"],["奥博资本（OrbiMed）","专业医疗美元基金","靖因药业（联合创立）、微滔生物","以孵化与专业判断见长，受美国对外投资规则影响最大"],["中国生物制药及其产业基金","产业资本","圣因生物、虹信生物、Anew Labs，并全资收购赫吉亚生物","以投资加并购方式布局小核酸与体内 CAR-T，是潜在退出方"],["阿斯利康中金医疗产业基金","产业背景人民币基金","纽瑞特医疗、尧唐生物","布局核药与基因编辑，与阿斯利康在华产业布局一致"],["晶泰科技","上市公司产业投资","耀速科技、希格生科、剂泰科技（孵化）","围绕 AI 加湿实验构建生态，是 AI4S 方向的天然联合投资方"],["松禾资本","市场化人民币基金","希格生科、湾岛细胞、尧唐生物","偏好科学家创业的早期项目"],["国寿股权","保险资金","先通医药、耀速科技","长期资金参与核药与 NAMs 平台"],["国家及地方国资基金","国资","先通医药（国投创业、国调基金）、纽瑞特医疗（上海科创集团、上海国鑫）、深势科技（北京市人工智能与医药健康基金）、尧唐生物（上海国投先导）、虹信生物（国开科创）","国资在核药、AI4S 和基因编辑中已成为领投方，与地方产业落地绑定"]]},{"p":"资料来源为本报告第四章至第十九章所列融资报道，证据等级 B 至 C；布局特征为推断。"},{"p":"从机构分布看，人民币市场化基金与国资基金在核药、基因编辑、AI4S 与体内 CAR-T 中的领投角色明显增强，美元基金集中在小核酸与体内 CAR-T 的早期平台。在美国对外投资规则可能收紧的背景下，美元基金为主的项目在后续融资和退出上存在不确定性，以人民币基金与国资为主的项目更适合鲁信参与联合投资（推断）。"},{"p":"从联合投资角度，正心谷资本、启明创投、松禾资本、阿斯利康中金医疗产业基金和晶泰科技在本报告优先赛道中出现频率较高，可作为项目来源与联合投资的优先沟通对象；中国生物制药等产业资本则是潜在的并购退出方。与上述机构的接触应按机构流程报备后开展（推断）。"}],"children":[]}]},{"h":"第三章 赛道筛选方法与打分结果","blocks":[],"children":[{"h":"3.1 打分维度与权重","lvl":2,"blocks":[{"p":"打分采用七个维度，每个维度按 1 至 5 分评分，再按权重加总。前瞻性权重设为 30%，为单一最高权重，用于体现投资的是五至十年后的产业格局而非当前景气度。其余维度覆盖市场空间、中国比较优势、竞争格局、证据成熟度、估值与退出以及与鲁信的适配度。"},{"p":"表 4 打分维度与权重"},{"t":[["维度","权重","评分含义","5 分标准","1 分标准"],["前瞻性","30%","技术代际位置与范式确定性","代表下一代治疗范式且已有人体或监管信号","成熟技术，增量来自价格或份额"],["市场空间与支付","15%","全球可及患者与支付能力","慢病或大适应症，全球支付意愿明确","细分罕见或支付受政策压制"],["中国优势与全球兑现","15%","中国团队效率与海外交易可兑现性","跨国药企持续购买中国资产且首付款高","以国内市场为主，出海通道受限"],["竞争格局","10%","同类项目拥挤度，反向计分","全球同类项目少，差异化空间大","同靶点同机制项目密集"],["证据成熟度","10%","临床与监管证据的充分性与安全性","已有上市产品或关键临床数据","仅有临床前或出现重大安全事件"],["估值与退出","10%","一级估值合理性与退出通道","估值未充分反映价值且退出路径清晰","估值透支或退出通道不畅"],["鲁信适配度","10%","阶段、国资属性与区域产业协同","人民币早期资金有议价权且可对接产业资源","需美元结构或大额后期资金"]]},{"p":"权重与评分标准为本报告设定。"}],"children":[]},{"h":"3.2 十六个细分赛道打分","lvl":2,"blocks":[{"p":"表 5 十六个细分赛道打分"},{"t":[["细分赛道","前瞻性","市场","中国优势","竞争","证据","估值退出","适配","加权得分"],["自免 T 细胞衔接器与免疫重置","5","5","5","3","2","4","3","4.20"],["诱导接近（分子胶与降解剂）","5","4","4","4","3","4","3","4.10"],["小核酸（siRNA）","4","5","4","3","4","4","3","3.95"],["类器官与 NAMs 数据平台","5","2","4","4","2","3","4","3.70"],["医用同位素与核药","4","3","3","4","3","4","4","3.60"],["体内 CAR-T 与细胞治疗","5","4","4","3","1","3","2","3.60"],["ADC 与偶联药物","3","5","5","1","5","3","2","3.50"],["基因编辑","5","3","3","4","2","2","2","3.40"],["双抗与多抗（肿瘤）","3","5","5","1","4","3","2","3.40"],["AI 药物发现平台","5","3","3","2","2","3","2","3.30"],["代谢与减重","3","5","4","1","4","3","2","3.25"],["科研仪器与实验自动化","4","3","2","3","3","3","3","3.15"],["CXO（小分子与 TIDES）","2","4","5","2","5","2","2","3.05"],["生物药上游耗材与原料","2","3","3","3","5","3","4","3.00"],["商业化与支付服务","2","3","1","3","4","2","3","2.40"],["仿制药与集采品种","1","3","2","1","4","1","2","1.85"]]},{"p":"评分理由见附录 A，全部评分为推断。Excel 打分模型可调整权重后自动重算。"},{"img":"image5.png"},{"p":"图 3 基准权重下的赛道得分"}],"children":[]},{"h":"3.3 权重敏感性","lvl":2,"blocks":[{"p":"为检验排序是否依赖前瞻性权重，设置四套情景。等权情景各维度权重相同；前瞻性加重情景将前瞻性权重提高到 40%；地缘压力情景将中国优势权重降到 5%，证据成熟度权重提高到 20%，用于模拟出海通道收紧时更看重自身证据的判断方式。"},{"p":"表 6 四套权重情景下的前六名"},{"t":[["情景","第一","第二","第三","第四","第五","第六"],["基准","自免 TCE 4.20","诱导接近 4.10","小核酸 3.95","NAMs 平台 3.70","同位素与核药 3.60","体内 CAR-T 3.60"],["等权","小核酸 3.86","自免 TCE 3.86","诱导接近 3.86","同位素与核药 3.57","NAMs 平台 3.43","ADC 3.43"],["前瞻性加重","自免 TCE 4.28","诱导接近 4.22","小核酸 3.94","NAMs 平台 3.89","体内 CAR-T 3.77","同位素与核药 3.67"],["地缘压力","诱导接近 4.00","小核酸 3.95","自免 TCE 3.90","同位素与核药 3.60","NAMs 平台 3.50","ADC 3.50"]]},{"p":"资料来源为本报告打分模型。"},{"p":"自免 TCE、诱导接近、小核酸、同位素与核药、NAMs 平台五个赛道在四套情景下均进入前六，排序结论对权重设置不敏感。体内 CAR-T 只在前瞻性权重较高时进入前六，原因是 2026 年 8 月诺华自免 CAR-T 项目因三例致死性免疫效应细胞相关噬血细胞综合征暂停八项试验，证据成熟度得分最低；本报告在第九章单独分析，定位为期权跟踪。ADC 在等权和地缘压力情景下进入前六，说明其确定性高但前瞻性和拥挤度拖累明显。"}],"children":[]},{"h":"3.4 入选赛道的确定","lvl":2,"blocks":[{"p":"按得分把十六个赛道分为五类定位。优先布局为自免 TCE 与免疫重置、诱导接近、小核酸、类器官与 NAMs 数据平台、医用同位素与核药；期权跟踪为体内 CAR-T 与细胞治疗、基因编辑；精选参与为 ADC 与偶联药物、双抗与多抗；审慎参与为 AI 药物发现平台、代谢与减重、科研仪器与实验自动化；二级观察与不主动布局为 CXO、上游耗材、商业化与支付、仿制药与集采。五个优先方向分别对应药物分子、研发工具和上游原料三个产业链位置，避免组合过度集中在授权兑现这一种价值路径上（推断）。"}],"children":[]}]},{"h":"第四章 自免 T 细胞衔接器与免疫重置","blocks":[{"p":"本赛道基准得分为 4.20，在十六个细分赛道中排第 1 位，定位为优先布局。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"4.1 行业分析","lvl":2,"blocks":[{"p":"自身免疫疾病的现有疗法以长期抑制免疫反应为主，难以清除组织驻留 B 细胞和长寿命浆细胞。CD19 CAR-T 在狼疮等疾病中展示了深度 B 细胞清除后的无药缓解，带动行业寻找更安全、更易规模化的替代方式，主要包括双特异性或三特异性 T 细胞衔接器（TCE）、mRNA 编码的 TCE 和体内 CAR-T 三类技术。本章聚焦 TCE 与 mRNA TCE，体内 CAR-T 在第九章单独分析。"},{"p":"2026 年该方向成为全球交易最活跃的领域之一。行业统计显示半年内公开的自免 TCE 交易有 16 笔，其中 10 笔的核心资产来自中国；吉利德与优时比分别以约 21.75 亿美元和 22 亿美元收购核心资产。中国资产的优势与 ADC 早期相似，即早期管线储备充足、靶点组合差异化明显、开发速度快；与 ADC 不同的是，自免 TCE 的靶点更分散，对临床开发能力要求更高（推断）。"},{"p":"安全性是最大的不确定因素。2026 年 8 月 24 日起，诺华因三例致死性免疫效应细胞相关噬血细胞综合征暂停 rap-cel 在狼疮、重症肌无力、多发性硬化等适应症的八项试验，百时美施贵宝暂停 zola-cel 自免研究入组。诺华随后于 2026 年 10 月以 5.75 亿美元首付款引进艾博生物的 mRNA 编码 CD19×CD3 TCE，说明买方正从自体细胞治疗转向剂量可控、可重复给药的现货型方案（推断）。"}],"children":[]},{"h":"4.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"该方向的壁垒不在靶点选择。CD19、BCMA、CD20 等靶点高度集中，同质化已经显现。可形成差异化的壁垒有三类。第一类是 CD3 端工程化能力，用于在保证 B 细胞清除深度的同时控制细胞因子释放；第二类是给药形式与表达方式，包括掩蔽型分子、皮下给药和 mRNA 体内表达；第三类是自免适应症的临床开发能力，包括患者选择、清淋策略和长期免疫球蛋白监测（推断）。"}],"children":[]},{"h":"4.3 头部企业概览","lvl":2,"blocks":[{"p":"表 4-1 自免 T 细胞衔接器与免疫重置头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["艾博生物","mRNA 编码 TCE，LNP 体内表达；ABO2203（CD19×CD3），淋巴瘤 I 期早期数据已在 AACR 2026 披露，拓展自免适应症","2021 年 B 轮 6 亿元、C 轮超 7 亿美元、C+ 轮 3 亿美元，C 轮投后估值报道接近 200 亿元","诺华首付款 5.75 亿美元，总额最高 78 亿美元，含 RNA 平台其他项目选择权，需完成监管审批等交割条件","平台授权与自研并行"],["德琪医药","AnTenGager 第二代 TCE 平台，2+1 二价结构、空间位阻遮蔽与自主快结合快解离 CD3 序列；ATG-201（CD19×CD3）自免，另有 ATG-106 等肿瘤 TCE 与 CLDN18.2 ADC","港股上市公司（6996.HK）","优时比首付款 6000 万美元加 2000 万美元近期里程碑，后续里程碑约 11 亿美元；K2 Therapeutics 获 ATG-106 授权，首付及近期对价约 2000 万美元、里程碑最高 9.605 亿美元；两项交易潜在总额超 30 亿美元","平台批量产出早期资产并对外授权"],["先声再明","TCE 多特异性抗体平台；SIM0660 为 CD79a×CD19×CD3 三特异性抗体，处于临床前，兼顾 B 细胞淋巴瘤与 B 细胞介导疾病","先声药业（2096.HK）子公司","罗氏首付款 7500 万美元，总额最高 15.3 亿美元；先声集团累计 6 项对外授权，潜在总额超 61 亿美元","集团研发平台产出资产，临床前即全球授权"]]},{"p":"资料来源为公司公告、Fierce Biotech、Pharmaceutical Executive、财联社、格隆汇、东吴证券研报与 36 氪，证据等级 B 至 C；团队信息中标注待核实的为未检索到一手出处的内容。"}],"children":[]},{"h":"4.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 4-2 自免 T 细胞衔接器与免疫重置头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["艾博生物","创始人兼 CEO 英博，美国东北大学生物工程博士，曾在 Moderna 旗下 Onkaido Therapeutics 及 Dicerna 从事 mRNA 与核酸药物开发","淡马锡、景顺发展市场基金、正心谷资本、高瓴创投、云锋基金、礼来亚洲基金、博裕投资领投 C 轮；软银愿景基金与五源资本领投 C+ 轮；人保资本、国投创业、云锋基金领投 B 轮；启明创投、君联资本、高榕资本等跟投","创始人具备核酸药物产业经验，平台从疫苗成功切换到治疗领域，体现技术迁移能力；需关注自免临床开发团队是否补齐（推断）"],["德琪医药","创始人梅建明，公开资料显示曾任跨国药企中国及亚太区管理职务（待核实）；研发团队围绕 AnTenGager 平台建设","港股上市公司，一级市场股东以招股书与公告为准","管理层擅长资产引进与对外授权，平台型 BD 节奏清晰；自主临床开发与商业化能力需结合财报验证（推断）"],["先声再明","依托先声药业集团研发与临床体系，子公司负责人信息未在公开报道中检索到（待核实）","先声药业全资或控股子公司，无独立外部机构信息","背靠成熟药企的临床与注册资源，适合作为可比与潜在合作方而非一级投资标的（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"4.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"艾博生物","lvl":3,"blocks":[{"p":"艾博生物的价值重估来自技术路线切换。公司在 2021 年依托新冠 mRNA 疫苗完成 C 轮超 7 亿美元和 C+ 轮 3 亿美元融资，C 轮由淡马锡、高瓴创投、礼来亚洲基金等领投，此后疫苗需求退潮；2026 年的诺华交易把同一套 mRNA 与 LNP 平台转用于体内表达 TCE，解决了蛋白 TCE 需要频繁给药的问题。"},{"p":"从投资角度看，交易首付款高但仍需完成监管审批等交割条件，且 2021 年接近 200 亿元的估值轮次形成较重的老股估值压力。若跟进投资，应核实交割进度、优先清算权条款、老股转让价格以及该技术是否触发出口前登记（推断）。"}],"children":[]},{"h":"德琪医药","lvl":3,"blocks":[{"p":"德琪医药的 AnTenGager 平台通过空间位阻遮蔽和自主 CD3 序列降低细胞因子释放风险，同一平台覆盖自免与实体瘤靶点。2026 年公司先后把 ATG-201 授权优时比、把 ATG-106 授权 MPM BioImpact 创立的 K2 Therapeutics，券商预计授权收入将推动公司 2026 年扭亏。"},{"p":"德琪的模式是上市公司以平台持续产出临床前或早期临床资产、早期即授权，首付款规模在数千万美元级别，低于艾博生物，说明买方对蛋白 TCE 已有较多选择，定价取决于分子结构差异（推断）。对一级市场而言，德琪是判断同类早期 TCE 平台估值的可比公司。"}],"children":[]},{"h":"先声再明","lvl":3,"blocks":[{"p":"SIM0660 以 CD79a 与 CD19 双靶点加深 B 细胞清除，同时限制细胞因子释放。罗氏以 7500 万美元首付款获取全球权益，说明大型药企愿意为临床前多特异性 TCE 支付较高首付款。"},{"p":"先声再明代表传统药企以内部研发平台批量对外授权的路径，对一级市场的意义在于两点。其一，它抬高了临床前三特异性 TCE 的交易价格锚；其二，传统药企是同类早期公司的潜在并购方或授权方（推断）。"}],"children":[]}]},{"h":"4.6 投资判断","lvl":2,"blocks":[{"p":"表 4-3 自免 T 细胞衔接器与免疫重置投资判断"},{"t":[["类别","内容"],["会投","CD3 端或给药端有明确结构创新、已有灵长类或首个人体数据显示细胞因子可控的 TCE 与 mRNA TCE 项目"],["不会投","仅更换靶点组合的 CD19×CD3 同质化项目；核心专利来自海外授权且无改进权的项目"],["什么条件下投","首个自免患者队列显示 B 细胞深度清除且无 3 级以上细胞因子释放综合征；交易结构符合出口登记要求；估值不高于同阶段已授权资产首付款的 2 至 3 倍"],["必须验证的指标","外周血与组织 B 细胞清除深度、免疫球蛋白水平、细胞因子释放综合征和噬血细胞综合征发生率、再给药后的抗药抗体"],["放弃条件","首个人体队列出现与 rap-cel 类似的噬血细胞综合征信号；跨国药企连续两个季度没有新增自免 TCE 交易"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第五章 诱导接近（分子胶与降解剂）","blocks":[{"p":"本赛道基准得分为 4.10，在十六个细分赛道中排第 2 位，定位为优先布局。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"5.1 行业分析","lvl":2,"blocks":[{"p":"诱导接近药物通过把靶蛋白与 E3 连接酶、伴侣蛋白或其他效应蛋白拉近，实现降解或功能阻断，从而覆盖传统小分子难以结合的靶点。2026 年该方向连续获得监管与临床验证，PROTAC 药物 vepdegestrant 获批用于 ESR1 突变乳腺癌，百时美施贵宝 CELMoD 药物 mezigdomide 的 III 期研究将疾病进展或死亡风险降低 52%，非降解型分子胶 daraxonrasib 于 2026 年 8 月获 FDA 批准用于特定转移性胰腺癌。"},{"p":"中国团队在该方向的价值兑现速度明显加快。2026 年 9 月 28 日，成立不到两年的思璞锐将临床前 KRAS G12D（ON）分子胶 SPR2015 授权默沙东，首付款 4 亿美元、总额最高 21.3 亿美元，据报道创下全球临床前资产授权首付款纪录，约为 2025 年中国对外授权平均首付款的 8 倍。"}],"children":[]},{"h":"5.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"经典 CRBN 与 IKZF1/3 方向已被跨国药企锁定，国内项目在该方向只能争取同类最佳。真正的增量来自三类能力。第一类是新 E3 连接酶与新底物的发现能力，例如 GSPT1、VAV1、WIZ、CK1α 等；第二类是非降解型分子胶的理性设计能力，以 RAS 与亲环素复合物为代表；第三类是向自免、血液病等非肿瘤适应症的延伸能力（推断）。"}],"children":[]},{"h":"5.3 头部企业概览","lvl":2,"blocks":[{"p":"表 5-1 诱导接近（分子胶与降解剂）头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["思璞锐","非降解型分子胶，RAS 突变选择性抑制；SPR2015（KRAS G12D ON），临床前，AACR 2026 摘要显示在 15 个以上结直肠癌模型中与另一款 G12D（ON）抑制剂头对头胜出","2025 年 6 月天使轮、2026 年 1 月 Pre-A 轮，江远投资参与两轮，金额未披露","默沙东首付款 4 亿美元，总额最高 21.3 亿美元，已完成交割","临床前资产全球授权"],["格博生物（GluBio）","分子胶降解剂，新底物方向；GLB-001（CK1α）为国内首款进入临床的 CK1α 分子胶，GLB-002（IKZF1/3）处于 I 期，GLB-005 与 GLB-007 靶向 WIZ 与 ZBTB7A 用于镰状细胞病","2022 年 A+ 轮 2200 万美元由启明创投领投、礼来亚洲基金和凯泰资本参与；2026 年 2 月获赛诺菲 3000 万美元战略股权投资，累计约 1.22 亿美元","赛诺菲获 GLB-005 与 GLB-007 独家授权的优先谈判权","自研加战略合作"],["超阳药业","口服 CRBN 分子胶；HP-001 临床前数据显示在 CRBN 结合力与 IKZF1 降解效率上优于现有药物（券商报告转述）","未经核实","未披露","自研"],["诺诚健华","CELMoD 类分子胶；ICP-490 处于早期临床，主营 BTK 抑制剂奥布替尼","港股及科创板上市公司（9969.HK、688428.SH）","公司层面与 Zenas 存在独家许可协议，2026 年第三季度确认里程碑收入，涉及资产以公告为准","商业化产品与早期管线并行"]]},{"p":"资料来源为第一财经、界面新闻、摩熵医药、CB Insights、flcube、EqualOcean、华源证券行业报告与公司公告，证据等级 B 至 C；超阳药业数据来自券商报告转述的企业资料，等级 D。"}],"children":[]},{"h":"5.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 5-2 诱导接近（分子胶与降解剂）头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["思璞锐","2024 年底由胡滔与药物化学专家张杨共同创立；两位创始人的详细履历未在公开报道中检索到（待核实）","江远投资（LongRiver）参与天使轮与 Pre-A 轮","以极小团队在两年内产出高价值分子，药物化学能力强；平台能否持续产出同类资产缺乏公开证据（推断）"],["格博生物（GluBio）","创始人兼 CEO 卢刚博士，公司由两位靶向蛋白降解领域人士创立，研发分布于美国圣地亚哥与杭州","启明创投（A+ 轮领投）、礼来亚洲基金、凯泰资本、赛诺菲（战略股权）","成立三年内两款分子进入临床，执行效率得到验证；第二位创始人背景与美国团队规模需核实（推断）"],["超阳药业","公开渠道未检索到可靠团队信息（待核实）","未检索到公开信息","信息不足，暂不评估"],["诺诚健华","联合创始人崔霁松、施一公（据公开资料）；首席财务官傅欣","上市公司，股东以公告为准","具备从研发到商业化的完整团队，分子胶为其管线延伸而非核心（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"5.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"思璞锐","lvl":3,"blocks":[{"p":"思璞锐的交易说明跨国药企愿意为结构新颖、头对头数据领先的临床前分子支付接近临床 II 期资产的首付款。公司目前未公开 SPR2015 的完整临床前数据，主要证据来自 AACR 摘要。"},{"p":"该交易价值高度依赖单一分子。若出现跟进融资机会，应重点核实三点，即团队过往分子是否进入过临床、SPR2015 之后的第二个分子进展、核心专利是否在中国境内主体名下，避免以单笔交易给平台定价（推断）。"}],"children":[]},{"h":"格博生物（GluBio）","lvl":3,"blocks":[{"p":"格博生物避开拥挤的肿瘤 CRBN 方向，进入镰状细胞病等胎儿血红蛋白再激活适应症。赛诺菲以股权投资换取优先谈判权，降低了公司现金压力，也为后续授权预设了买方。"},{"p":"关键验证点是 2026 年底 GLB-005 与 GLB-007 的 I 期启动，以及口服降解剂在血液病长期用药中的安全性。GLB-002 由北京大学肿瘤医院宋玉琴教授牵头 I 期，早期安全监查结果为企业自述（推断）。"}],"children":[]},{"h":"超阳药业","lvl":3,"blocks":[{"p":"超阳药业是国内 CRBN 与 IKZF1/3 方向的参与者之一，华源证券报告认为 HP-001 具备同类最佳潜力，但数据来源为企业资料转述，证据等级 D。在该方向被跨国药企锁定的格局下，只有临床数据证明同类最佳才有授权价值（推断）。"}],"children":[]},{"h":"诺诚健华","lvl":3,"blocks":[{"p":"诺诚健华 2026 年第三季度营业收入 9.62 亿元，同比增长 150.60%，归母净利润约 4.09 亿元，主要来自药品销售与 Zenas 许可协议的里程碑收入。ICP-490 是国内 CELMoD 方向进展较快的分子之一，可作为一级项目的上市可比（推断）。"}],"children":[]}]},{"h":"5.6 投资判断","lvl":2,"blocks":[{"p":"表 5-3 诱导接近（分子胶与降解剂）投资判断"},{"t":[["类别","内容"],["会投","具备新 E3 或新底物发现能力并已有体内数据的平台；非降解型分子胶的理性设计团队；进入自免或血液病等非肿瘤适应症的降解剂"],["不会投","CRBN 与 IKZF1/3 方向无同类最佳数据的跟随项目；仅有计算筛选、没有结构生物学和体内验证的项目"],["什么条件下投","核心化合物已有头对头体内数据；团队过往有至少一个分子进入临床；知识产权在中国境内主体名下"],["必须验证的指标","三元复合物结构证据、降解选择性组学数据、口服生物利用度、长期给药下的新底物脱靶"],["放弃条件","关键分子在首个人体研究出现剂量限制性毒性；同一底物出现三家以上国内跟随者"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第六章 小核酸（siRNA）","blocks":[{"p":"本赛道基准得分为 3.95，在十六个细分赛道中排第 3 位，定位为优先布局。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"6.1 行业分析","lvl":2,"blocks":[{"p":"小核酸药物通过沉默致病基因的 mRNA 发挥作用，GalNAc 偶联实现肝脏靶向后，半年一次甚至一年一次的给药使其可以进入高血脂、高血压、血栓等大慢病领域。2025 年全球已上市小核酸药物销售额约 71 亿美元，同比增长近 40%；国内临床管线 89 条，全球临床管线 327 条。"},{"p":"中国公司是 2025 年以来小核酸交易的主要供给方。舶望制药与诺华两次合作总额接近 94 亿美元，圣因生物与基因泰克的 INHBE 减重项目首付款 2 亿美元，瑞博生物与 Madrigal 的 MASH 合作首付款 6000 万美元、总额最高 44 亿美元，石药集团与阿斯利康就肾病 siRNA 达成最高超 17 亿美元合作。退出通道同步打开，瑞博生物于 2026 年 1 月 9 日在港股上市，募资约 18.3 亿港元；中国生物制药以 12 亿元收购赫吉亚生物。"},{"p":"该赛道面临新增的出口管制变量。禁止出口限制出口技术目录征求意见稿将小核酸药原创技术列入，但对具体药物品种所需技术、不转让所有权的平台授权和外包研发生产服务作出排除，单品种授权基本不受影响；平台所有权转让与部分 NewCo 交易需要逐案评估（推断）。"}],"children":[]},{"h":"6.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"肝脏递送已经成熟，竞争正从化学修饰转向肝外递送。脂肪、肌肉、中枢神经和肾脏等组织的递送能力决定了减重、神经和肾病等新适应症能否打开，是下一代小核酸公司估值差异的主要来源。第二个壁垒是长效与安全性数据的积累速度，第三个是寡核苷酸商业化生产能力（推断）。"}],"children":[]},{"h":"6.3 头部企业概览","lvl":2,"blocks":[{"p":"表 6-1 小核酸（siRNA）头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["瑞博生物","GalNAc 肝靶向 RiboGalSTAR 平台；七款自研资产进入临床，四款处于 II 期，核心产品 RBD4059（FXI），RBD5044（APOC3）获 II 期默示许可","2026 年 1 月港股上市（6938.HK），募资约 18.3 亿港元，首日市值约 136 亿港元；磐霖资本自 2015 年 A 轮起连投六轮","勃林格殷格翰超 20 亿美元合作；Madrigal 首付款 6000 万美元、总额最高 44 亿美元","自研加平台授权"],["舶望制药","RADS 长效 siRNA 平台，肝靶向与肝外递送；八个临床候选，BW-00163（高血压）II 期，BW-20829（Lp(a)）由诺华推进至 IIb 期，BW-20805（HAE）获 FDA 快速通道，BW-41012（FXI）2026 年 7 月 I 期首例给药","天使轮数千万元、A 轮超 4 亿元、A+ 轮 3 亿元，累计国内融资超 7 亿元，投资方含正心谷、国投招商、CPE 源峰","诺华 2024 年首付款 1.85 亿美元、2025 年首付款 1.6 亿美元，两次总额近 94 亿美元，诺华有意参与下一轮股权融资","海外权益授权、国内自研"],["圣因生物","LEAD 递送平台，覆盖肝脏、脂肪、肌肉和免疫细胞；4 款临床阶段候选药物，SGB-3383（CFB）获 II 期批准，SGB-7342（INHBE）减重 I 期","种子轮 1200 万美元（2021 年 1 月）、A 轮 4000 万美元（2021 年 12 月）、A+ 轮超 8000 万美元（2023 年 12 月）、B 轮超 1.1 亿美元（2025 年 12 月），投资方含中国生物制药、礼来亚洲基金、高瓴创投、启明创投等","礼来合作总额最高 12 亿美元；基因泰克项目首付款 2 亿美元、里程碑最高 15 亿美元；与信达生物合作开发 SGB-3908（高血压）","全球授权与自研并行"],["靖因药业","长效 GalNAc siRNA，心血管方向；SRSD107（FXI）欧洲 II 期，SRSD216（Lp(a)）中美 IIa 期，SRSD384（INHBE）推进 IND","由 OrbiMed 与 Creacion Ventures 联合创立；2025 年 4 月 B2 轮约 4750 万美元，投后估值 2.53 亿美元；2025 年 9 月递交港股招股书","CRISPR Therapeutics 现金 2500 万美元加股权 7000 万美元，SRSD107 成本与利润五五分成","共同开发与利润分成"]]},{"p":"资料来源为公司公告、招股书、PR Newswire、财联社、格隆汇、36 氪、Informa 会议资料与律所新闻稿，证据等级 B；管线数量等信息部分为企业自述。"}],"children":[]},{"h":"6.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 6-2 小核酸（siRNA）头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["瑞博生物","创始人梁子才、张鸿雁夫妇，南开大学毕业，耶鲁大学博士后，曾任教于瑞典卡罗林斯卡医学院，2007 年回国创办公司","磐霖资本（自 A 轮起连投六轮、C 轮领投）、国投创新（B 轮领投）、高瓴资本、中金资本（C+ 轮）","国内最早从事小核酸的科学家团队，经历完整技术周期；平台以肝靶向为主，肝外能力需进一步验证（推断）"],["舶望制药","联合创始人、董事长兼 CEO 舒东旭博士；公司 2021 年 4 月成立于上海","正心谷资本、国投招商、CPE 源峰；诺华表示有意参与下一轮","四年内八个分子进入临床，研发执行速度突出；核心团队完整履历需通过访谈核实（推断）"],["圣因生物","创始人兼 CEO 王为民博士，曾任 Dicerna 化学执行总监，是 GalXC 肝靶向技术的关键发明人，更早在 Sirna 与默沙东开发早期核酸 LNP 递送系统；联合创始人兼 CSO 王世宇曾任职 Dicerna 与 Ionis","中国生物制药、君联资本、Vivo Capital、Invus、SymBiosis、苏创投、礼来亚洲基金、高瓴创投、启明创投、险峰淇云、泰福资本、元禾控股、北极光创投及一家国际主权基金","核心团队来自全球头部 RNAi 公司，化学修饰与递送经验与公司技术方向高度匹配，是本赛道团队质量最高的公司之一（推断）"],["靖因药业","CEO 季群生博士；首席财务官陆海磊来自海思科；招股书显示员工 36 人","奥博资本（OrbiMed）与 Creacion Ventures 联合创立，汉康资本、BioTrack Capital 跟投，B2 轮由一家知名企业风投领投，媒体报道腾讯参股","由专业医疗基金孵化，团队精简，依赖外部 CRO 与合作方执行（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"6.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"瑞博生物","lvl":3,"blocks":[{"p":"瑞博生物是国内小核酸的上市锚点。2025 年上半年收入 1.04 亿元，主要来自授权，尚未形成产品销售，期内亏损 9776.5 万元。"},{"p":"对一级市场而言，瑞博的市值与管线数量是同类早期公司估值的参照，肝外递送能力应单独溢价（推断）。"}],"children":[]},{"h":"舶望制药","lvl":3,"blocks":[{"p":"舶望与诺华的两次合作形成连续背书，第二次合作引入期权、利润分成和股权投资意向，交易结构从一次性出售资产转向长期绑定。这种结构对出口管制更敏感，需关注平台技术条款是否涉及所有权转移（推断）。"},{"p":"BW-20829 进入 IIb 期触发里程碑付款，说明诺华的开发投入在持续。公司是国内少数同时拥有大适应症心血管资产和罕见病资产的小核酸公司（推断）。"}],"children":[]},{"h":"圣因生物","lvl":3,"blocks":[{"p":"圣因生物的首付款结构在本赛道最优。基因泰克项目首付款 2 亿美元约占里程碑总额 13%，明显高于行业约 5% 的平均水平，反映肝外递送平台和减重靶点的稀缺性（推断）。"},{"p":"公司总部在波士顿，研发分布于中美两地，需关注两点。其一，美国 COINS 拟议规则落地后美元股东的跟投与退出安排；其二，平台技术若由中国主体持有，对外授权是否需要出口前登记（推断）。"}],"children":[]},{"h":"靖因药业","lvl":3,"blocks":[{"p":"靖因的 CRISPR 交易首付现金仅 2500 万美元，主要对价是股权和五五分成，公司保留的经济利益更高但需自行承担一半开发成本。2025 年上半年账面扭亏主要来自所持 CRISPR 股份的公允价值收益，属于非经常性收益（推断）。"},{"p":"公司 B2 轮投后估值 2.53 亿美元，明显低于舶望和圣因的交易规模，可作为同类公司估值区间的下沿参考（推断）。"}],"children":[]}]},{"h":"6.6 投资判断","lvl":2,"blocks":[{"p":"表 6-3 小核酸（siRNA）投资判断"},{"t":[["类别","内容"],["会投","已有非人灵长类数据验证的肝外递送平台，尤其是脂肪、肌肉与中枢神经；可与 GLP-1 联用的减重靶点项目"],["不会投","仅在肝靶向 GalNAc 上做序列优化、靶点与已上市产品重叠的项目；依赖外部授权递送技术的项目"],["什么条件下投","出口管制目录最终文本明确后，交易结构可以按单品种授权落地；估值低于港股可比公司按管线折算后的水平"],["必须验证的指标","肝外组织沉默效率与持续时间、重复给药安全性、肾功能与血小板指标、公斤级寡核苷酸生产成本"],["放弃条件","最终目录将平台授权纳入许可管理且审批周期显著拉长；同靶点出现两款以上国际领先产品进入 III 期"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第七章 类器官与 NAMs 数据平台","blocks":[{"p":"本赛道基准得分为 3.70，在十六个细分赛道中排第 4 位，定位为优先布局。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"7.1 行业分析","lvl":2,"blocks":[{"p":"新方法学（NAMs）是指在不依赖传统动物实验的前提下获取药物安全性与有效性信息的方法，主要包括人源三维模型（类器官与器官芯片）、计算毒理学与 AI 预测、高通量体外筛选与组学整合。FDA 于 2025 年 4 月宣布逐步减少单抗等药物的动物实验要求，2026 年 3 月发布 NAMs 指南草案，明确企业可直接提交类器官和器官芯片数据用于非临床安全性评价；国家药监局药审中心于 2026 年 7 月 7 日就先锋计划征求意见。"},{"p":"资本快速回到该方向。截至 2026 年 8 月，国内类器官和器官芯片领域披露融资超 6 起、累计超 11 亿元，多家公司同时给自己加上 AI 虚拟细胞标签。需要警惕的是，部分企业的融资新闻稿由创业者结合大模型生成后自主发布，信息可信度较低（推断）。"}],"children":[]},{"h":"7.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"该方向的壁垒不是模型构建技术本身，而是三点。第一是自产、标准化、可追溯的人源实验数据及其归属；第二是被药企用于监管申报或内部决策的验证记录，例如进入 FDA ISTAND 等资格认定项目；第三是从检测服务到数据授权或自研管线的收入结构升级能力。离开 AI 叙事仍能以检测服务产生收入的公司，下行保护更好（推断）。"}],"children":[]},{"h":"7.3 头部企业概览","lvl":2,"blocks":[{"p":"表 7-1 类器官与 NAMs 数据平台头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["耀速科技","器官芯片加高内涵三维成像加 AI，EPIC 平台；参与 FDA 肝器官芯片 ISTAND 意向书，入选 FDA 药物性肝损预测标准制定工作组","天使轮千万级美元（2022 年 8 月）、天使+轮亿级人民币（2024 年 7 月）、Pre-A 轮数千万元（2025 年 4 月）、A 轮超 2 亿元（2026 年 4 月，国寿股权领投）、A+ 轮近 2 亿元（2026 年 6 月），晶泰科技为老股东","与药企开展药效与毒性评价合作，未披露单笔合同金额","检测服务加数据平台"],["希格生科","类器官加 AI 靶向药研发；SIGX1094（FAK/SRC 双靶点）获中美 IND、FDA 孤儿药与快速通道认定，I 期由北京大学肿瘤医院沈琳教授牵头，联用氟泽雷塞的 II/III 期申请已获受理；SIGX2649（泛 TEAD）推进 IND","2026 年 1 月 A 轮 8000 万元，投资方为晶泰科技、松禾资本、智生协同、天图雅亿资本、蓝海资本；累计近 3 亿元融资及项目资助","与晶泰科技联合研发，晶泰有权获得 SIGX2649 商业化收益最高两位数比例分成","自研管线加平台赋能服务"],["万何圆生物","智能微生理类器官系统（iMOS），覆盖 30 余个癌种，宣称药敏检测临床预测准确性超过 80%、培养成功率 95% 以上","2026 年 1 月 A 轮数千万元","未披露","精准医疗检测与新药研发服务并行"]]},{"p":"资料来源为投中网、新华社、美通社、新浪财经、华尔街见闻、医麦客与公司官网，证据等级 B 至 D；营收增长与预测准确性等为企业自述，未经第三方验证。"}],"children":[]},{"h":"7.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 7-2 类器官与 NAMs 数据平台头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["耀速科技","联合创始人兼 CEO 谢鑫，上海交通大学本科，波士顿大学与美国东北大学获微机电与生物医学工程学位，MIT 与哈佛大学器官芯片方向博士后；曾任 TransMedics 生物医学工程与系统工程负责人，主导两项获 FDA 三类器械许可的离体器官保存系统","国寿股权（A 轮独家领投）、晶泰科技、雅亿资本、君联资本、国方创投、清松资本、广发信德、东方富海、沄柏资本","创始人兼具器官芯片科研与 FDA 三类器械产业化经验，在本赛道中工程化能力最突出（推断）"],["希格生科","创始人兼 CEO 张海生博士；创始团队来自哈佛大学、MIT 与中国科学院，以第一或通讯作者在 Nature、Nature Medicine、Cancer Cell 等期刊发表胃癌、食管癌研究 20 余篇","晶泰科技、松禾资本、智生协同、天图雅亿资本、蓝海资本","科学团队在胃癌生物学上积累深厚，靶点发现能力有论文支撑；药物开发与 BD 依赖晶泰合作（推断）"],["万何圆生物","公开渠道未检索到可靠团队信息（待核实）","未检索到公开信息","信息不足，暂不评估"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"7.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"耀速科技","lvl":3,"blocks":[{"p":"耀速科技最接近本报告认可的数据平台形态。公司收入来自器官芯片药效与毒性检测，可以按服务业务估算基础价值，同时持续积累高通量三维人源数据。公司称 2025 年整体营收实现数量级增长，属企业自述。"},{"p":"需要核实的是数据归属条款。若客户项目数据归客户所有，平台可用于训练模型的自有数据规模将远低于对外宣传；同时美国拟议规则将实验自动化与云实验室纳入限制，可能影响其海外客户与美元投资人结构（推断）。"}],"children":[]},{"h":"希格生科","lvl":3,"blocks":[{"p":"希格生科的价值在于用类器官疾病模型发现新靶点，再由晶泰完成分子设计，是数据平台与 AI 结合的样本。SIGX1094 是全球首个经类器官加 AI 平台推进至临床的管线（企业自述）。"},{"p":"公司本质上是一家早期管线公司，估值应按临床资产计价而非平台；与晶泰的分成安排会稀释公司对后续管线的经济利益，需在尽调中核实分成范围（推断）。"}],"children":[]},{"h":"万何圆生物","lvl":3,"blocks":[{"p":"万何圆同时做面向患者的药敏检测与面向药企的研发服务。面向患者的检测需要医疗器械或实验室自建项目合规路径，预测准确性数据为企业自述，需核实样本量与对照设计（推断）。"}],"children":[]}]},{"h":"7.6 投资判断","lvl":2,"blocks":[{"p":"表 7-3 类器官与 NAMs 数据平台投资判断"},{"t":[["类别","内容"],["会投","自产标准化人源数据、已有付费药企客户和明确数据归属条款的类器官与器官芯片平台"],["不会投","只有模型没有自产数据的纯算法公司；数据依赖公开数据库的虚拟细胞项目；融资信息主要依赖自发新闻稿的项目"],["什么条件下投","按检测服务收入估算的基础价值不低于投后估值的三分之一；至少一个 NAMs 数据包被药企用于监管申报或内部决策"],["必须验证的指标","自有数据量与年新增量、项目数据归属、纯预测收入占比、模型预测与湿实验验证的命中率、客户复购率"],["放弃条件","先锋计划与 FDA 规则落地后两年内国内没有 NAMs 数据支持的申报案例；美国对实验自动化与云实验室投资限制落地并影响海外客户"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第八章 医用同位素与核药","blocks":[{"p":"本赛道基准得分为 3.60，在十六个细分赛道中排第 5 位，定位为优先布局。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"8.1 行业分析","lvl":2,"blocks":[{"p":"放射性药物通过同位素与靶向分子偶联实现诊断与治疗一体化。诺华 Pluvicto 2024 年收入约 14 亿美元，Lutathera 约 7.24 亿美元，验证了治疗性核药的商业价值。国内核药市场规模预测分歧较大，有机构预测由 2025 年的 127 亿元增长至 2030 年的 300 亿元，也有机构给出 2030 年 260 亿元的预测。"},{"p":"上游同位素是产业链的约束点。镥-177 长期依赖进口，诺华曾因工厂质量问题和产能不足两次出现供应中断；国内反应堆已实现镥-177 稳定量产。海外巨头同步加码上游，Curium 收购 Lantheus、Telix 收购 ITM，阿斯利康在广州建设锕-225 核药生产基地。"},{"p":"资本与政策同时进入。纽瑞特医疗 2026 年 4 月完成 10 亿元 E 轮，创国内核药单轮融资纪录；先通医药 2026 年 10 月 28 日通过港交所聆讯；2025 版鼓励外商投资产业目录新增核药开发与生产；广东等地提出将符合条件的放射性诊疗费用纳入医保支付。"}],"children":[]},{"h":"8.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"核药壁垒来自供应链而非分子本身。同位素生产资质和产能、放射性药品生产许可与区域配送网络、医院核医学科准入是三个主要壁垒。PET 设备每百万人口约 0.6 台的配置水平也限制了诊断与治疗的放量速度（推断）。"}],"children":[]},{"h":"8.3 头部企业概览","lvl":2,"blocks":[{"p":"表 8-1 医用同位素与核药头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["先通医药","核素原料、研发、生产与销售全链条；欧韦宁（Aβ-PET 显像剂，2023 年 9 月获批）与欧达乐已上市，XTR008（镥-177 SSTR）完成 III 期并提交上市申请，15 条管线","累计 9 轮约 29 亿元，投后估值 51.88 亿元；2023 年 7 月超 11 亿元融资由国投创业、金石投资、国调基金等参与；股东含茅台金石、国调基金二期、北京市医药健康产业投资基金","招股书显示收入主要来自对外授权","产品销售加授权"],["纽瑞特医疗","同位素生产与放射性药物；NRT6003（钇-90 微球，肝癌）III 期，锗-68 与镓-68 发生器已上市并出口；回旋加速器全面投运后预计年产值超 10 亿元（企业自述）","2026 年 4 月 E 轮 10 亿元，上海科创集团、上海国鑫、南京高科新浚领投；2025 年 10 月一轮由人保资本、深创投、中核基金、阿斯利康中金医疗产业基金等参与；累计超 24 亿元；2026 年 1 月启动 A 股上市辅导","未披露","同位素与核药产品销售"],["法伯新天","镥-177 国产化，与中国科学院大连化学物理研究所共建万居里级镥-177 生产线","顺为资本参与投资，金额未披露","未披露","同位素供应"],["依纳核","以电子直线加速器生产医用同位素，切入核药上游","2025 年 1 月成立于苏州太仓，正在推进新一轮融资","未披露","同位素供应"]]},{"p":"资料来源为港交所聆讯后资料集报道、澎湃新闻、界面新闻、财联社、投资界、新华网、36 氪与动脉网，证据等级 B 至 C；依纳核与法伯新天信息为企业自述，未经第三方验证。"}],"children":[]},{"h":"8.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 8-2 医用同位素与核药头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["先通医药","创始人、董事长兼总经理徐新盛，直接持股 11.32%，约 30 年医药行业经验，曾任职海南三叶制药厂、从事医药销售，2005 年至 2010 年任海南先通药业总经理；联席总裁唐艳旻","厚朴投资、君联资本（早期）；国投创业、金石投资、国调基金、通用技术创投、中信证券投资、国寿股权、荷塘创投；茅台金石、国药资本、国调基金二期、北京市医药健康产业投资基金","创始人以商业化与资源整合见长，公司从仿制药起家转型核药；研发与放射化学核心人员需在尽调中核实（推断）"],["纽瑞特医疗","由钱积惠（原中国核动力研究设计院院长、国际原子能机构副总干事）、李茂良（原成都同位素应用研究所所长）、蔡继鸣（原四川省原子能研究院副院长）联合创立，首席财务官邓颖","上海科创集团、上海国鑫、南京高科新浚（E 轮领投）；人保资本、深创投、中核基金、阿斯利康中金医疗产业基金、国开金融、石药国方、基石资本、倚锋资本等","核工业背景深厚，同位素生产资质与渠道能力强；创始人年龄较大，管理层传承是需要关注的治理问题（推断）"],["法伯新天","公开渠道未检索到可靠团队信息（待核实）","顺为资本","信息不足，暂不评估"],["依纳核","公开渠道未检索到可靠团队信息（待核实）","未检索到公开信息","信息不足，暂不评估"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"8.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"先通医药","lvl":3,"blocks":[{"p":"先通医药是国内核药上市样本，2025 年收入 9921 万元、净亏损 6.18 亿元，2026 年上半年收入 6125.4 万元、净亏损 5.34 亿元，收入规模与估值之间的差距说明市场为管线与产业链位置付费。"},{"p":"其上市后的估值将成为一级市场核药项目的重要锚点。国资股东密集说明核药具有较强的产业政策属性，对鲁信这类国资机构的项目来源与退出均有参考意义（推断）。"}],"children":[]},{"h":"纽瑞特医疗","lvl":3,"blocks":[{"p":"纽瑞特兼具同位素生产与核药产品，同位素能力使其可以同时服务自有管线和第三方核药企业，下行保护优于纯管线公司（推断）。"},{"p":"公司已启动 A 股上市辅导，后续估值空间取决于 NRT6003 的 III 期结果和同位素外供规模（推断）。"}],"children":[]},{"h":"法伯新天","lvl":3,"blocks":[{"p":"法伯新天的价值取决于与大连化物所合作的产能落地进度和产品纯度，原料单价下降等信息来自媒体报道，需核实（推断）。"}],"children":[]},{"h":"依纳核","lvl":3,"blocks":[{"p":"加速器路线可以摆脱反应堆依赖，但产额、比活度与成本是否具备竞争力需要实测数据支撑；公司处于建设早期，属于高风险高弹性的早期标的（推断）。"}],"children":[]}]},{"h":"8.6 投资判断","lvl":2,"blocks":[{"p":"表 8-3 医用同位素与核药投资判断"},{"t":[["类别","内容"],["会投","已取得或明确可取得同位素生产资质、产能可对外供应的上游企业；α 核素制备技术；有差异化靶点且锁定同位素供应的核药管线"],["不会投","依赖单一进口同位素来源的跟随型 RDC；靶点与 PSMA、SSTR 已上市产品高度重叠且无剂量学优势的项目"],["什么条件下投","同位素产能、纯度与批次稳定性有第三方检测；与核医学中心有临床合作；地方政府提供核设施配套"],["必须验证的指标","同位素年产能与产能利用率、放射化学纯度、运输半径内的医院覆盖数、核药生产许可进度"],["放弃条件","跨国药企在华同位素产能投产后价格大幅下行；核医学科室扩容与设备配置不及预期"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第九章 体内 CAR-T 与细胞治疗","blocks":[{"p":"本赛道基准得分为 3.60，在十六个细分赛道中排第 6 位，定位为期权跟踪。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"9.1 行业分析","lvl":2,"blocks":[{"p":"体内 CAR-T 通过 LNP 或病毒载体把 CAR 基因直接递送到患者体内 T 细胞，省去体外采集、制备和清淋。跨国药企在 2025 年至 2026 年密集收购，艾伯维以 21 亿美元收购 Capstan，阿斯利康以 10 亿美元收购 EsoBiotech，百时美施贵宝以 15 亿美元收购 Orbital，吉利德以 3.5 亿美元收购 Interius，礼来于 2026 年 4 月以最高 70 亿美元收购 Kelonia。"},{"p":"该赛道在 2026 年同时遇到两个负面变量。其一是 2026 年 8 月诺华自免 CAR-T 安全事件，影响整个 CD19 清除路线的风险偏好；其二是细胞和基因治疗原创技术被列入出口管制征求意见稿，平台所有权转让受到约束。因此本报告将其列为期权跟踪方向，首个自免人体数据积极时上调（推断）。"}],"children":[]},{"h":"9.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"核心难点是 T 细胞特异性递送与表达持续时间控制。LNP 加 mRNA 路线不整合基因组、可重复给药、剂量可调，更适合自免；病毒载体路线持久性更强但监管要求更高。递送靶向与偶联工艺是本赛道的主要壁垒（推断）。"}],"children":[]},{"h":"9.3 头部企业概览","lvl":2,"blocks":[{"p":"表 9-1 体内 CAR-T 与细胞治疗头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["微滔生物（Vivacta）","抗体展示 LNP（CLAMP 技术）递送 CD19 CAR mRNA；GT801 在 ASH 2025 公布首次人体数据，AACR 2026 显示在血液瘤与自免患者中实现深度 B 细胞清除并验证重复给药","2026 年 4 月 A 轮与 A+ 轮合计超 5000 万美元","未披露","自研管线"],["虹信生物","工程化细胞靶向 LNP 递送平台（EnC-LNP），多款体内 CAR-T 管线推进临床","2026 年 8 月完成数亿元 B 轮，为公司第六轮融资","未披露","自研管线"],["威斯津生物（WestGene）","靶向 LNP 与 mRNA 平台；与 Cartesian 合作的 BCMA mRNA CAR-T 拟于 2026 年下半年在重症肌无力开展 I 期，2026 年 8 月与 CREATE Medicines 达成研发合作与许可","公开融资信息有限","Cartesian 授权（首付款未披露）；CREATE Medicines 合作","递送平台对外合作"],["湾岛细胞","新一代细胞治疗平台，目标降低 CAR-T 成本","1000 万美元天使轮；2026 年 7 月 A 轮 1.4 亿元","未披露","自研管线"]]},{"p":"资料来源为投资界、36 氪、格隆汇、摩熵医药、PR Newswire 与 Oncology Pipeline，证据等级 B 至 C。"}],"children":[]},{"h":"9.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 9-2 体内 CAR-T 与细胞治疗头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["微滔生物（Vivacta）","由沙砾生物分拆成立，GT801 数据由沙砾生物首席科学官王品教授在 ASH 2025 报告；A+ 轮后正心谷资本谢荣刚与德诚资本合伙人进入董事会","正心谷资本、德诚资本（分别领投）、奥博资本（OrbiMed）、汉康资本、卫材创新风投、建发新兴投资、启明创投、顺禧基金、杏泽资本","科学来源清晰，头部美元与人民币基金同时进入；分拆公司与母公司的知识产权与人员边界需核实（推断）"],["虹信生物","创始人查高峰，武汉理工大学本硕博，博士期间接受诺贝尔化学奖得主 K.B. Sharpless 指导，卡罗林斯卡医学院基因递送方向博士后，具有六年中试生产经验","中金资本旗下基金领投、康君资本联合领投；国开科创、中银资产、苏高新金控、国舜投资跟投；老股东经纬创投、IDG 资本、南岭资本、华泰金斯瑞、中国生物制药中生引领基金、海愿资本","创始人兼具化学合成、递送与中试生产经验，与 LNP 平台型公司需求匹配（推断）"],["威斯津生物（WestGene）","2021 年 7 月由中国科学院院士魏于全与 mRNA 研究人员宋相容联合创建，总部位于成都天府国际生物城","未检索到公开信息","学术背景强，平台以对外合作变现，商业化管理团队需核实（推断）"],["湾岛细胞","创始人范晓虎，传奇生物创始人与首席科学家，主导西达基奥仑赛研发；金斯瑞对其提起的商业秘密诉讼于 2025 年底被最高人民法院终审驳回","松禾资本（A 轮领投）、东方富海","创始人具备全球上市 CAR-T 的完整研发经验，诉讼风险已解除（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"9.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"微滔生物（Vivacta）","lvl":3,"blocks":[{"p":"GT801 是国内少数已发表自免人体数据的 LNP 路线体内 CAR-T，重复给药可行性是相对自体 CAR-T 的主要卖点。首批数据样本量小，深度清除能否转化为持续缓解仍需更长随访（推断）。"},{"p":"奥博资本与卫材创新风投的进入说明海外专业基金与产业方认可该平台，后续存在美国拟议规则对美元股东的影响（推断）。"}],"children":[]},{"h":"虹信生物","lvl":3,"blocks":[{"p":"虹信生物在 B 轮引入中金资本、国开科创等国有背景机构，以及中国生物制药的产业基金，股东结构以人民币为主，受美国对外投资规则影响较小（推断）。"},{"p":"公司尚未公开系统的人体数据，估值应以平台期权计价，首个自免队列数据是关键节点（推断）。"}],"children":[]},{"h":"威斯津生物（WestGene）","lvl":3,"blocks":[{"p":"威斯津以靶向 LNP 平台向海外公司输出递送能力，是平台授权型商业模式。若平台以所有权转让或独家许可方式出海，需重点评估出口管制条目的适用性（推断）。"}],"children":[]},{"h":"湾岛细胞","lvl":3,"blocks":[{"p":"湾岛细胞的看点在于创始人经验，技术路线与管线信息公开较少。投资需核实知识产权来源与传奇生物体系的边界（推断）。"}],"children":[]}]},{"h":"9.6 投资判断","lvl":2,"blocks":[{"p":"表 9-3 体内 CAR-T 与细胞治疗投资判断"},{"t":[["类别","内容"],["会投","已有人体数据证明 T 细胞特异性递送与可重复给药的 LNP 平台；具备自有中试生产能力的团队"],["不会投","依赖自体工艺进入自免的项目；递送靶向数据仅来自小鼠的项目"],["什么条件下投","首个自免队列无严重免疫毒性；技术交易结构符合出口管制要求"],["必须验证的指标","CAR 表达持续时间、B 细胞清除深度与恢复动力学、脱靶表达、重复给药抗体反应"],["放弃条件","体内路线出现与自体 CAR-T 类似的致死性免疫毒性；出口管制最终文本限制平台许可"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第十章 ADC 与偶联药物","blocks":[{"p":"本赛道基准得分为 3.50，在十六个细分赛道中排第 7 位，定位为精选参与。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"10.1 行业分析","lvl":2,"blocks":[{"p":"ADC 是中国对外授权中最确定的优势领域之一。中国约占全球 ADC 授权活动九成，2025 年中国 ADC 对外授权首付款合计约 16.3 亿美元。全球抗体类药物临床试验中，ADC 占比由 2020 年的 5.9% 升至 2025 年的 23.6%；同期中国 ADC 启动临床试验数量由 35 项增至 256 项，超过 100 家中国药企与研发机构参与。"},{"p":"技术迭代正在向双抗 ADC、双载荷 ADC 和定点偶联推进。中国来源的双抗 ADC 在研管线累计 51 项，远超美国的 13 项；百利天恒的 EGFR/HER3 双抗 ADC iza-bren 于 2026 年 6 月 22 日在国内获批上市，成为首款获批的双抗 ADC。宜联生物 B7-H3 ADC YL201 于 2026 年 5 月在鼻咽癌 III 期中期分析中达到主要终点，是全球首个 III 期阳性的 B7-H3 ADC。"}],"children":[]},{"h":"10.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"热门靶点已高度拥挤，壁垒转向三类能力。第一是新型载荷与连接子平台；第二是双抗 ADC 的结构设计与成药性；第三是全球多中心 III 期执行能力。知识产权边界也在成为风险点，宜联生物与科伦博泰的纠纷说明团队来源需要专门核查（推断）。"}],"children":[]},{"h":"10.3 头部企业概览","lvl":2,"blocks":[{"p":"表 10-1 ADC 与偶联药物头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["百利天恒","双抗 ADC 平台；iza-bren（EGFR/HER3）2026 年 6 月国内获批，多项 III 期取得阳性结果","上市公司（688506.SH）","百时美施贵宝首付款 8 亿美元，总额最高 84 亿美元；2026 年第三季度触发第二笔 2.5 亿美元里程碑","自研、授权与商业化"],["科伦博泰","ADC 平台；sac-TMT（TROP2）等多款 ADC","港股上市公司，科伦药业控股","先后向默沙东授权多达 9 款 ADC，首付款合计 2.57 亿美元，潜在里程碑合计超 115 亿美元","自研、授权与商业化"],["映恩生物","DITAC 下一代 ADC 平台，DB-1303、DB-1305 等多款资产","2025 年 4 月港股上市，募资 16.40 亿港元，基石投资 6500 万美元；B+ 轮 3000 万美元（2022 年 9 月）","与 BioNTech、百济神州、Adcendo 等合作，协议总值超 40 亿美元","平台授权为主"],["宜联生物","TMALIN 等 ADC 平台；YL201（B7-H3）鼻咽癌 III 期中期分析阳性，YL202（HER3）与 YL211 已对外授权","成立以来累计募资至少 8.5 亿元，正在筹备上市","BioNTech（YL202 等）与罗氏（YL211）合作，YL202、YL211 里程碑款项均达 10 亿美元；近十项对外授权或研发合作","自研与授权并行"]]},{"p":"资料来源为医线 Insight、券商研报、财联社、东方财富、瑞财经、36 氪与公司公告，证据等级 B 至 C。"}],"children":[]},{"h":"10.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 10-2 ADC 与偶联药物头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["百利天恒","创始人朱义（据公开资料），公司由化学药企业转型创新药（待核实）","上市公司，股东以公告为准","完成从仿制药到全球首创双抗 ADC 的转型，临床开发能力已被 III 期验证（推断）"],["科伦博泰","科伦药业体系内团队，管理层以公告为准","上市公司，股东以公告为准","具备从发现到商业化的完整体系；核心早期团队曾流出创办宜联生物（推断）"],["映恩生物","创始人、董事长兼 CEO 朱忠远，麻省大学医学院博士、加州伯克利 MBA，曾任 6 Dimensions Capital 合伙人与药明康德医疗健康风险投资合伙人，参与孵化基石药业、荣昌生物等；首席科学官邱杨","基石投资者包括礼来亚洲基金、BioNTech、清池资本、富国基金、易方达、汇添富等","创始人投资人出身，擅长资本与 BD 运作；上市前持股仅 9.54%，控制权较分散（推断）"],["宜联生物","创始人、董事长兼 CEO 薛彤彤，曾任科伦药物研究院副院长、2016 年至 2020 年任科伦博泰总经理；联合创始人蔡家强曾任科伦药物研究院副院长，肖亮曾任科伦博泰副总裁","媒体称投资方阵容较强，具体名单未逐一核实","核心团队是科伦博泰 ADC 研发的原班人马，执行力已被 III 期结果验证；与原雇主的知识产权纠纷已通过收入分成和解，需核实分成条款对估值的影响（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"10.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"百利天恒","lvl":3,"blocks":[{"p":"iza-bren 是中国 ADC 价值兑现的标杆。至 2025 年末，84 亿美元交易累计在财报中确认约 16 亿美元，说明大额授权需要多年才能兑现。2026 年前三季度公司仍亏损 7.05 亿元（推断）。"}],"children":[]},{"h":"科伦博泰","lvl":3,"blocks":[{"p":"科伦博泰与宜联生物于 2025 年 12 月和解，宜联就 6 款核心 ADC 向科伦博泰分享授权收入和未来销售净利润。这一安排使科伦博泰获得无研发投入的分成收入（推断）。"}],"children":[]},{"h":"映恩生物","lvl":3,"blocks":[{"p":"映恩生物以平台批量授权的方式快速兑现价值，是投资人型创始人主导的典型样本。其大量资产授权给 BioNTech，后续价值取决于合作方的开发进度（推断）。"}],"children":[]},{"h":"宜联生物","lvl":3,"blocks":[{"p":"宜联生物在成立五年内完成近十项授权并取得全球首个 B7-H3 ADC III 期阳性，研发效率突出。2024 年起科伦博泰对公司及三位创始人提起刑事控告和民事诉讼，2025 年 12 月以收入分成方式和解。"},{"p":"和解消除了核心资产的法律风险，但 6 款核心 ADC 的未来收入需与科伦博泰分享，投资估值需扣除这部分经济利益。这一案例说明，团队来自同赛道大型药企时，必须在尽调中核查竞业与保密协议（推断）。"}],"children":[]}]},{"h":"10.6 投资判断","lvl":2,"blocks":[{"p":"表 10-3 ADC 与偶联药物投资判断"},{"t":[["类别","内容"],["会投","新型载荷、双载荷或非肿瘤适应症的偶联药物；有全球 III 期执行经验的团队"],["不会投","TROP2、HER2、Claudin18.2 等热门靶点的跟随项目；团队来自同赛道大型药企但未核查竞业与保密协议的项目"],["什么条件下投","分子在头对头或标准治疗对照中有明确优势；知识产权来源清晰"],["必须验证的指标","治疗窗、间质性肺病等关键毒性、药物抗体比均一性、耐药后疗效"],["放弃条件","新一代 ADC 在关键 III 期出现安全性问题；跨国药企 ADC 交易显著降温"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第十一章 基因编辑","blocks":[{"p":"本赛道基准得分为 3.40，在十六个细分赛道中排第 8 位，定位为期权跟踪。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"11.1 行业分析","lvl":2,"blocks":[{"p":"基因编辑已有获批产品，但体内编辑仍处于早期临床。2026 年起资本重新回到底层技术平台，尧唐生物于 2026 年 5 月完成近 5 亿元 C 轮融资，是该方向的代表事件。2026 年《生物医学新技术临床研究和转化应用管理条例》施行，为体内编辑的临床研究提供规则框架。"},{"p":"出口管制是该赛道最大的外部约束。2023 年版禁止出口技术目录已包含用于人的细胞克隆和基因编辑技术，2026 年征求意见稿又新增细胞和基因治疗原创技术，平台出海以单品种授权为主要可行路径（推断）。"}],"children":[]},{"h":"11.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"壁垒在于自主知识产权的编辑工具、可靶向特定器官的非病毒递送系统，以及长期安全性随访数据。国内企业与海外平台的专利交叉风险需要律师意见支持（推断）。"}],"children":[]},{"h":"11.3 头部企业概览","lvl":2,"blocks":[{"p":"表 11-1 基因编辑头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["尧唐生物","mRNA-LNP 递送的体内基因编辑，自有编辑器与 LNP；6 条管线进入临床，YOLT-203（原发性高草酸尿症）获 FDA 再生医学先进疗法认定","2025 年 9 月 B 轮逾 3 亿元；2026 年 5 月 C 轮近 5 亿元","YOLT-101 中国权益以 10.35 亿元授权信立泰","自研加区域授权"],["锐正基因","LNP 等非病毒载体的体内基因编辑；ART001（转甲状腺素蛋白淀粉样变性）获中美 IND，FDA 孤儿药与再生医学先进疗法认定；ART002（杂合子家族性高胆固醇血症）进入临床","A 轮 7500 万美元","未披露","自研"]]},{"p":"资料来源为瑞财经、医曜、36 氪、摩熵医药与中伦律师事务所新闻稿，证据等级 B 至 C。"}],"children":[]},{"h":"11.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 11-2 基因编辑头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["尧唐生物","创始人兼董事长吴宇轩，武汉大学生命科学学院学士（2006 年）与博士（2012 年），哈佛大学博士后","正心谷资本（C 轮领投）、上海国投先导、闵金投、德岳投资；老股东险峰淇云、远翼投资、天创资本；阿斯利康中金医疗产业基金（B 轮领投）、松禾资本","创始人学术背景扎实，团队已把多条管线推进临床，执行力较强；企业自述的过往研究贡献需核实（推断）"],["锐正基因","公开渠道未检索到可靠团队信息（待核实）","西藏药业（领投 6000 万美元）、康哲药业（1500 万美元）","股东以产业资本为主，商业化路径可能依托股东渠道（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"11.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"尧唐生物","lvl":3,"blocks":[{"p":"尧唐以区域授权方式与信立泰合作，既获得资金也保留海外权益，是出口管制背景下较稳妥的结构（推断）。"},{"p":"体内编辑一次给药的价值高，但长期安全性数据需要多年积累，估值需要为较长的临床周期留出折扣（推断）。"}],"children":[]},{"h":"锐正基因","lvl":3,"blocks":[{"p":"锐正基因采用 VIE 架构，在上海临港设立新主体承接业务。产业资本领投说明股东看重其后续商业化合作价值，VIE 结构在当前出口管制和对外投资规则下需重点评估（推断）。"}],"children":[]}]},{"h":"11.6 投资判断","lvl":2,"blocks":[{"p":"表 11-3 基因编辑投资判断"},{"t":[["类别","内容"],["会投","自有编辑工具与非病毒递送并已有人体数据的平台；采用区域授权保留全球权益的结构"],["不会投","依赖海外专利授权的编辑工具；VIE 或境外持有核心专利且未评估出口规则的项目"],["什么条件下投","第三方律师出具的自由实施意见；首批患者长期安全性随访可得"],["必须验证的指标","编辑效率与持久性、脱靶检测方法、LNP 器官分布、长期随访不良事件"],["放弃条件","体内编辑出现严重长期安全事件；出口管制最终文本覆盖单品种授权"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第十二章 双抗与多抗（肿瘤）","blocks":[{"p":"本赛道基准得分为 3.40，在十六个细分赛道中排第 9 位，定位为精选参与。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"12.1 行业分析","lvl":2,"blocks":[{"p":"中国约占全球 III 期及注册阶段双抗管线的七成。康方生物的 PD-1/VEGF 双抗依沃西是该方向的标杆，2026 年 8 月获批一线鳞状非小细胞肺癌，为其在国内的第三项适应症；HARMONi-2 研究中依沃西对比帕博利珠单抗的中位总生存期为 30.8 个月对 22.6 个月；海外合作方 Summit 披露 HARMONi 研究西方患者总生存期风险比为 0.76，FDA 目标审评日期为 2026 年 11 月 14 日。"},{"p":"同类资产已被跨国药企高价锁定，三生制药与辉瑞的 PD-1/VEGF 双抗交易总额 60.5 亿美元、首付款 12.5 亿美元已全额到账。2026 年阿斯利康 PD-1/CTLA-4 双抗临床失败，引发市场对双抗方向的分歧（推断）。"}],"children":[]},{"h":"12.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"后来者的空间在于全新机制的多特异性分子与联合用药方案，而不是同靶点组合。全球多中心头对头试验能力是区分头部与跟随者的关键（推断）。"}],"children":[]},{"h":"12.3 头部企业概览","lvl":2,"blocks":[{"p":"表 12-1 双抗与多抗（肿瘤）头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["康方生物","双抗平台；依沃西（PD-1/VEGF）与卡度尼利（PD-1/CTLA-4）已上市，另有银屑病等自免产品","港股上市公司（9926.HK）","依沃西海外权益授予 Summit Therapeutics，并持有其股权","自研、商业化与海外授权"],["三生制药","SSGJ-707（PD-1/VEGF 双抗）","港股上市公司","辉瑞交易总额 60.5 亿美元，首付款 12.5 亿美元已全额到账","自研、商业化与授权"]]},{"p":"资料来源为中信建投研报、界面新闻、每日经济新闻、第一财经、同花顺与财联社，证据等级 B 至 C。"}],"children":[]},{"h":"12.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 12-2 双抗与多抗（肿瘤）头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["康方生物","董事长兼 CEO 夏瑜","上市公司，股东以公告为准","完成从发现到全球 III 期的完整链条，是国内双抗方向执行力最强的团队之一（推断）"],["三生制药","管理层以公告为准","上市公司，股东以公告为准","以成熟商业化药企身份完成大额授权，说明传统药企也能产出全球资产（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"12.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"康方生物","lvl":3,"blocks":[{"p":"2026 年上半年康方营业总收入 18.06 亿元，同比增长 27.92%，期内亏损 4.47 亿元，同比收窄 23.98%，经营现金流净额转正至 2.90 亿元。依沃西的 FDA 审评结果是 2026 年底最重要的事件（推断）。"}],"children":[]},{"h":"三生制药","lvl":3,"blocks":[{"p":"三生制药的交易首付款在中国授权交易中位居前列且已全额到账，说明 PD-1/VEGF 双抗在交易时点具备稀缺性。后续同类资产的议价能力会明显下降（推断）。"}],"children":[]}]},{"h":"12.6 投资判断","lvl":2,"blocks":[{"p":"表 12-3 双抗与多抗（肿瘤）投资判断"},{"t":[["类别","内容"],["会投","全新机制的多特异性分子；具备全球头对头试验设计能力的团队"],["不会投","PD-1/VEGF 等已被锁定组合的跟随项目"],["什么条件下投","早期数据显示相对标准治疗的明确优势；有清晰的联合用药策略"],["必须验证的指标","头对头疗效、总生存期获益、跨人种一致性"],["放弃条件","依沃西海外审评受挫且同类资产交易价格大幅回落"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第十三章 AI 药物发现平台","blocks":[{"p":"本赛道基准得分为 3.30，在十六个细分赛道中排第 10 位，定位为审慎参与。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"13.1 行业分析","lvl":2,"blocks":[{"p":"AI 药物发现的融资规模在 2026 年达到新高。Isomorphic Labs 于 2026 年 5 月完成 21 亿美元 B 轮，估值约 150 亿美元；Chai Discovery 于 2026 年 7 月完成 4 亿美元 C 轮，估值 38 亿美元；字节跳动分拆的 Anew Labs 首轮融资 2.9 亿美元，投后估值约 15 亿美元。临床证据仍然有限，BCG 分析显示 AI 发现分子 I 期成功率 80% 至 90%，但 II 期成功率约 40%，与行业历史水平相近。"},{"p":"中国 AI 制药已有三家港股上市公司。英矽智能于 2025 年 12 月 30 日上市，Rentosertib 于 2026 年 7 月启动 III 期；晶泰科技 2025 年收入 8.03 亿元，首次实现年度盈利；剂泰科技 2026 年 5 月上市，上半年收入 1.543 亿元。一级市场估值显著高于二级市场，剂泰科技与英矽智能最新市值分别约 26 亿美元和 44 亿美元，而 Anew Labs 临床前阶段即估值 15 亿美元（推断）。"}],"children":[]},{"h":"13.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"算法本身难以构成长期壁垒，开源模型和大厂平台在快速压缩模型差距。可持续的壁垒在于自动化湿实验产能、自有数据和管线兑现记录。AI 制药交易普遍采用低首付高里程碑结构，晶泰与 DoveTree 交易首付款约占总额 1%，价值兑现节奏较慢（推断）。"}],"children":[]},{"h":"13.3 头部企业概览","lvl":2,"blocks":[{"p":"表 13-1 AI 药物发现平台头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["英矽智能","生成式 AI 靶点发现与分子设计（Pharma.AI）；Rentosertib（TNIK，特发性肺纤维化）III 期计划入组 320 人；累计 13 个 AI 项目获 IND","2025 年 12 月 30 日港股上市（3696.HK），募资约 23.5 亿港元","管线授权与平台合作","自研管线加平台授权"],["晶泰科技","AI 加机器人自动化实验；DoveTree 首个临床前候选分子进入 IND 准备阶段","港股上市公司（2228.HK）","DoveTree 合作总额最高 59.9 亿美元，已收首付款 5100 万美元与第二笔 1900 万美元","研发服务、里程碑与分成"],["剂泰科技","AI 驱动药物递送，NanoForge 平台整合超过一千万种脂质库；MTS-128 已对外授权，MTS-004 进入 III 期（企业自述）","2026 年 5 月 13 日港股上市，首日收盘市值 274.3 亿港元，期末资金储备 30.25 亿元","2026 年上半年合作协议收入 1.536 亿元，平台合作潜在总额超 60 亿元（企业自述）","资产授权、递送授权与平台部署"],["深势科技","通用 AI for Science 基础设施，覆盖药物与材料的科学计算与智能体","2025 年 12 月 C 轮超 8 亿元，累计融资数十亿元","未披露","软件与平台订阅"],["Anew Labs","字节跳动分拆的 AI 制药业务，最快管线处于临床前","2026 年首轮 2.9 亿美元，投后估值约 15 亿美元，字节跳动保留 56% 股权","未披露","平台加自研管线"]]},{"p":"资料来源为公司公告、券商研报、36 氪、氨基观察、医线 Insight、投资界与 Reuters，证据等级 B 至 C；平台合作潜在总额为企业自述。"}],"children":[]},{"h":"13.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 13-2 AI 药物发现平台头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["英矽智能","创始人兼 CEO Alex Zhavoronkov，联席 CEO 任峰（据公开资料）","上市公司，基石投资者与股东以招股书为准","创始人长期深耕 AI 与衰老研究，临床开发团队已推进到 III 期（推断）"],["晶泰科技","联合创始人温书豪、马健、赖力鹏（据公开资料，均有 MIT 研究背景）","上市公司，股东以公告为准","创始团队有物理化学计算背景，并通过孵化剂泰、投资耀速与希格构建生态（推断）"],["剂泰科技","联合创始人兼 CEO 赖才达，台湾大学化工本科、MIT 化学工程博士，曾任晶泰科技执行 COO 与麦肯锡顾问；联合创始人陈红敏为美国工程院院士、纳米递送专家，另一联合创始人王文首","峰瑞资本（天使轮领投，连续四轮加注）、光速中国；上市基石投资者包括贝莱德、瑞银、国新基金、高瓴","创始人兼具技术与商业背景，资深科学家加持，团队组合在 AI 制药公司中较为均衡（推断）"],["深势科技","联合创始人张林峰、孙伟杰，均为北京大学元培学院校友","达晨财智、京国瑞基金、北京市人工智能产业投资基金、北京市医药健康产业投资基金、联想创投、元禾璞华","年轻创始团队与北京国资基金深度绑定，平台通用性强但医药收入占比需核实（推断）"],["Anew Labs","团队信息未公开披露（待核实）","红杉中国、IDG 资本、高瓴投资领投，五源资本联合领投，高榕创投、春华资本、博裕资本跟投，中国生物制药与上海未来产业基金为战略投资者","依托字节生态的算力与人才，但缺乏已验证的药物开发记录（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"13.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"英矽智能","lvl":3,"blocks":[{"p":"英矽智能是检验 AI 发现新靶点能否转化为临床获益的关键样本。IIa 期结果已发表于 Nature Medicine，III 期以 52 周用力肺活量下降率为主要终点，结果需到 2027 年之后才可读出。在此之前，公司估值主要锚定管线数量与授权，而非 AI 本身（推断）。"}],"children":[]},{"h":"晶泰科技","lvl":3,"blocks":[{"p":"晶泰的核心资产是自动化实验产能，同时作为孵化与投资平台参与剂泰科技、耀速科技、希格生科等公司。对一级市场而言，晶泰既是可比公司，也是潜在联合投资方（推断）。"}],"children":[]},{"h":"剂泰科技","lvl":3,"blocks":[{"p":"剂泰把 AI 用在药物递送而非分子发现，切入点更贴近可验证的工程问题。2026 年上半年收入主要来自单一资产授权，持续性需要更多合作验证（推断）。"}],"children":[]},{"h":"深势科技","lvl":3,"blocks":[{"p":"深势科技的股东中北京市国资基金占比高，属于政策支持型平台。其医药业务与材料业务的收入结构决定了是否适合以生命健康基金投资（推断）。"}],"children":[]},{"h":"Anew Labs","lvl":3,"blocks":[{"p":"Anew Labs 的估值主要为技术平台与字节生态定价，与已上市同行相比溢价明显，不符合本报告先看 Science 再看 AI 的标准（推断）。"}],"children":[]}]},{"h":"13.6 投资判断","lvl":2,"blocks":[{"p":"表 13-3 AI 药物发现平台投资判断"},{"t":[["类别","内容"],["会投","拥有自动化湿实验闭环、按服务收入可覆盖主要成本的研发平台；在递送等可验证工程问题上有数据的公司"],["不会投","只有模型没有自产数据的纯算法公司；以 AI 标签获得估值但收入主要来自一次性项目的公司"],["什么条件下投","按 CRO 收入估算的基础价值不低于投后估值的三分之一；至少一个分子进入临床"],["必须验证的指标","纯预测收入占比、项目数据归属、预测命中率、管线推进速度"],["放弃条件","头部 AI 发现分子 III 期失败；美国规则限制实验自动化相关投资且影响主要客户"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第十四章 代谢与减重","blocks":[{"p":"本赛道基准得分为 3.25，在十六个细分赛道中排第 11 位，定位为审慎参与。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"14.1 行业分析","lvl":2,"blocks":[{"p":"减重是全球最大的单一药物市场，但 2026 年进入存量竞争。至少 5 款临床阶段减重候选药物被跨国药企终止，辉瑞在 2026 年第二季度再次终止两项口服减重管线；司美格鲁肽在中国的核心化合物专利于 2026 年 3 月 20 日到期，替尔泊肽与司美格鲁肽相继降价。"},{"p":"国内口服小分子 GLP-1 进入兑现期。闻泰医药 VCT220 于 2026 年 7 月获 CDE 受理，成为国内首个申报上市的口服小分子 GLP-1，52 周减重 12.4%；博瑞医药 BGM0504 52 周减重 19.3%，上市申请于 6 月受理；恒瑞医药 HRS-7535 公布 III 期数据。国内超过 28 个口服 GLP-1 在研项目，竞争高度拥挤。"}],"children":[]},{"h":"14.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"差异化方向集中在肌肉保留、长效给药、肝脏安全性与联合用药。小核酸减重靶点（如 INHBE）与 GLP-1 联用是重点跟踪的交叉方向（推断）。"}],"children":[]},{"h":"14.3 头部企业概览","lvl":2,"blocks":[{"p":"表 14-1 代谢与减重头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["诚益生物","TRANDD 平台口服小分子；ECC5004（elecoglipron）授权阿斯利康，已推进至 III 期","2023 年底 C 轮 2500 万美元，投后估值 4.98 亿美元；2025 年 10 月港股上市申请获受理","阿斯利康已付 1.85 亿美元预付款及 6000 万美元里程碑","早期授权"],["闻泰医药","围绕肠胃激素与 GPCR 结构的小分子平台；VCT220 III 期达到终点，2026 年 7 月申报上市","2023 年融资近 1 亿元","海外权益相关交易以公告为准","自研加授权"],["Corxel","口服 GLP-1 全球开发，产品在中国已有临床数据（据报道）","2026 年 1 月 D1 轮 2.87 亿美元","未披露","引进开发"]]},{"p":"资料来源为新快报、第一财经、动脉网、BioCentury、BioSpace、新浪财经与摩熵医药，证据等级 B 至 C。"}],"children":[]},{"h":"14.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 14-2 代谢与减重头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["诚益生物","公开渠道未检索到可靠团队信息（待核实）","未检索到完整名单","以一款核心资产授权实现价值，团队持续产出能力需核实（推断）"],["闻泰医药","公开渠道未检索到可靠团队信息（待核实）","未检索到完整名单","已完成国内首个口服小分子 GLP-1 上市申请，临床执行力得到验证（推断）"],["Corxel","公开渠道未检索到可靠团队信息（待核实）","RTW Investments、横店集团资本、SR One、TCG X、RA Capital、HBM Healthcare、SymBiosis、Adage、Invus、SilverArc","美元交叉基金密集进入，后续可能以美股上市为目标（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"14.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"诚益生物","lvl":3,"blocks":[{"p":"诚益生物 2024 年收入约 2.21 亿美元，主要为授权收入，2025 年上半年收入仅约 55.7 万美元，说明收入高度依赖单笔交易（推断）。" 2,"blocks":[{"p":"表 18-3 商业化与支付服务投资判断"},{"t":[["类别","内容"],["会投","与商保创新药目录直接相关、轻资产的支付与理赔技术平台"],["不会投","重资产药房网络与低毛利流通业务"],["什么条件下投","已实现盈利且保司与药企双边收入稳定"],["必须验证的指标","毛利率、单患者支付额、保司续约率"],["放弃条件","商保赔付规模长期停滞"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第十九章 仿制药与集采品种","blocks":[{"p":"本赛道基准得分为 1.85，在十六个细分赛道中排第 16 位，定位为不主动布局。本章依次分析行业现状、壁垒与竞争格局、头部企业的技术范式、融资与授权、团队与已进入机构，并给出投资判断。"}],"children":[{"h":"19.1 行业分析","lvl":2,"blocks":[{"p":"第十一批国家集采按照稳临床、保质量、反内卷、防围标原则设计，医疗机构可按厂牌报量，引入锚点价和复活机制，并要求企业承诺报价不低于成本；272 家企业的 55 种 453 个产品获得拟中选资格，国家组织集采纳入的品种累计达到 490 种。前十批集采品种价格降幅基本在 48% 至 59% 之间。"},{"p":"仿制药价格下行压力有所缓和，但赛道缺乏风险投资所需的成长弹性。行业价值主要体现在头部药企的仿创转型和原料药成本优势（推断）。"}],"children":[]},{"h":"19.2 壁垒与竞争格局","lvl":2,"blocks":[{"p":"壁垒在于规模化成本、质量体系和原料药一体化，属于成熟产业竞争（推断）。"}],"children":[]},{"h":"19.3 头部企业概览","lvl":2,"blocks":[{"p":"表 19-1 仿制药与集采品种头部企业概览"},{"t":[["公司","技术范式与核心资产","融资","BD 与授权","业务模式"],["恒瑞医药","仿制药起家转型创新药，多款减重、肿瘤与自免产品","A+H 上市公司","多项对外授权，包括 HRS-7535 海外权益授予 Kailera","创新药与仿制药并行"]]},{"p":"资料来源为第一财经、新华网、科技日报与每日经济新闻，证据等级 B 至 C。"}],"children":[]},{"h":"19.4 团队与已进入机构","lvl":2,"blocks":[{"p":"表 19-2 仿制药与集采品种头部企业团队与股东"},{"t":[["公司","核心团队","已进入的投资机构","团队与股东评估（推断）"],["恒瑞医药","管理层以公告为准","上市公司，股东以公告为准","仿创转型标杆（推断）"]]},{"p":"团队信息来自公司公告、招股书与媒体报道，标注待核实的为未检索到一手出处的内容；股东信息来自公开融资报道，未披露的不作推测。"}],"children":[]},{"h":"19.5 逐家分析","lvl":2,"blocks":[],"children":[{"h":"恒瑞医药","lvl":3,"blocks":[{"p":"恒瑞医药 2026 年前三季度国内创新药销售收入 138.71 亿元，是传统药企转型的参照，也是早期创新资产的重要买方（推断）。"}],"children":[]}]},{"h":"19.6 投资判断","lvl":2,"blocks":[{"p":"表 19-3 仿制药与集采品种投资判断"},{"t":[["类别","内容"],["会投","不适用"],["不会投","仿制药与集采品种的风险投资"],["什么条件下投","不适用"],["必须验证的指标","不适用"],["放弃条件","不适用"]]},{"p":"全部为推断。"}],"children":[]}]},{"h":"第二十章 技术路线分层与打分方法","blocks":[{"p":"赛道层面的分数无法反映同一赛道内部技术路线之间的差异。以小核酸为例，肝靶向 siRNA 已经完成商业化验证，小激活 RNA 仍在验证机制与适应症，两者的前瞻性和证据成熟度相差很大，合成一个分数之后都看不出来。本章对价值分化明显的赛道继续拆到技术路线这一层，并纳入尚未形成独立赛道的前沿方向，共六十四条路线统一打分排序，每条路线给出一至三家建议跟踪的标的。"}],"children":[{"h":"20.1 从赛道到技术路线","lvl":2,"blocks":[{"p":"拆分的依据不是机制本身，而是价值在哪一层分化。小核酸按机制和递送两个维度拆，其中肝外递送比机制更接近当前瓶颈；类器官按器官垂类和商业模式拆，肝与肾对应药物毒性评价中需求最明确的两个场景，肿瘤类器官则对应伴随诊断和院内收费，付费方完全不同。赛道排序靠后或路线分化不明显的方向不再拆分，仍按赛道结论处理。"},{"p":"前沿路线指尚未形成独立赛道、但可能在五年内改变某一赛道格局的方向，包括物理介入治疗、新分子模态、器官与再生、测量与数据生产、诊断与监测以及人工智能与物理世界结合六类。这些路线共同的特点是证据成熟度低、可比交易少，因此不进入正式投资排序，而是放入期权池单独跟踪。"}],"children":[]},{"h":"20.2 路线打分模型","lvl":2,"blocks":[{"p":"路线层面的评估标准与赛道层面不同。赛道打分关心市场空间与退出，路线打分关心这条路本身能否走通，因此把证据成熟度拆成科学成立度与转化可行性两项，并保留前瞻性 30% 的权重。"},{"p":"表 20-1 技术路线打分维度与权重"},{"t":[["维度","权重","含义"],["前瞻性","30%","五年后是否仍是产业格局的变量，而非当前已被占满的位置"],["科学成立度","15%","机制是否有独立复现的证据，而非单一团队的自述"],["转化可行性","15%","工程瓶颈是否已被识别，首个落地场景是否明确"],["中国优势","15%","供应链、临床资源、工程能力或原创机制是否在中国"],["注册与支付","10%","按药、器械还是组合产品申报，谁付费，路径是否存在"],["竞争与估值窗口","10%","进入者数量与当前估值是否还留有介入空间"],["鲁信适配度","5%","与机构现有能力、国资属性和区域产业资源的匹配度"]]},{"p":"权重设置为推断，与第三章赛道模型中前瞻性 30% 的取向保持一致。"},{"p":"每个维度按 1 至 5 分评分，1 分表示明显不利，5 分表示明显有利。为检验排序对权重设置的敏感性，另设三套情景。等权情景取消权重差异；前瞻性加重情景把前瞻性提高到 40%；证据优先情景把科学成立度与转化可行性各提高到 25%，用于模拟对不确定性容忍度较低时的排序。"},{"p":"表 20-2 四套权重情景"},{"t":[["情景","七个维度权重（%）"],["基准","30 / 15 / 15 / 15 / 10 / 10 / 5"],["等权","14 / 14 / 14 / 14 / 14 / 14 / 14"],["前瞻性加重","40 / 12 / 12 / 13 / 8 / 10 / 5"],["证据优先","15 / 25 / 25 / 13 / 10 / 7 / 5"]]},{"p":"维度顺序为前瞻性、科学成立度、转化可行性、中国优势、注册与支付、竞争与估值窗口、鲁信适配度；等权情景取整显示。"}],"children":[]},{"h":"20.3 全部技术路线排序","lvl":2,"blocks":[{"img":"image6.png"},{"p":"图 4 基准权重下得分前二十二的技术路线"},{"p":"六十四条路线中，得分 4.0 分以上的十八条进入重点跟踪，3.6 至 3.99 分的三十二条为主动看项目，3.2 至 3.59 分的十条保持观察，低于 3.2 分的四条暂不投入。前沿路线在高分段占比接近一半，说明其中已有相当一部分具备与成熟赛道同等的介入价值（推断）。"},{"p":"表 20-3 六十四条技术路线基准排序"},{"t":[["排序","技术路线","所属方向","基准得分","定位"],["1","小激活 RNA（RNAa）","小核酸","4.20","重点跟踪"],["2","表观遗传编辑","基因编辑","4.20","重点跟踪"],["3","侵入式脑机接口（读取方向）","物理介入（电）","4.20","重点跟踪"],["4","脑机接口上游部件与植入装备","物理介入（电）","4.20","重点跟踪"],["5","RNA 编辑（ADAR 招募）","新分子模态","4.15","重点跟踪"],["6","α 核素与锕 225 供应","医用同位素与核药","4.10","重点跟踪"],["7","异种器官移植","器官与再生","4.10","重点跟踪"],["8","高通量扰动筛选","测量与数据生产","4.10","重点跟踪"],["9","皮下蛋白型 TCE","自免与免疫重置","4.05","重点跟踪"],["10","肝外递送","小核酸","4.05","重点跟踪"],["11","肝与肾毒性评价类器官","类器官与 NAMs","4.05","重点跟踪"],["12","自适应与闭环神经调控","物理介入（电）","4.05","重点跟踪"
