name = "lucion-saidao-gateway"
main = "worker.js"
compatibility_date = "2025-06-01"

[vars]
LLM_PROVIDER = "openai"
LLM_BASE_URL = "https://api.deepseek.com"
LLM_MODEL = "deepseek-chat"
SEARCH_PROVIDER = ""
# 部署后改成你的 GitHub Pages 地址，例如 https://yourname.github.io
ALLOWED_ORIGINS = "*"
# Secrets (not here): npx wrangler secret put LLM_API_KEY / SEARCH_API_KEY / ACCESS_CODE
