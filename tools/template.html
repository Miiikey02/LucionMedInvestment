<title>医药赛道研究库</title>
<style>
/* Layout: white masthead with the LUCION logo and gold-ruled tabs; overview opens on a white hero with a rotating blue and gold DNA double helix, then a grid of charts. White ground throughout; the report's 宝蓝 #033491 and 铜金 #B88248 are accents only. Single light theme by design. */
:root{
  --brand:#033491; --brand-deep:#021d57; --brand-soft:#e6ecf8; --brand-ink:#033491;
  --gold:#b88248; --gold-hi:#d9a96b; --gold-soft:#f6ecdf; --gold-ink:#8a5a26;
  --bg:#f3f6fc; --panel:#ffffff; --ink:#16213a; --muted:#595959; --line:#e3e7ef; --soft:#f3f5f9;
  --th:#033491; --th-ink:#ffffff;
  --focus:#0f7a6b; --focus-soft:#dcf1ec; --watch:#a8650b; --watch-soft:#f8ecd9; --skip:#7a8291; --skip-soft:#eceef2;
  --plate:#ffffff; --shadow:0 1px 2px rgba(3,52,145,.06),0 10px 30px rgba(3,52,145,.07);
  color-scheme:light;
  --f-body:"Microsoft YaHei","微软雅黑","Noto Sans SC","PingFang SC",system-ui,sans-serif;
  --f-num:"Bahnschrift","DIN Alternate","DIN Condensed","Arial Narrow","Microsoft YaHei",sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.75}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:#ffffff}
a{color:var(--brand-ink);text-decoration-color:color-mix(in srgb,var(--gold) 60%,transparent);text-underline-offset:3px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wrap{max-width:1600px;margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
@media (max-width:560px){.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:.01em}

/* masthead */
header.mast{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);color:var(--ink);border-top:4px solid var(--brand);border-bottom:1px solid var(--line);box-shadow:0 6px 24px rgba(3,52,145,.06)}
.mast-row{display:flex;align-items:center;gap:14px 24px;padding-block:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:16px;margin-right:auto;min-width:0;text-decoration:none;color:var(--brand)}
.brand img{height:46px;width:auto;flex:none}
.brand .t{display:flex;flex-direction:column;line-height:1.25;padding-left:16px;border-left:1px solid var(--line);min-width:0}
.brand b{font-size:19px;letter-spacing:.06em}
.brand span{font-size:12px;color:var(--muted)}
@media (max-width:620px){.brand .t span{display:none}.brand img{height:34px}}
.search{position:relative;flex:1 1 300px;max-width:460px}
.search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--line);border-radius:10px;background:var(--soft);color:var(--ink);transition:background .25s var(--ease),border-color .25s}
.search input::placeholder{color:#8a93a6}
.search input:focus{background:#fff;outline:none;border-color:var(--gold);box-shadow:0 0 0 3px var(--gold-soft)}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;stroke:#8a93a6;fill:none}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;box-shadow:0 16px 40px rgba(2,20,60,.28);max-height:62vh;overflow:auto;z-index:20}
.results a{display:block;padding:9px 14px;text-decoration:none;color:var(--ink);border-bottom:1px solid var(--soft)}
.results a:hover,.results a.sel{background:var(--brand-soft)}
.results small{display:block;color:var(--muted);font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.results .kind{font-size:11px;color:var(--gold-ink);margin-right:8px;letter-spacing:.08em}
nav.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:8px 16px 11px;text-decoration:none;color:var(--muted);white-space:nowrap;position:relative;transition:color .25s;font-size:16.5px}
nav.tabs a:hover{color:var(--brand)}
nav.tabs a.on{color:var(--brand);font-weight:500;background:var(--brand-soft);border-radius:10px 10px 0 0}
nav.tabs a::after{content:"";position:absolute;left:16px;right:16px;bottom:0;height:3px;border-radius:3px 3px 0 0;background:var(--gold);transform:scaleX(0);transition:transform .4s var(--ease)}
nav.tabs a.on::after{transform:scaleX(1)}
nav.tabs .num{font-size:13px;color:var(--gold);margin-left:6px}

main{padding-block:0 72px}
.view{animation:rise .55s var(--ease)}
@keyframes rise{from{transform:translateY(12px)}to{transform:none}}
h1,h2,h3{text-wrap:balance;line-height:1.35;margin:0;font-weight:700}
h1{font-size:36px;letter-spacing:.02em}
h2{font-size:22px}
h3{font-size:18px}
.eyebrow{font-size:12.5px;letter-spacing:.16em;color:var(--gold-ink);display:flex;align-items:center;gap:8px}
.eyebrow::before{content:"";width:20px;height:2px;background:var(--gold)}
.lede{color:var(--muted);max-width:72ch;margin:8px 0 0}
.stack{display:flex;flex-direction:column;gap:22px}
.page-head{padding-block:32px 4px}
.page-head h1,.detail-head h1{color:var(--brand)}
.panel{background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:16px;padding:22px 24px;box-shadow:var(--shadow);min-width:0}
.panel-h{display:flex;align-items:baseline;justify-content:space-between;gap:8px 16px;flex-wrap:wrap;margin-bottom:14px}
.panel-h h2,.panel-h h3{display:flex;align-items:center;gap:10px}
.panel-h h2::before,.panel-h h3::before{content:"";width:4px;height:1em;background:var(--gold);border-radius:2px}
.panel-h h2,.panel-h h3{color:var(--brand)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:22px}
.grid2 > *{min-width:0}
.g-wide{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:22px}
@media (max-width:980px){.g-wide{grid-template-columns:1fr}}

/* hero */
.hero{position:relative;background:radial-gradient(70% 95% at 78% 40%,#dfe8fa 0%,#eef3fc 40%,#ffffff 78%);color:var(--ink);overflow:hidden;border-bottom:4px solid var(--brand)}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(255,255,255,.92) 0%,rgba(255,255,255,.6) 36%,rgba(255,255,255,0) 62%);pointer-events:none}
.hero .wrap{position:relative;z-index:1;min-height:clamp(420px,58vh,600px);display:flex;flex-direction:column;justify-content:center;padding-block:48px 40px}
.hero .eyebrow{color:var(--gold-ink)}
.hero h1{font-size:clamp(30px,4.4vw,58px);line-height:1.2;max-width:15em;margin-top:14px;letter-spacing:.03em}
.hero h1{color:var(--brand)}
.hero h1 em{font-style:normal;color:var(--gold)}
.hero p{color:var(--muted);max-width:46ch;margin:14px 0 0;font-size:16.5px}
.facts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:14px;margin-top:34px;max-width:900px}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fact{padding:14px 16px;border:1px solid var(--line);border-top:3px solid var(--brand);border-radius:12px;background:rgba(255,255,255,.85);backdrop-filter:blur(6px);text-decoration:none;color:var(--ink);box-shadow:var(--shadow);transition:transform .3s var(--ease),border-color .3s}
.fact:hover{transform:translateY(-3px);border-color:var(--gold);border-top-color:var(--gold)}
.fact:nth-child(even){border-top-color:var(--gold)}
.fact b{display:block;font-family:var(--f-num);font-size:48px;line-height:1.05;color:var(--brand);font-weight:600}
.fact span{font-size:14px;color:var(--muted)}

/* prose & tables */
.prose p{margin:0 0 12px;max-width:76ch}
.prose p.cap{font-size:14px;color:var(--brand-ink);margin:20px 0 6px;font-weight:500}
.prose p.src{font-size:13px;color:var(--muted)}
.prose h3{margin:28px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.prose h3:first-child{margin-top:0}
.prose h4{font-size:16px;margin:20px 0 6px;color:var(--brand-ink)}
.tag-inf{font-size:12px;color:var(--gold-ink);background:var(--gold-soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
.tag-ev{font-family:var(--f-num);font-size:12.5px;color:var(--brand-ink);background:var(--brand-soft);padding:1px 6px;border-radius:4px;white-space:nowrap}
figure{margin:12px 0 16px;background:var(--plate);border-radius:8px;padding:10px;max-width:860px;border:1px solid var(--line)}
figure img{display:block;width:100%;height:auto}
.tbl{overflow-x:auto;margin:6px 0 16px;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:14px;line-height:1.6}
th,td{padding:9px 12px;text-align:left;vertical-align:top;border-bottom:1px solid var(--soft)}
th{background:var(--th);color:var(--th-ink);font-weight:400;font-size:13px;white-space:nowrap;text-align:center;border-bottom:2px solid var(--gold)}
td.c{text-align:center}
tr:last-child td{border-bottom:0}
tbody tr:nth-child(even) td{background:#fafbfd}
.prose table td{min-width:7em}
tr.click{cursor:pointer;transition:background .2s}
tr.click:hover td{background:var(--gold-soft)}

.pill{display:inline-block;font-size:12.5px;padding:1px 10px;border-radius:999px;white-space:nowrap}
.p-重点跟踪{background:var(--brand);color:#fff}
.p-主动看项目{background:var(--gold-soft);color:var(--gold-ink);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gold) 50%,transparent)}
.p-保持观察{background:var(--soft);color:var(--brand-ink)}
.p-暂不投入{background:var(--skip-soft);color:var(--skip)}
.bar{position:relative;height:9px;background:var(--soft);border-radius:5px;min-width:70px;overflow:hidden}
.bar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brand),color-mix(in srgb,var(--brand) 70%,var(--gold)));border-radius:5px;transition:width .6s var(--ease)}
.scorecell{display:flex;align-items:center;gap:10px}
.scorecell .num{width:2.6em;font-size:16px}
.heat{display:inline-grid;place-items:center;width:30px;height:26px;border-radius:6px;font-family:var(--f-num);font-size:15px}
.h1{background:var(--soft);color:var(--muted)}
.h2{background:color-mix(in srgb,var(--brand) 16%,var(--panel));color:var(--ink)}
.h3{background:color-mix(in srgb,var(--brand) 36%,var(--panel));color:var(--ink)}
.h4{background:color-mix(in srgb,var(--brand) 66%,var(--panel));color:#fff}
.h5{background:var(--brand);color:#fff;box-shadow:inset 0 -3px 0 var(--gold)}
.rankdelta{font-size:12.5px;font-family:var(--f-num)}
.up{color:var(--focus)} .dn{color:var(--watch)}

.controls{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin-bottom:14px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap;background:var(--panel)}
.seg button{border:0;background:transparent;padding:7px 16px;cursor:pointer;color:var(--muted);transition:background .25s,color .25s}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--brand);color:#fff;box-shadow:inset 0 -2px 0 var(--gold)}
.chip{border:1px solid var(--line);background:var(--panel);border-radius:999px;padding:4px 14px;cursor:pointer;font-size:13.5px;color:var(--muted);transition:all .25s var(--ease)}
.chip:hover{border-color:var(--gold)}
.chip.on{border-color:var(--gold);color:var(--gold-ink);background:var(--gold-soft)}
select,.field{border:1px solid var(--line);border-radius:10px;padding:7px 12px;background:var(--panel)}
.sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 20px;margin:4px 0 16px}
.sliders label{display:grid;grid-template-columns:1fr auto;gap:2px 8px;font-size:13.5px;color:var(--muted)}
.sliders input{grid-column:1/-1;accent-color:var(--gold);width:100%}
.note{font-size:13px;color:var(--muted)}

.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.card{display:flex;flex-direction:column;gap:6px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;text-decoration:none;color:var(--ink);min-width:0;position:relative;transition:transform .35s var(--ease),box-shadow .35s var(--ease),border-color .35s}
.card::before{content:"";position:absolute;left:18px;right:18px;top:0;height:2px;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.card:hover{transform:translateY(-4px);box-shadow:var(--shadow);border-color:var(--brand)}
.card:hover::before{transform:scaleX(1)}
.card b{font-size:17px;color:var(--brand)}
.card .meta{font-size:12.5px;color:var(--gold-ink)}
.card p{margin:0;font-size:13.5px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card .badge{position:absolute;right:12px;top:12px;font-size:11.5px;background:var(--gold);color:#fff;padding:0 8px;border-radius:999px}

.dl{display:grid;grid-template-columns:9em 1fr;gap:12px 18px;margin:0}
.dl dt{color:var(--gold-ink);font-size:13.5px}
.dl dd{margin:0;min-width:0}
@media (max-width:560px){.dl{grid-template-columns:1fr;gap:2px}.dl dd{margin-bottom:10px}}
.back{font-size:13.5px;text-decoration:none;color:var(--muted);display:inline-block;margin-top:22px}
.back:hover{color:var(--gold-ink)}
.detail-head{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;padding-block:8px 4px}
.bigscore{text-align:right}
.bigscore b{display:block;font-family:var(--f-num);font-size:60px;line-height:1;font-weight:600;color:var(--brand-ink)}
.bigscore b::after{content:"";display:block;height:3px;background:var(--gold);margin-top:6px;border-radius:2px}
.bigscore small{font-size:13px;color:var(--muted);display:block;margin-top:6px}
.metaline{display:flex;gap:8px 14px;flex-wrap:wrap;align-items:center;margin-top:10px;font-size:14px;color:var(--muted)}
.linklist{display:flex;flex-wrap:wrap;gap:8px}
.linklist a,.linklist span{font-size:14px;padding:3px 12px;border:1px solid var(--line);border-radius:6px;text-decoration:none}
.linklist a{border-color:color-mix(in srgb,var(--gold) 60%,var(--line));background:var(--gold-soft);color:var(--gold-ink)}
.linklist span{color:var(--muted)}
.pm{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pm div{padding:10px 12px;border-radius:8px;font-size:14px}
.pm .plus{background:var(--brand-soft)} .pm .minus{background:var(--gold-soft)}
.pm span{display:block;font-size:12.5px;color:var(--muted);margin-bottom:2px}
@media (max-width:560px){.pm{grid-template-columns:1fr}}

/* charts */
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-body);font-size:13.5px}
.chart .lbl{fill:var(--ink);font-size:15px}
.chart .val{fill:var(--brand-ink);font-family:var(--f-num);font-size:17px}
.chart svg.px{width:100%;height:auto}
.noanim *{animation:none!important}
.panel.fill{display:flex;flex-direction:column}
.panel.fill [data-chart]{flex:1}
.chart .grid{stroke:var(--line);stroke-width:1}
.chart .hb{fill:var(--brand);opacity:.78;transition:opacity .25s;transform-box:fill-box;transform-origin:left center;animation:grow .9s var(--ease) both}
.chart .hb.top{opacity:1}
.chart .hb-cap{fill:var(--gold)}
@keyframes grow{from{transform:scaleX(.55)}to{transform:none}}
.chart g.row{cursor:pointer}
.chart g.row:hover .hb{opacity:1}
.chart g.row:hover .lbl{fill:var(--gold-ink)}
.chart .dot{stroke:var(--panel);stroke-width:1.5;cursor:pointer;transition:transform .2s var(--ease);transform-box:fill-box;transform-origin:center}
.chart .dot:hover{transform:scale(1.45)}
.d-重点跟踪{fill:var(--brand);background:var(--brand)} .d-主动看项目{fill:var(--gold);background:var(--gold)} .d-保持观察{fill:color-mix(in srgb,var(--brand) 55%,var(--panel));background:color-mix(in srgb,var(--brand) 55%,var(--panel))} .d-暂不投入{fill:var(--skip);background:var(--skip)}
.legend{display:flex;gap:16px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.legend i{display:inline-block;width:11px;height:11px;border-radius:50%;margin-right:6px;vertical-align:-1px}
.tip{position:fixed;pointer-events:none;background:#fff;color:var(--ink);font-size:13px;padding:7px 11px;border-radius:8px;border:1px solid var(--line);border-left:3px solid var(--gold);box-shadow:0 8px 24px rgba(3,52,145,.14);z-index:40;max-width:280px;line-height:1.5}
.radar .poly{fill:color-mix(in srgb,var(--brand) 22%,transparent);stroke:var(--brand);stroke-width:2;stroke-dasharray:900;animation:draw 1.4s var(--ease) 1}
.radar .ring{fill:none;stroke:var(--line)}
.radar .pt{fill:var(--gold)}
@keyframes draw{from{stroke-dashoffset:900}to{stroke-dashoffset:0}}
.donut .arc{transition:opacity .25s;cursor:default}
.donut:hover .arc{opacity:.55}.donut .arc:hover{opacity:1}
.donut .big{font-family:var(--f-num);font-size:44px;fill:var(--ink);font-weight:600}
.donut-wrap{display:grid;grid-template-columns:minmax(0,240px) 1fr;gap:18px;align-items:center}
@media (max-width:520px){.donut-wrap{grid-template-columns:1fr}.donut-wrap .chart{max-width:220px;margin:0 auto}}
.dl-pos{display:flex;flex-direction:column;gap:10px}
.dl-pos div{display:grid;grid-template-columns:14px 1fr auto;gap:10px;align-items:center;font-size:15px}
.dl-pos i{width:12px;height:12px;border-radius:3px}
.dl-pos b{font-family:var(--f-num);font-size:26px;font-weight:600}
.hm{display:grid;grid-template-columns:minmax(150px,1.6fr) repeat(7,minmax(38px,1fr)) minmax(70px,1fr);gap:5px;min-width:760px;font-size:15px}
.hm .hd{color:var(--muted);font-size:12.5px;text-align:center;padding-bottom:4px}
.hm .nm{display:flex;align-items:center;padding-right:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:pointer}
.hm .cell{height:40px;border-radius:7px;display:grid;place-items:center;font-family:var(--f-num);font-size:18px;cursor:pointer;transition:transform .2s var(--ease)}
.hm .cell:hover{transform:scale(1.08)}
.hm .cell.heat{width:auto}
.chart .sb{transform-box:fill-box;transform-origin:left center;animation:grow .9s var(--ease) both}
.hm .tot{display:flex;align-items:center;justify-content:center;font-family:var(--f-num);font-size:19px;color:var(--brand-ink);cursor:pointer}
.hm .row-hover{color:var(--gold-ink)}
.hm-wrap{overflow-x:auto}
.mini-feed{display:flex;flex-direction:column}
.mini-feed a{display:grid;grid-template-columns:62px 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--soft);text-decoration:none;color:var(--ink)}
.mini-feed a:last-child{border-bottom:0}
.mini-feed time{font-family:var(--f-num);color:var(--gold-ink);font-size:16px}
.mini-feed small{grid-column:2;color:var(--muted);font-size:12.5px}

/* pipeline */
.pipe{display:flex;flex-direction:column}
.pipe-h,.pipe-r{display:grid;grid-template-columns:minmax(150px,1.1fr) minmax(180px,1.5fr) minmax(300px,2.4fr) minmax(130px,1fr);gap:8px 18px;align-items:center}
.pipe-h{font-size:12.5px;color:var(--muted);padding:0 0 8px;border-bottom:2px solid var(--gold)}
.pipe-h .stg{display:grid;grid-template-columns:repeat(7,1fr);text-align:center}
.pipe-r{padding:14px 0;border-bottom:1px solid var(--soft)}
.pipe-r:last-child{border-bottom:0}
.pipe-r .as{font-weight:700;color:var(--brand);font-size:16px;line-height:1.35}
.pipe-r .as small{display:block;font-weight:400;color:var(--muted);font-size:12.5px;margin-top:2px}
.pipe-r .ti{font-size:14px;line-height:1.5}.pipe-r .ti span{display:block;color:var(--muted);font-size:13px}
.pipe-r .pt{font-size:13.5px;color:var(--gold-ink)}
.track{position:relative;height:30px;display:grid;grid-template-columns:repeat(7,1fr);align-items:center}
.track i{height:8px;background:var(--soft);border-right:2px solid #fff}
.track i:first-child{border-radius:4px 0 0 4px}.track i:last-of-type{border-radius:0 4px 4px 0}
.track .fill{position:absolute;left:0;top:11px;height:8px;border-radius:4px;background:linear-gradient(90deg,#7f9ae0,var(--brand));transform-origin:left;animation:pgrow 1s var(--ease) both}

<script>
const D = JSON.parse(document.getElementById('data').textContent);
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = n => n.toFixed(2);
const POS = ['重点跟踪','主动看项目','保持观察','暂不投入'];
const SHORT_DIMS = ['前瞻性','市场','中国优势','竞争','证据','估值退出','适配'];
const SCEN = {'基准':[30,15,15,10,10,10,10],'等权':[1,1,1,1,1,1,1],'前瞻性加重':[40,12,12,9,9,9,9],'地缘压力':[30,15,5,10,20,10,10]};
const ROUTE_SCEN = ['基准','等权','前瞻性加重','证据优先'];
const U = D.updates || {last_run:null,items:[]};
D.tracks.forEach((t,i)=>t.id=i); D.routes.forEach((r,i)=>r.id=i); D.companies.forEach((c,i)=>c.id=i);
const key = n => String(n).split(/[（(]/)[0].trim();
const trackByName = n => D.tracks.find(t=>t.name===n);
D.routes.forEach(r=>{
  if(r.group.startsWith('21.')){
    const first=r.group.replace(/^[\d.]+\s*/,'').split(' ')[0].replace(/与.*$/,'');
    const t=D.tracks.find(t=>t.name.startsWith(first)); if(t) r.track=t.id;
  }
  r.targetList = r.targets ? r.targets.split('、').map(s=>s.trim()).filter(Boolean) : [];
});
const companyFor = name => D.companies.find(c=>c.name===name || key(c.name)===key(name));
const routesForCompany = c => D.routes.filter(r=>r.targetList.some(t=>key(t)===key(c.name)));
const updatesFor = (type,name) => U.items.filter(u=>u.entity_type===type && key(u.entity)===key(name));
const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

// ---------- text
function inline(s){
  return esc(s).replace(/[（(]推断[）)]/g,'<span class="tag-inf">推断</span>')
    .replace(/证据等级\s*([A-D](?:\s*至\s*[A-D])?)/g,'<span class="tag-ev">证据 $1</span>');
}
const isShort = v => v.length<=8;
function tableHTML(rows){
  if(!rows.length) return '';
  const [h,...b]=rows; const center=h.map((_,i)=>b.every(r=>isShort(r[i]||'')));
  return `<div class="tbl"><table><thead><tr>${h.map(c=>`<th>${esc(c)}</th>`).join('')}</tr></thead><tbody>${
    b.map(r=>`<tr>${r.map((c,i)=>`<td${center[i]?' class="c"':''}>${inline(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
}
function blocksHTML(blocks){
  return (blocks||[]).map(b=>{
    if(b.img) return `<figure><img src="fig/${esc(b.img)}" alt="报告插图" loading="lazy"></figure>`;
    if(b.t) return tableHTML(b.t);
    const p=b.p;
    if(/^(表|图)\s?[\dA-Z]+(-\d+)?\s/.test(p)) return `<p class="cap">${esc(p)}</p>`;
    if(/^(资料来源|得分、定位与标的选择为推断)/.test(p)) return `<p class="src">${inline(p)}</p>`;
    return `<p>${inline(p)}</p>`;
  }).join('');
}
function sectionHTML(n,depth=3){const tag=depth<=3?'h3':'h4';return `<${tag}>${esc(n.h)}</${tag}>${blocksHTML(n.blocks)}${n.children.map(c=>sectionHTML(c,depth+1)).join('')}`;}
const STAGES=['临床前','IND','I 期','II 期','III 期','申报上市','已上市'];
const stageIdx=s=>s==='临床'?2:STAGES.indexOf(s);
const isDyn=src=>String(src||'').startsWith('动态');
function topStage(c){const it=(c.pipeline&&c.pipeline.items)||[];let m=-1;it.forEach(x=>{m=Math.max(m,stageIdx(x.stage));});return m;}
function pipelineHTML(c){
  const pl=c.pipeline||{items:[]}; const it=pl.items||[];
  if(pl.platform||!it.length) return `<div class="feed-empty">该企业以平台或服务为主，报告未列出药物管线。${pl.note?esc(pl.note)+'。':''}</div>`;
  return `<div class="pipe"><div class="pipe-h"><span>资产</span><span>靶点与适应症</span><span class="stg">${STAGES.map(s=>`<span>${s.replace(' 期','')}</span>`).join('')}</span><span>合作方</span></div>
  ${it.map((x,i)=>{const k=stageIdx(x.stage);const w=k<0?0:((k+.5)/7*100);
    const bar=k<0?`<span class="na">阶段未披露</span>`:`<span class="fill ${x.stage==='临床'?'dash':''}" style="width:calc(${w.toFixed(2)}% );animation-delay:${i*90}ms"></span>`;
    return `<div class="pipe-r"><div class="as">${esc(x.asset)}${isDyn(x.source)?`<span class="src-dyn" title="来自报告后动态">${esc(x.source)}</span>`:''}${x.stage_note?`<small>${inline(x.stage_note)}</small>`:''}</div>
      <div class="ti">${esc(x.target||'未披露')}<span>${esc(x.indication||'适应症未披露')}</span></div>
      <div class="track" title="${esc(x.stage==='临床'?'已进入临床，期别未披露':x.stage)}">${STAGES.map(()=>'<i></i>').join('')}${bar}<span class="stx">${esc(x.stage==='临床'?'临床（期别未披露）':x.stage)}</span></div>
      <div class="pt">${esc(x.partner||'')}</div></div>`;}).join('')}</div>
  ${pl.note?`<p class="pipe-note">${esc(pl.note)}。</p>`:''}<p class="pipe-note">阶段依据报告原文与报告后动态整理，虚线表示已进入临床但期别未披露。</p>`;
}
function miniPipe(c){
  const pl=c.pipeline||{}; const it=pl.items||[];
  if(pl.platform||!it.length) return `<div class="mini-pipe">平台与服务型企业</div>`;
  const m=topStage(c);
  return `<div class="mini-pipe"><span class="segs">${STAGES.map((_,i)=>`<b class="${i===m?'top':i<m?'on':''}"></b>`).join('')}</span><span>管线 ${it.length} 项${m>=0?` · 最高 ${STAGES[m]}`:''}</span></div>`;
}
const posPill = p => `<span class="pill p-${p}">${p}</span>`;
const scoreCell = (s,max=5) => `<div class="scorecell"><span class="num">${fmt(s)}</span><div class="bar" style="flex:1"><i style="width:${(s/max*100).toFixed(1)}%"></i></div></div>`;
const panelH = (title,right='',lvl='h2') => `<div class="panel-h"><${lvl}>${title}</${lvl}>${right}</div>`;
const txtOf = bs => (bs||[]).map(b=>b.p||(b.t||[]).map(r=>r.join(' | ')).join('\n')).filter(Boolean).join('\n');

// ---------- state
const S={scen:'基准',w:[...SCEN['基准']],rq:'',rpos:new Set(),rdir:'',rsort:'rank',cq:'',ctrack:'',ut:''};
try{const s=JSON.parse(localStorage.getItem('lucion-sd')||'{}');if(s.scen){S.scen=s.scen;S.w=s.w||S.w;}}catch(e){}
const save=()=>{try{localStorage.setItem('lucion-sd',JSON.stringify({scen:S.scen,w:S.w}));}catch(e){}};
const weighted=(t,w)=>{const sw=w.reduce((a,b)=>a+b,0)||1;return t.scores.reduce((a,s,i)=>a+s*w[i],0)/sw;};
const ranked=w=>D.tracks.map(t=>({t,score:weighted(t,w)})).sort((a,b)=>b.score-a.score||a.t.rank-b.t.rank);

// ---------- charts
function trackBars(W,H){
  if(W<600){ const rowH=48,axis=26,H2=D.tracks.length*rowH+axis,padR=56,x=v=>(v-1)/4*(W-padR);
    return `<svg class="px" width="${W}" height="${H2}" viewBox="0 0 ${W} ${H2}" role="img" aria-label="16 个赛道基准得分">
      ${[1,2,3,4,5].map(t=>`<line class="grid" x1="${x(t)}" x2="${x(t)}" y1="0" y2="${H2-axis+4}"/><text x="${Math.max(6,x(t))}" y="${H2-6}" text-anchor="middle" class="num">${t}</text>`).join('')}
      ${D.tracks.map((t,i)=>{const y=i*rowH;return `<g class="row" data-go="#track-${t.id}"><text class="lbl" x="0" y="${y+17}">${esc(t.name)}</text>

// ---------- DNA helix
let helixStop=null;
function startHelix(cv){
  if(helixStop) helixStop();
  const ctx=cv.getContext('2d'); let W=0,H=0,dpr=1,raf=0,alive=true,visible=true;
  const parts=Array.from({length:46},()=>({x:Math.random(),y:Math.random(),r:Math.random()*1.5+.4,v:Math.random()*.012+.004,a:Math.random()*.5+.2}));
  const helices=[{cx:.68,cy:.5,rot:-.34,amp:.25,len:1.25,speed:.55,alpha:.95,step:15,turn:4.3},{cx:.3,cy:.86,rot:-.34,amp:.1,len:.9,speed:.38,alpha:.22,step:12,turn:3.6}];
  function size(){dpr=Math.min(2,window.devicePixelRatio||1);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*dpr);cv.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0);}
  const smooth=x=>x<=0?0:x>=1?1:x*x*(3-2*x);
  function drawHelix(h,t){
    const A=Math.min(H*h.amp,170), L=Math.hypot(W,H)*h.len, k=2*Math.PI/(A*h.turn), n=Math.ceil(L/h.step);
    ctx.save(); ctx.translate(W*h.cx,H*h.cy); ctx.rotate(h.rot);
    const pts=[];
    for(let i=0;i<=n;i++){
      const x=-L/2+i*h.step, ph=x*k+t*h.speed*2*Math.PI/ (h.turn*0.9);
      const s=Math.sin(ph), c=Math.cos(ph), edge=smooth(Math.min(i,n-i)/(n*0.18));
      pts.push({x,ya:A*s,za:c,yb:-A*s,zb:-c,edge,rung:i%2===0});
    }
    // rungs (base pairs) behind strands
    for(const p of pts){ if(!p.rung) continue;
      const al=(0.10+0.22*(1-Math.abs(p.za)))*p.edge*h.alpha;
      const g=ctx.createLinearGradient(0,p.ya,0,p.yb); g.addColorStop(0,`rgba(184,130,72,${al})`); g.addColorStop(1,`rgba(3,52,145,${al*0.8})`);
      ctx.strokeStyle=g; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(p.x,p.ya); ctx.lineTo(p.x,p.yb); ctx.stroke(); }
    // backbones, segment by segment so depth shades the line
    const strand=(yk,zk,rgb,w)=>{for(let i=1;i<pts.length;i++){const a=pts[i-1],b=pts[i];const z=(a[zk]+b[zk])/2;
      const al=(0.25+0.6*(z+1)/2)*Math.min(a.edge,b.edge)*h.alpha; ctx.strokeStyle=`rgba(${rgb},${al})`; ctx.lineWidth=w*(0.55+0.45*(z+1)/2);
      ctx.beginPath(); ctx.moveTo(a.x,a[yk]); ctx.lineTo(b.x,b[yk]); ctx.stroke();}};
    ctx.lineCap='round'; strand('yb','zb','3,52,145',3); strand('ya','za','184,130,72',3.4);
    // nucleotide nodes, back to front
    const nodes=[]; for(const p of pts){ if(!p.rung) continue; nodes.push({x:p.x,y:p.ya,z:p.za,g:true,e:p.edge}); nodes.push({x:p.x,y:p.yb,z:p.zb,g:false,e:p.edge}); }
    nodes.sort((a,b)=>a.z-b.z);
    for(const q of nodes){ const d=(q.z+1)/2, rad=2.2+3.2*d, al=(0.35+0.65*d)*q.e*h.alpha;
      ctx.fillStyle=q.g?`rgba(196,140,78,${al})`:`rgba(18,72,170,${al})`;
      if(d>0.75){ctx.shadowColor=q.g?'rgba(184,130,72,.45)':'rgba(3,52,145,.35)';ctx.shadowBlur=8*h.alpha;} else ctx.shadowBlur=0;
      ctx.beginPath(); ctx.arc(q.x,q.y,rad,0,Math.PI*2); ctx.fill(); }
    ctx.shadowBlur=0; ctx.restore();
  }
  let last=performance.now(), t=0;
  function frame(now){
    if(!alive) return;
    const dt=Math.min(0.05,(now-last)/1000); last=now; t+=dt;
    ctx.clearRect(0,0,W,H);
    for(const p of parts){ p.y-=p.v*dt*6; if(p.y<-0.02){p.y=1.02;p.x=Math.random();}
      ctx.fillStyle=`rgba(3,52,145,${p.a*0.22})`; ctx.beginPath(); ctx.arc(p.x*W,p.y*H,p.r,0,Math.PI*2); ctx.fill(); }
    for(const h of helices) drawHelix(h,t);
    if(!reduceMotion && visible) raf=requestAnimationFrame(frame);
  }
  const resume=()=>{ if(alive && visible && !reduceMotion){ cancelAnimationFrame(raf); last=performance.now(); raf=requestAnimationFrame(frame);} };
  const io=new IntersectionObserver(es=>{visible=es[0].isIntersecting&&!document.hidden; if(visible) resume(); else cancelAnimationFrame(raf);});
  io.observe(cv);
  const onVis=()=>{visible=!document.hidden; if(visible) resume(); else cancelAnimationFrame(raf);};
  const onResize=()=>{size(); if(reduceMotion) frame(performance.now());};
  document.addEventListener('visibilitychange',onVis); addEventListener('resize',onResize,{passive:true});
  size(); frame(performance.now());
  helixStop=()=>{alive=false;cancelAnimationFrame(raf);io.disconnect();document.removeEventListener('visibilitychange',onVis);removeEventListener('resize',onResize);helixStop=null;};
}

  if(h==='tracks'){v='tracks';html=vTracks();CTX={kind:'tracks',label:'细分赛道列表'};}
  else if(m=h.match(/^track-(\d+)$/)){v='tracks';html=vTrack(+m[1]);const t=D.tracks[+m[1]];if(t)CTX={kind:'track',name:t.name,label:t.name};}
  else if(h==='routes'){v='routes';html=vRoutes();CTX={kind:'routes',label:'技术路线列表'};}
  else if(m=h.match(/^route-(\d+)$/)){v='routes';html=vRoute(+m[1]);const r=D.routes[+m[1]];if(r)CTX={kind:'route',name:r.name,label:r.name};}
  else if(h==='companies'){v='companies';html=vCompanies();CTX={kind:'companies',label:'企业库'};}
  else if(m=h.match(/^company-(\d+)$/)){v='companies';html=vCompany(+m[1]);const c=D.companies[+m[1]];if(c)CTX={kind:'company',name:c.name,label:c.name};}
  else if(h==='updates'){v='updates';html=vUpdates();}
  else if(h==='report'||/^ch-\d+$/.test(h)){v='report';html=vReport();}
  else html=vOverview();
  const same=v==='report'&&$('#view').dataset.v==='report';
  if(!same){ if(helixStop) helixStop(); const el=$('#view');el.innerHTML=`<div class="view">${html}</div>`;el.dataset.v=v;}
  document.querySelectorAll('#tabs a').forEach(a=>a.classList.toggle('on',a.dataset.v===v));
  const on=document.querySelector('#tabs a.on'); if(on){const n=$('#tabs');n.scrollTo({left:on.offsetLeft-n.clientWidth/2+on.clientWidth/2,behavior:'smooth'});}
  if(h==='routes')fillRoutes(); if(h==='companies')fillCompanies();

function compactCompany(c){return {name:c.name,track:c.track,tech_and_assets:c.tech,financing:c.fund,bd_and_licensing:c.bd,business_model:c.model,core_team:c.team,investors:c.investors,team_assessment:c.teamEval,analysis:txtOf(c.analysis),routes_listing_it:routesForCompany(c).map(r=>r.name),pipeline:c.pipeline,updates:updatesFor('company',c.name)};}

function libSearch(q,limit=8){
  q=String(q||'').trim(); if(!q) return [];
  const terms=q.split(/[\s,，、;；]+/).filter(Boolean);
  const grams=new Set(); terms.forEach(tm=>{ if(tm.length<=2) grams.add(tm); else for(let i=0;i<tm.length-1;i++) grams.add(tm.slice(i,i+2)); });
  const docs=[...D.tracks.map(t=>({kind:'track',name:t.name,text:[t.name,t.logic,t.action,t.plus,t.minus,trackChapter(t,6000)].join(' ')})),
    ...D.routes.map(r=>({kind:'route',name:r.name,text:[r.name,r.dir,r.targets,txtOf(r.detail)].join(' ')})),
    ...D.companies.map(c=>({kind:'company',name:c.name,text:[c.name,c.track,c.tech,c.fund,c.bd,c.model,c.team,c.investors,c.teamEval,txtOf(c.analysis),JSON.stringify(c.pipeline||{})].join(' ')})),
    ...U.items.map(u=>({kind:'update',name:`${u.date} ${u.entity} ${u.title}`,text:[u.entity,u.title,u.summary,u.type].join(' ')}))];
  return docs.map(d=>{let s=0;terms.forEach(tm=>{if(d.name.includes(tm))s+=12;let i=d.text.indexOf(tm),n=0;while(i>=0&&n<5){s+=3;n++;i=d.text.indexOf(tm,i+1);}});grams.forEach(g=>{if(d.text.includes(g))s+=1;});
    const p=Math.max(0,...terms.map(tm=>d.text.indexOf(tm)));return {kind:d.kind,name:d.name,score:s,snippet:d.text.slice(Math.max(0,p-40),p+120)};})
    .filter(d=>d.score>2).sort((a,b)=>b.score-a.score).slice(0,limit);
}

const clip=(o,max=24000)=>{const s=typeof o==='string'?o:JSON.stringify(o);return s.length>max?s.slice(0,max)+' …（已截断）':s;};

async function getJSON(url,signal){
  let r; try{ r=await fetch(url,{signal,headers:{accept:'application/json'}}); }catch(e){ if(e.name==='AbortError') throw e; throw new Error('网络无法访问 '+new URL(url).host); }
  if(!r.ok) throw new Error(new URL(url).host+' 返回 '+r.status); return r.json();
}
function ctStudy(s){const p=s.protocolSection||{};const id=p.identificationModule||{},st=p.statusModule||{},de=p.designModule||{},sp=p.sponsorCollaboratorsModule||{},co=p.conditionsModule||{},ar=p.armsInterventionsModule||{};
  return {nct_id:id.nctId,title:id.briefTitle,status:st.overallStatus,phase:(de.phases||[]).join(' '),sponsor:sp.leadSponsor?.name||'',conditions:(co.conditions||[]).slice(0,4),interventions:(ar.interventions||[]).map(i=>i.name).slice(0,4),start_date:st.startDateStruct?.date||'',enrollment:de.enrollmentInfo?.count??null};}
async function ctSearch(i,signal){
  const q=new URLSearchParams({pageSize:String(Math.min(20,Number(i.page_size)||10)),format:'json'});
  if(i.intervention)q.set('query.intr',String(i.intervention)); if(i.condition)q.set('query.cond',String(i.condition));
  if(i.sponsor)q.set('query.spons',String(i.sponsor)); if(i.term)q.set('query.term',String(i.term));
  if(i.status)q.set('filter.overallStatus',[].concat(i.status).join(','));
  if(![...q.keys()].some(k=>k.startsWith('query.'))) throw new Error('至少提供 intervention、condition、sponsor 或 term 之一');
  const d=await getJSON('https://clinicaltrials.gov/api/v2/studies?'+q,signal);
  AI.src.ct='ok'; return {total_returned:(d.studies||[]).length,studies:(d.studies||[]).map(ctStudy)};
}
async function ctDetail(i,signal){
  const id=String(i.nct_id||'').toUpperCase().replace(/^(?!NCT)/,'NCT'); if(!/^NCT\d{8}$/.test(id)) throw new Error('NCT 编号格式应为 NCT 加 8 位数字');
  const d=await getJSON('https://clinicaltrials.gov/api/v2/studies/'+id+'?format=json',signal); const p=d.protocolSection||{};
  return {...ctStudy(d),brief_summary:(p.descriptionModule?.briefSummary||'').slice(0,2500),primary_outcomes:(p.outcomesModule?.primaryOutcomes||[]).map(o=>o.measure).slice(0,5),eligibility:(p.eligibilityModule?.eligibilityCriteria||'').slice(0,2500),locations:(p.contactsLocationsModule?.locations||[]).slice(0,8).map(l=>[l.facility,l.city,l.country].filter(Boolean).join(', '))};
}

function accessCode(){try{return localStorage.getItem('lucion-ai-code')||'';}catch(e){return '';}}
async function gw(path,body,signal){
  if(!GATEWAY) throw new Error('未配置 AI 网关');
  let r; try{ r=await fetch(GATEWAY+path,{method:'POST',signal,headers:{'content-type':'application/json','x-access-code':accessCode()},body:JSON.stringify(body)}); }
  catch(e){ if(e.name==='AbortError') throw e; throw new Error('无法连接 AI 网关'); }
  const d=await r.json().catch(()=>({}));
  if(!r.ok){ const err=new Error(d.message||('AI 网关返回 '+r.status)); err.code=d.error||String(r.status); throw err; }
  return d;
}

function mdToHTML(md){
  const lines=String(md).replace(/\*\*(.+?)\*\*/g,'$1').split('\n'); let out='',list=null,tbl=[];
  const flushList=()=>{if(list){out+=`</${list}>`;list=null;}};
  const flushTbl=()=>{if(tbl.length){const rows=tbl.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)).map(r=>r.replace(/^\s*\||\|\s*$/g,'').split('|').map(c=>c.trim()));
    out+=`<div class="tbl"><table><thead><tr>${rows[0].map(c=>`<th>${ent(c)}</th>`).join('')}</tr></thead><tbody>${rows.slice(1).map(r=>`<tr>${r.map(c=>`<td>${ent(c)}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;tbl=[];}};
  for(const raw of lines){const l=raw.trimEnd();
    if(/^\s*\|.*\|\s*$/.test(l)){flushList();tbl.push(l);continue;} else flushTbl();
    let m;
    if(m=l.match(/^#{1,6}\s+(.*)/)){flushList();out+=`<h4>${ent(m[1])}</h4>`;}
    else if(m=l.match(/^\s*[-*•]\s+(.*)/)){if(list!=='ul'){flushList();out+='<ul>';list='ul';}out+=`<li>${ent(m[1])}</li>`;}
    else if(m=l.match(/^\s*\d+[.、)]\s+(.*)/)){if(list!=='ol'){flushList();out+='<ol>';list='ol';}out+=`<li>${ent(m[1])}</li>`;}
    else if(!l.trim()){flushList();}
    else {flushList();out+=`<p>${ent(l)}</p>`;}
  }
  flushList();flushTbl();return out;
}
function ent(s){
  return inline(s).replace(/(https?:\/\/[^\s<）)」]+)/g,'<a href="$1" target="_blank" rel="noopener">$1</a>')
    .replace(/【([^】]{1,40})】/g,(all,n)=>{const c=findCompany(n),r=D.routes.find(x=>x.name===n||key(x.name)===key(n)),t=D.tracks.find(x=>x.name===n||key(x.name)===key(n));
    const href=c&&key(c.name)===key(n)?`#company-${c.id}`:r?`#route-${r.id}`:t?`#track-${t.id}`:c?`#company-${c.id}`:null;
    return href?`<a class="ent" href="${href}">${n}</a>`:n;});
}

const ERRTXT={bad_access_code:'访问码不正确，请重新输入。',rate_limited:'请求过于频繁或额度不足，请稍后再试。',ai_not_configured:'AI 网关未配置模型。'};
async function aiAsk(q){
  q=String(q||'').trim(); if(!q||AI.busy) return;
  openDrawer(); if(!AI.ready||(AI.health.access_code_required&&!accessCode())) return;
  AI.busy=true; $('#aiSend').textContent='停止';
  // earlier questions go back as plain question/answer pairs: no tool steps, no provider-native blocks
  let conv=AI.turns.filter(t=>t.msg&&(t.msg.role==='user'||(t.msg.role==='assistant'&&!(t.msg.tool_calls&&t.msg.tool_calls.length)))).map(t=>t.msg.role==='assistant'?{role:'assistant',content:t.msg.content||''}:t.msg).slice(-12);
  while(conv.length&&conv[0].role!=='user') conv.shift();
  const user={role:'user',content:`${ctxBlock()}\n\n问题 ${q}`};
  AI.turns.push({role:'user',show:q,msg:user});
  const view={role:'ui',pending:true,status:'思考中',html:''}; AI.turns.push(view); AI.cur=view; aiRender();
  AI.ctl=new AbortController(); const signal=AI.ctl.signal;
  const msgs=[...conv,user]; const tools=activeTools();
  try{
    for(let round=0;round<7;round++){
      const d=await gw('/chat',{system:RULES,messages:msgs,tools:round<6?tools.map(({name,description,parameters})=>({name,description,parameters})):[]},signal);
      const m=d.message||{}; msgs.push(m);
      if(!m.tool_calls||!m.tool_calls.length){
        view.pending=false; view.html=mdToHTML(m.content||'（没有得到回答）');
        AI.turns.push({msg:m}); break;
      }
      if(m.content){view.html=mdToHTML(m.content);}
      AI.turns.push({msg:m});
      const results=await Promise.all(m.tool_calls.map(async c=>{
        const t=TOOLS.find(x=>x.name===c.name); let out;
        try{ if(!t) throw new Error('没有这个工具'); out=clip(await t.run(c.arguments||{},signal)); }
        catch(e){ if(e.name==='AbortError') throw e; out='Error: '+(e.message||e); }
        return {role:'tool',tool_call_id:c.id,name:c.name,content:out};
      }));
      results.forEach(r=>{msgs.push(r);AI.turns.push({msg:r});});
      renderSrc(); aiRender();
    }
    if(view.pending){view.pending=false;view.err='查询步骤过多，请把问题拆小一点。';}
  }catch(e){
    view.pending=false;
    if(e.name==='AbortError'){view.err='已停止。';}
    else{ view.err=ERRTXT[e.code]||e.message||'连接中断，可以再问一次。'; if(e.code==='bad_access_code'){try{localStorage.removeItem('lucion-ai-code');}catch(_){}} }
    // drop the unfinished exchange from the model-facing history so the next question starts clean
    const idx=AI.turns.indexOf(view); AI.turns=AI.turns.filter((t,i)=>i<=idx||!t.msg);
    AI.turns.forEach((t,i)=>{ if(i>AI.turns.indexOf(view)) delete t.msg; });
    const ui=AI.turns.findIndex(t=>t.msg===user); if(ui>=0) delete AI.turns[ui].msg;
  }finally{AI.busy=false;$('#aiSend').textContent='提问';aiRender();}
}
async function ctLookup(){
  const box=$('#ctBox'), btn=$('#ctBtn'); const m=location.hash.match(/company-(\d+)/); if(!box||!m) return;
  const c=D.companies[+m[1]];
  const codes=[...new Set((c.pipeline.items||[]).map(x=>x.asset.split(/[（(]/)[0].trim()).filter(a=>/[A-Za-z]{2,}/.test(a)))].slice(0,6);
  btn.disabled=true; box.innerHTML=`<div class="note"><span class="dots"><i></i><i></i><i></i></span> 正在查询 ${esc(codes.join('、'))}</div>`;
  const rows=[]; const errs=[];
  await Promise.all(codes.map(async code=>{ try{ const d=await ctSearch({intervention:code,page_size:5}); d.studies.forEach(t=>rows.push({code,...t})); }catch(e){ errs.push(`${code} ${e.message}`); } }));
  btn.disabled=false;
  const uniq=[...new Map(rows.map(r=>[r.nct_id,r])).values()];
  box.innerHTML=(uniq.length?`<div class="tbl"><table><thead><tr><th>资产</th><th>NCT 编号</th><th>试验</th><th>状态</th><th>分期</th><th>申办方</th><th>开始</th></tr></thead><tbody>${uniq.map(t=>`<tr><td class="c">${esc(t.code)}</td><td class="c"><a href="https://clinicaltrials.gov/study/${esc(t.nct_id)}" target="_blank" rel="noopener">${esc(t.nct_id)}</a></td><td>${esc(t.title)}</td><td class="c">${esc(t.status||'')}</td><td class="c">${esc(t.phase||'')}</td><td>${esc(t.sponsor||'')}</td><td class="c">${esc(t.start_date||'')}</td></tr>`).join('')}</tbody></table></div><p class="pipe-note">来源 ClinicalTrials.gov 实时查询，按资产代号匹配，可能包含同名但无关的试验，使用前请核对申办方。</p>`
    :`<div class="feed-empty">ClinicalTrials.gov 中未检索到以 ${esc(codes.join('、'))} 登记的试验。</div>`)+(errs.length?`<p class="pipe-note">${esc(errs.join('；'))}</p>`:'');
}
function openDrawer(){ $('#drawer').classList.add('open'); $('#drawer').setAttribute('aria-hidden','false'); $('#scrim').classList.add('on'); aiRender(); setTimeout(()=>$('#aiInput').focus(),350); }
function closeDrawer(){ $('#drawer').classList.remove('open'); $('#drawer').setAttribute('aria-hidden','true'); $('#scrim').classList.remove('on'); }
$('#fab').addEventListener('click',openDrawer);
$('#aiClose').addEventListener('click',closeDrawer); $('#scrim').addEventListener('click',closeDrawer);
$('#aiClear').addEventListener('click',()=>{if(AI.busy)AI.ctl?.abort();AI.turns=[];aiRender();});
$('#aiSend').addEventListener('click',()=>{if(AI.busy){AI.ctl?.abort();return;}const v=$('#aiInput').value;$('#aiInput').value='';aiAsk(v);});
$('#aiInput').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey&&!e.isComposing){e.preventDefault();$('#aiSend').click();}});
$('#aiBody').addEventListener('click',e=>{ if(e.target.closest('#aiCodeBtn')){ const v=$('#aiCode').value.trim(); if(v){try{localStorage.setItem('lucion-ai-code',v);}catch(_){} aiRender();} } });
$('#aiBody').addEventListener('keydown',e=>{ if(e.target.id==='aiCode'&&e.key==='Enter'){ $('#aiCodeBtn').click(); } });

renderSrc(); checkGateway();

// ---------- events
document.addEventListener('click',e=>{
  const ask=e.target.closest('[data-ask]'); if(ask){aiAsk(ask.dataset.ask);return;}
  if(e.target.closest('#ctBtn')){ctLookup();return;}
  if(e.target.closest('#askInlineBtn')){const v=$('#askInline').value;$('#askInline').value='';aiAsk(v);return;}
  const sc=e.target.closest('[data-scen]'); if(sc){S.scen=sc.dataset.scen;if(S.scen!=='自定义')S.w=[...SCEN[S.scen]];save();route();return;}
  const pc=e.target.closest('[data-pos]'); if(pc){const p=pc.dataset.pos;S.rpos.has(p)?S.rpos.delete(p):S.rpos.add(p);pc.classList.toggle('on');fillRoutes();return;}
  const ut=e.target.closest('[data-ut]'); if(ut){S.ut=ut.dataset.ut;route();return;}
  const go=e.target.closest('[data-go]'); if(go&&!e.target.closest('a')){$('#tip').hidden=true;location.hash=go.dataset.go;}
  if(e.target.closest('.msg a.ent')) closeDrawer();
  if(!e.target.closest('.search'))$('#results').hidden=true;
});
document.addEventListener('keydown',e=>{if(e.target.id==='askInline'&&e.key==='Enter'&&!e.isComposing){const v=e.target.value;e.target.value='';aiAsk(v);}});
document.addEventListener('mousemove',e=>{const t=e.target.closest&&e.target.closest('[data-tip]');const tip=$('#tip');
  if(t){tip.textContent=t.dataset.tip;tip.hidden=false;tip.style.left=Math.min(innerWidth-290,e.clientX+14)+'px';tip.style.top=(e.clientY+14)+'px';}else tip.hidden=true;},{passive:true});
document.addEventListener('input',e=>{const id=e.target.id;
  if(e.target.dataset.w!=null){S.w[+e.target.dataset.w]=+e.target.value;save();const y=scrollY;route();scrollTo(0,y);document.getElementById(id)?.focus();}
  else if(id==='rq'){S.rq=e.target.value;fillRoutes();} else if(id==='cq'){S.cq=e.target.value;fillCompanies();}});
document.addEventListener('change',e=>{const id=e.target.id;
  if(id==='rdir'){S.rdir=e.target.value;fillRoutes();} else if(id==='rsort'){S.rsort=e.target.value;fillRoutes();} else if(id==='ctrack'){S.ctrack=e.target.value;fillCompanies();}});

// ---------- global search
const IDX=[];
D.tracks.forEach(t=>IDX.push({k:'赛道',title:t.name,href:'#track-'+t.id,text:[t.name,t.logic,t.action,t.plus,t.minus].join(' ')}));
D.routes.forEach(r=>IDX.push({k:'路线',title:r.name,href:'#route-'+r.id,text:[r.name,r.dir,r.targets,txtOf(r.detail)].join(' ')}));
D.companies.forEach(c=>IDX.push({k:'企业',title:c.name,href:'#company-'+c.id,text:[c.name,c.track,c.tech,c.fund,c.bd,c.model,c.team,c.investors,c.teamEval,txtOf(c.analysis)].join(' ')}));
U.items.forEach(u=>IDX.push({k:'动态',title:u.entity+' '+u.title,href:'#updates',text:[u.entity,u.title,u.summary,u.type].join(' ')}));
D.tree.forEach((n,i)=>{IDX.push({k:'章节',title:n.h,href:'#ch-'+i,text:n.h+' '+txtOf(n.blocks)});(function rec(ns){ns.forEach(c=>{IDX.push({k:'正文',title:c.h,sub:n.h,href:'#ch-'+i,text:c.h+' '+txtOf(c.blocks)});rec(c.children);});})(n.children);});
const ORDER={'赛道':0,'路线':1,'企业':2,'动态':3,'章节':4,'正文':5}; let sel=-1;
function search(q){q=q.trim().toLowerCase();const box=$('#results');sel=-1;if(!q){box.hidden=true;return;}
  const hits=IDX.map(it=>{const ti=it.title.toLowerCase().includes(q),xi=it.text.toLowerCase().indexOf(q);if(!ti&&xi<0)return null;const p=xi<0?0:xi;return {...it,score:(ti?0:10)+ORDER[it.k],snip:it.text.slice(Math.max(0,p-16),p+44)};}).filter(Boolean).sort((a,b)=>a.score-b.score).slice(0,30);
  box.innerHTML=hits.length?hits.map(h=>`<a href="${h.href}"><span class="kind">${h.k}</span>${esc(h.title)}${h.sub?`<span class="note"> · ${esc(h.sub)}</span>`:''}<small>${esc(h.snip)}</small></a>`).join(''):'<div class="empty">无结果</div>';box.hidden=false;}
$('#q').addEventListener('input',e=>search(e.target.value));
$('#q').addEventListener('focus',e=>{if(e.target.value)search(e.target.value)});
$('#q').addEventListener('keydown',e=>{const as=[...document.querySelectorAll('#results a')];
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();sel=Math.max(0,Math.min(as.length-1,sel+(e.key==='ArrowDown'?1:-1)));as.forEach((a,i)=>a.classList.toggle('sel',i===sel));as[sel]?.scrollIntoView({block:'nearest'});}
  if(e.key==='Enter'&&as.length){location.hash=as[Math.max(sel,0)].getAttribute('href');$('#results').hidden=true;e.target.blur();}
  if(e.key==='Escape')$('#results').hidden=true;});
$('#results').addEventListener('click',e=>{if(e.target.closest('a'))$('#results').hidden=true;});
$('#updCount').textContent=U.items.length||'';
route();
</script>
